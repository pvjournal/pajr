  /* ── Auto-detect language from text (simple trigram heuristic) ─────── */
  function detectLangFromText(text){
    if(!text || text.length < 4) return null;
    var devanagari = /[\u0900-\u097F]/; /* Hindi, Marathi */
    var telugu = /[\u0C00-\u0C7F]/;
    var tamil = /[\u0B80-\u0BFF]/;
    var bengali = /[\u0980-\u09FF]/;
    var kannada = /[\u0C80-\u0CFF]/;
    var gujarati = /[\u0A80-\u0AFF]/;
    var malayalam = /[\u0D00-\u0D7F]/;
    var gurmukhi = /[\u0A00-\u0A7F]/;
    var arabic = /[\u0600-\u06FF]/;
    if(telugu.test(text)) return 'te';
    if(tamil.test(text)) return 'ta';
    if(bengali.test(text)) return 'bn';
    if(kannada.test(text)) return 'kn';
    if(gujarati.test(text)) return 'gu';
    if(malayalam.test(text)) return 'ml';
    if(gurmukhi.test(text)) return 'pa';
    if(arabic.test(text)){
      /* Urdu uses Arabic script too — check for Urdu-specific chars */
      var urdu = /[\u0679\u0688\u0691\u06BA\u06BE\u06C1\u06CC\u06D2]/;
      return urdu.test(text) ? 'ur' : 'ar';
    }
    if(devanagari.test(text)){
      /* Marathi-specific: ळ (0933) */
      return /\u0933/.test(text) ? 'mr' : 'hi';
    }
    return null; /* likely English or unknown */
  }

  /* ── File attachment handler ─────────────────────────────────────────── */
  var MAX_FILE_BYTES = 15 * 1024 * 1024; // 15 MB hard limit
  function handleFileSelect(e){
    var rejected = [];
    var files = Array.from(e.target.files||[]);
    e.target.value = '';
    files.forEach(function(file){
      if(file.size > MAX_FILE_BYTES){
        rejected.push(file.name+' ('+Math.round(file.size/1024/1024)+'MB)');
        return;
      }
      var mime    = file.type || 'application/octet-stream';
      var isImage = mime.startsWith('image/');
      var isText  = mime.startsWith('text/') || /json|csv|xml/.test(mime);
      var pid     = Date.now() + '_' + Math.random().toString(36).slice(2,8);

      var reader = new FileReader();
      reader.onload = function(ev){
        var dataUrl = ev.target.result;
        /* Add the attachment to the UI immediately in `uploading` state — user sees the chip with a spinner */
        setAttachments(function(p){return p.concat([{
          id: pid,
          name: file.name,
          mimeType: mime,
          size: file.size,
          preview: isImage ? dataUrl : null,
          textContent: isImage ? '[Image: '+file.name+']' : (isText ? null : '[File: '+file.name+' ('+mime+')]'),
          uploading: true,
          url: null
        }]);});

        /* Push the binary to Supabase Storage via our /api/upload endpoint.
           The returned URL is then carried in the next chat turn's files[]
           so the server persists it on private_chats.media. */
        var base64 = (dataUrl || '').split(',')[1] || '';
        fetch('/api/upload',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({name:file.name, mime:mime, size:file.size, dataBase64: base64, token: getToken()})
        })
          .then(function(r){
            if(r.ok) return r.json();
            return r.json().then(function(e){
              var err=new Error(e.error||'Upload failed'); err.paywall=e.paywall; throw err;
            });
          })
          .then(function(d){
            setAttachments(function(p){return p.map(function(a){
              if(a.id !== pid) return a;
              return Object.assign({}, a, { uploading:false, url:d.url, kind:d.kind });
            });});
          })
          .catch(function(err){
            console.error('[Upload] '+err.message);
            if(err.paywall==='pro'||err.paywall==='signin'){
              /* Tier-gated: drop the chip and show the right modal */
              setAttachments(function(p){return p.filter(function(a){return a.id!==pid;});});
              if(err.paywall==='pro'){ setPaywall({feature:'attachments',signedIn:true}); }
              else { setModal(true); }
              return;
            }
            setAttachments(function(p){return p.map(function(a){
              if(a.id !== pid) return a;
              return Object.assign({}, a, { uploading:false, uploadError:true });
            });});
          });

        /* For text-like files also load text content so the agent gets the actual prose, not just the URL. */
        if (isText) {
          var tr = new FileReader();
          tr.onload = function(tev){
            var text = (tev.target.result || '').slice(0, 6000);
            setAttachments(function(p){return p.map(function(a){
              if(a.id !== pid) return a;
              return Object.assign({}, a, { textContent: text });
            });});
          };
          tr.readAsText(file);
        }
      };
      reader.readAsDataURL(file);
    });
    if(rejected.length) alert('File(s) exceed the 15MB limit and were not attached:\n• '+rejected.join('\n• '));
  }

  function go(q){

                          h('span',{className:"cmob-db-val"},(v!==true&&v!==false)?t(v):""))
                      : h('span',null,t(row.key)+val)
                  );
                })
              )
            );
          })
        ),
        /* ── Plans & Pricing: the four PaJR Pro subscription periods ── */
        h('div',{className:"comp-pricing"},
          h('div',{className:"comp-pricing-t"},"PaJR Pro — pick your subscription"),
          (billing&&billing.enabled)
          ? h('div',{className:"comp-pricing-grid"},
              billing.plans.filter(function(p){return p.available;}).map(function(p){
                var name=p.months===1?'Monthly':p.months===3?'3 months':p.months===6?'6 months':'Yearly';
                var per=p.months===1?'per month':p.months===12?'per year':'for '+p.months+' months';
                return h('button',{key:p.id,className:"cp-plan",disabled:!!billingBusy,
                    onClick:function(){ if(!uid){ setCompareOpen(false); setModal(true); return; } startCheckout(p.id); }},
                  p.months===12&&h('span',{className:"pw-plan-badge cp-badge"},"BEST VALUE"),
                  h('span',{className:"cp-plan-n"},name),
                  h('span',{className:"cp-plan-p"},billingBusy===p.id?"Redirecting…":("₹"+p.amount.toLocaleString('en-IN'))),
                  h('span',{className:"cp-plan-per"},per)
                );
              })
            )
          : h('div',{className:"pw-secure"},billing===null?"Loading plans…":"Online payments open soon."),
          (billing&&billing.enabled)&&h('div',{className:"pw-secure"},"Secure checkout by Stripe · Cancel anytime"+(!uid?" · Sign in to subscribe":""))
        ),
        h('div',{className:"comp-actions"},
          !uid && h('button',{className:"modal-btn",onClick:function(){setCompareOpen(false);setModal(true);}},t('comp_cta_signup'))
        ),
        h('div',{className:"comp-notes"},
          h('div',null,"* "+t('comp_note_fair')),
          h('div',null,t('comp_note_doctor'))
        )
      )
    )

,

    /* ── Native account / subscription page (plan · entitlements · history · cancel) ── */
    subOpen && h('div',{className:"modal-wrap",onClick:function(e){if(e.target.className==='modal-wrap')setSubOpen(false);}},
      h('div',{className:"modal sub-modal"},
        h('button',{className:"modal-close",onClick:function(){setSubOpen(false);}},IX()),
        h('div',{className:"sub-head"},
          h('div',{className:"sub-title"},"Account & subscription"),
          userContact && h('div',{className:"sub-sub"},userContact)
        ),
        /* Plan card */
        (function(){
          var ms=myStatus, sub=subData&&subData.subscription;
          var proActive=!!(ms&&ms.web&&ms.web.active) || isPro();
          var expires=ms&&ms.web&&ms.web.expires;
          var lifetime=ms&&ms.web&&ms.web.tier==='lifetime';
          var cancelling=!!(sub&&sub.cancel_at_period_end);
          return h('div',{className:"sub-plan"+(proActive?" sub-plan-pro":"")},
            h('div',{className:"sub-plan-top"},
              h('span',{className:"sub-plan-badge"+(proActive?" spb-pro":"")},
                proActive?[IPajrMark("#fff",12),h('span',{key:'x'},"PRO")]:"FREE"),
              h('span',{className:"sub-plan-name"},proActive?"PaJR Pro":"Free plan")
            ),
            h('div',{className:"sub-plan-meta"},
              !proActive ? "Signed-in perks only — upgrade for Pro answers, the WhatsApp companion and the research database."
              : lifetime ? "Lifetime access — never expires."
              : cancelling ? h('span',{className:"sub-warn"},"Ends "+fmtShortDate((sub&&sub.current_period_end)||expires)+" — will not renew.")
              : (sub&&sub.interval) ? ("Renews "+fmtShortDate((sub&&sub.current_period_end)||expires)+(sub&&sub.amount!=null?(" · ₹"+sub.amount.toLocaleString('en-IN')+"/"+(sub.interval==='year'?'yr':'mo')):""))
              : expires ? ("Access until "+fmtShortDate(expires))
              : "Active.")
          );
        })(),
        /* Entitlements */
        myStatus && h('div',{className:"sub-ents"},
          [
            {on:!!(myStatus.web&&myStatus.web.active),t:"PaJR Pro features",d:"Longer answers, attachments, export & the priority model"},
            {on:!!(myStatus.whatsapp&&myStatus.whatsapp.active),t:"WhatsApp care companion",d:(myStatus.whatsapp&&myStatus.whatsapp.active)?(waIsLifetime(myStatus)?"Lifetime access":("Active until "+fmtShortDate(myStatus.whatsapp.expires))):"Chat with PaJR on WhatsApp"},
            {on:!!(myStatus.research&&myStatus.research.active),t:"Research database",d:"Full access to the de-identified patient journeys"}
          ].map(function(en,i){
            return h('div',{key:i,className:"sub-ent"+(en.on?"":" sub-ent-off")},
              h('span',{className:"sub-ent-ck"},en.on?"✓":"—"),
              h('div',{className:"sub-ent-tx"},h('div',{className:"sub-ent-t"},en.t),h('div',{className:"sub-ent-d"},en.d)));
          })
        ),
        /* Actions */
        h('div',{className:"sub-actions"},
          !isPro() && h('button',{className:"sub-btn sub-btn-primary",onClick:function(){setSubOpen(false);setCompareOpen(true);}},"See Pro plans"),
          isPro() && h('button',{className:"sub-btn sub-btn-ghost",onClick:function(){setSubOpen(false);setCompareOpen(true);}},"Change plan"),
          (subData&&subData.subscription&&!subData.subscription.cancel_at_period_end) &&
            h('button',{className:"sub-btn sub-btn-danger",disabled:subBusy==='cancel',
              onClick:function(){ if(window.confirm("Cancel your PaJR Pro subscription?\n\nYou'll keep full access until "+fmtShortDate(subData.subscription.current_period_end)+", then it won't renew.")) cancelSub(false); }},
              subBusy==='cancel'?"Working…":"Cancel subscription"),
          (subData&&subData.subscription&&subData.subscription.cancel_at_period_end) &&
            h('button',{className:"sub-btn sub-btn-primary",disabled:subBusy==='resume',onClick:function(){cancelSub(true);}},
              subBusy==='resume'?"Working…":"Resume subscription"),
          (subData&&subData.customer) &&
            h('button',{className:"sub-btn sub-btn-ghost",onClick:openBillingPortal},"Manage payment method →")
        ),
        /* Payment history */
        h('div',{className:"sub-hist"},
          h('div',{className:"sub-hist-h"},"Payment history"),
          (subData&&subData.loading) ? h('div',{className:"sub-empty"},"Loading…")
          : (subData&&subData.error) ? h('div',{className:"sub-empty"},subData.error)
          : (subData&&subData.payments&&subData.payments.length)
            ? subData.payments.map(function(p){
                var sym=p.currency==='INR'?'₹':(p.currency+' ');
                return h('div',{key:p.id,className:"sub-pay"},
                  h('div',{className:"sub-pay-l"},
                    h('div',{className:"sub-pay-d"},fmtShortDate(p.created)),
                    h('div',{className:"sub-pay-s"+(p.status==='refunded'?" sub-pay-refund":(p.paid?" sub-pay-ok":""))},p.status==='refunded'?"Refunded":(p.paid?"Paid":(p.status||"—")))
                  ),
                  h('div',{className:"sub-pay-r"},
                    p.amount!=null && h('span',{className:"sub-pay-amt"},sym+p.amount.toLocaleString('en-IN')),
                    p.receipt_url && h('a',{className:"sub-pay-rc",href:p.receipt_url,target:"_blank",rel:"noopener noreferrer"},"Receipt")
                  ));
              })
            : h('div',{className:"sub-empty"},"No payments yet."+((subData&&subData.enabled===false)?" Online payments are launching soon.":""))
        ),
        h('div',{className:"sub-foot"},"Secure billing by Stripe · Questions? ",h('a',{href:"mailto:support@pajrhealth.com"},"support@pajrhealth.com"))
      )
    )

,

    /* Image Lightbox — close button, prev/next, and swipe-to-navigate on mobile */
    lightboxImg && h('div',{className:"img-lightbox",
      onClick:function(){setLightboxImg(null);},
      onTouchStart:function(e){if(e.touches&&e.touches.length===1){lbTouchRef.current={x:e.touches[0].clientX,y:e.touches[0].clientY};}},
      onTouchEnd:function(e){
        var s=lbTouchRef.current; if(!s||s.x==null)return; lbTouchRef.current={x:null,y:null};
        var tch=e.changedTouches&&e.changedTouches[0]; if(!tch)return;
        var dx=tch.clientX-s.x, dy=tch.clientY-s.y;
        if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4){e.stopPropagation();lbStep(dx<0?1:-1);}
      }
    },
      h('button',{className:"lb-close",title:"Close",onClick:function(e){e.stopPropagation();setLightboxImg(null);}},"×"),
      (lightboxImg.list&&lightboxImg.list.length>1) && h('button',{className:"lb-nav lb-prev",title:"Previous",onClick:function(e){e.stopPropagation();lbStep(-1);}},"‹"),
      h('div',{className:"lb-stage",onClick:function(e){e.stopPropagation();}},
        h('img',{src:lightboxImg.url,alt:lightboxImg.title||'Image'}),
        lightboxImg.title && h('div',{className:"lb-cap"},lightboxImg.title),
        (lightboxImg.list&&lightboxImg.list.length>1) && h('div',{className:"lb-count"},(lightboxImg.index+1)+" / "+lightboxImg.list.length)
      ),
      (lightboxImg.list&&lightboxImg.list.length>1) && h('button',{className:"lb-nav lb-next",title:"Next",onClick:function(e){e.stopPropagation();lbStep(1);}},"›")
    ),



  ); /* end App return */
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
