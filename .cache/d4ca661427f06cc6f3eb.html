  <!-- Cookie decision banner — shown once on first visit; after a choice it never
       reappears (no floating "Cookie settings" pill). Preferences can be reopened
       any time via window.pajrOpenCookieSettings() (footer "Cookie settings" link). -->
  <script>
  (function(){
    var KEY='pajr_consent', stored=null;
    try{stored=localStorage.getItem(KEY);}catch(e){}
    function g(){ if(window.gtag) window.gtag.apply(null,arguments); }
    function update(granted){ g('consent','update',{analytics_storage:granted?'granted':'denied'}); }
    function save(v){ try{localStorage.setItem(KEY,v);}catch(e){} }
    function style(){
      if(document.getElementById('pjc-style')) return;
      var s=document.createElement('style'); s.id='pjc-style';
      s.textContent="#pajr-consent .pjc-card{position:fixed;left:16px;bottom:16px;z-index:58;max-width:min(420px,calc(100vw - 32px));background:var(--surface,#fff);color:var(--ink,#15212B);border:1px solid var(--line,#E7E3DA);border-radius:14px;box-shadow:0 8px 30px rgba(21,33,43,.16);padding:16px 18px;font-family:'Inter','Figtree',system-ui,sans-serif;font-size:13.5px;line-height:1.5}"
        +"#pajr-consent .pjc-txt strong{font-size:14.5px}"
        +"#pajr-consent .pjc-txt a{color:var(--blue-deep,#0C4A7E);font-weight:600}"
        +"#pajr-consent .pjc-btns{display:flex;gap:10px;margin-top:14px}"
        +"#pajr-consent .pjc-btn{flex:1;padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:inherit}"
        +"#pajr-consent .pjc-btn-primary{background:var(--coral,#FF6B5B);color:#fff}"
        +"#pajr-consent .pjc-btn-ghost{background:transparent;color:var(--ink,#15212B);border-color:var(--line,#E7E3DA)}"
        /* keep clear of the account button + its menu (Log out) on small screens */
        +"@media(max-width:640px){#pajr-consent .pjc-card{bottom:88px}}";
      document.head.appendChild(s);
    }
    function banner(){
      if(document.getElementById('pajr-consent')) return;
      style();
      var w=document.createElement('div'); w.id='pajr-consent';
      w.innerHTML='<div class="pjc-card" role="dialog" aria-live="polite" aria-label="Cookie consent">'
        +'<div class="pjc-txt"><strong>Cookies &amp; analytics</strong><br>'

        +'<button type="button" id="pjc-accept" class="pjc-btn pjc-btn-primary">Accept</button>'
        +'</div></div>';
      document.body.appendChild(w);
      function done(granted,v){ update(granted); save(v); if(w.parentNode)w.parentNode.removeChild(w); }
      document.getElementById('pjc-accept').onclick=function(){done(true,'granted');};
      document.getElementById('pjc-reject').onclick=function(){done(false,'denied');};
    }
    window.pajrOpenCookieSettings = banner;
    function init(){ style(); if(stored!=='granted' && stored!=='denied'){ banner(); } }
    if(document.body){ init(); } else { document.addEventListener('DOMContentLoaded',init); }
  })();

  <style>
    :root{
      --blue:#0284C7;--blue-deep:#0C4A7E;--blue-soft:#E8F5FC;
      --coral:#FF6B5B;--coral-soft:#FFF1EF;--coral-deep:#E04A39;
      --ink:#15212B;--ink1:#1E293B;--ink2:#475569;--ink3:#94A3B8;--teal:#0d9488;
      --paper:#FBFAF7;--paper2:#F2F0EA;--line:#E7E3DA;
      --brand-mark:#0C4A7E;
      --surface:#ffffff;--surface2:#fafbfc;--input-btn:#f8f7f4;
      --sidebar-w:360px;
      --r:14px;
    }
    /* ── DARK MODE ─────────────────────────────────────────────────────── */
    [data-theme="dark"]{
      --blue:#4AA6E6;--blue-deep:#CFE6F7;--blue-soft:#15293B;
      --coral:#FF7D6F;--coral-soft:#2C1B18;--coral-deep:#FF8A7B;
      --ink:#E8EEF4;--ink1:#D8E2EC;--ink2:#A6B3C1;--ink3:#74838F;--teal:#2DD4BF;
      --paper:#0E1621;--paper2:#172230;--line:#27333F;
      --brand-mark:#E8EEF4;
      --surface:#172230;--surface2:#1D2937;--input-btn:#1D2937;
    }
    [data-theme="dark"] body{background:var(--paper);color:var(--ink)}
    [data-theme="dark"] .hero-search-wrap,
    [data-theme="dark"] .chat-input-wrap,
    [data-theme="dark"] .lnav,
    [data-theme="dark"] .sidebar,
    [data-theme="dark"] .modal,
    [data-theme="dark"] .chat-topbar,
    [data-theme="dark"] .cc-recent,
    [data-theme="dark"] .hn-mobile-card,
    [data-theme="dark"] .share-menu,
    [data-theme="dark"] .search-guide-pop,
    [data-theme="dark"] .evidence-card,
    [data-theme="dark"] .testi-feature,
    [data-theme="dark"] .testi-mini,
    [data-theme="dark"] .chat-mic-btn{background:var(--surface)}
    /* The dark `background` shorthand above resets background-clip to border-box,
       which paints the surface fill over the ::before gradient border. Restore
       padding-box clipping so the border stays visible on all four sides. */
    [data-theme="dark"] .hero-search-wrap,
    [data-theme="dark"] .chat-input-wrap{background-clip:padding-box}
    [data-theme="dark"] .evidence-card{border-color:var(--line)}
    [data-theme="dark"] .evidence-card:hover{background:var(--surface2);border-color:#33414f}
    [data-theme="dark"] .hero-nav-inner{background:rgba(23,34,48,.92);border-color:rgba(255,255,255,.08);box-shadow:0 2px 16px rgba(0,0,0,.35)}
    [data-theme="dark"] .home-corner{background:rgba(14,22,33,.85);color:var(--ink1)}
    .home-corner{color:var(--blue-deep)}
    [data-theme="dark"] .topbar-refs svg{color:var(--ink1)}
    [data-theme="dark"] .clip-btn,[data-theme="dark"] .hero-clip,[data-theme="dark"] .hero-mic,
    [data-theme="dark"] .hero-cam,[data-theme="dark"] .chat-cam-btn,[data-theme="dark"] .search-guide-btn,
    [data-theme="dark"] .composer-plus{background:var(--input-btn);border-color:var(--line);color:var(--ink2)}
    [data-theme="dark"] .composer{background:linear-gradient(to top,var(--paper),rgba(14,22,33,.6))}
    [data-theme="dark"] .u-pill{background:linear-gradient(135deg,#16293B,#16202C);border-color:rgba(74,166,230,.18);color:var(--ink)}
    [data-theme="dark"] .md code,[data-theme="dark"] .md th,[data-theme="dark"] .hn-lang-head{background:var(--surface2)}
    [data-theme="dark"] .md img,[data-theme="dark"] .md-img{background:var(--surface2)}
    [data-theme="dark"] .md a{background:#13283B;border-bottom-color:#1E3A5F;color:#7CC4F5}
    [data-theme="dark"] .md a:hover{background:#173248}
    [data-theme="dark"] .hn-lang-item,[data-theme="dark"] .hn-m-item{background:var(--surface);color:var(--ink1)}
    [data-theme="dark"] .hn-lang-item:hover,[data-theme="dark"] .hn-m-item:hover{background:var(--blue-soft)}
    [data-theme="dark"] .continue-card{background:linear-gradient(135deg,#102A1F,#0F1F2B);border-color:#1F4031}
    [data-theme="dark"] .scroll::-webkit-scrollbar-thumb{background:#2A3744}
    [data-theme="dark"] .comp-table th,[data-theme="dark"] .tnc-checkbox-row,[data-theme="dark"] .tnc-pii{background:var(--surface2)}
    [data-theme="dark"] .footer-badge{background:var(--surface2);border-color:var(--line)}
    [data-theme="dark"] .followup-chip,[data-theme="dark"] .topbar-menu,[data-theme="dark"] .lnav-collapse,
    [data-theme="dark"] .share-item,[data-theme="dark"] .how-step,[data-theme="dark"] .chat-img-card{background:var(--surface);color:var(--ink1)}
    [data-theme="dark"] .followup-chip:hover{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-deep)}
    [data-theme="dark"] .topbar-menu,[data-theme="dark"] .lnav-collapse{color:var(--ink2)}
    [data-theme="dark"] .site-footer{background:var(--surface)}
    [data-theme="dark"] .wb-title{color:var(--ink1)}
    [data-theme="dark"] .hint{color:var(--ink3)}
    /* theme toggle button */
    .theme-toggle{background:transparent;border:1px solid rgba(12,74,126,.12);display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:100px;cursor:pointer;color:var(--ink1);transition:all .15s;flex-shrink:0;margin-left:4px}
    .theme-toggle:hover{background:rgba(12,74,126,.06);border-color:rgba(12,74,126,.22)}
    [data-theme="dark"] .theme-toggle{border-color:rgba(255,255,255,.14);color:var(--ink1)}
    [data-theme="dark"] .theme-toggle:hover{background:rgba(255,255,255,.08)}
    .chat-topbar .theme-toggle{margin-left:0}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{background:var(--paper);font-family:'Inter','DM Sans',system-ui,sans-serif;color:var(--ink);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--coral-soft)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

    /* MINIMAL TOP CORNER (chat mode only) — small logo to start over */
    .home-corner{position:fixed;top:14px;left:18px;z-index:90;background:rgba(251,250,247,.85);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:11px;padding:6px 10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px}
    .home-corner:hover{border-color:var(--coral);background:#fff}
    .home-corner img{height:24px;width:auto;display:block}
    .home-corner-label{font-size:12px;font-weight:600;color:var(--ink2);font-family:'Inter','DM Sans',sans-serif}
    .home-corner:hover .home-corner-label{color:var(--coral-deep)}
    .layout.nav-open .home-corner{display:none}

    /* LAYOUT */
    .layout{display:flex;height:100vh;height:100dvh}
    .chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
    .scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
    .scroll::-webkit-scrollbar{width:5px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
    .thread{max-width:780px;margin:0 auto;width:100%;padding:30px 24px 12px}
    /* Chat title bar — pinned at top of conversation, subtle elegance */
    .chat-title-bar{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--paper) 0%,var(--paper) 70%,rgba(251,250,247,0) 100%);padding:22px 0 14px;margin:0 0 18px;display:flex;align-items:baseline;justify-content:space-between;gap:16px}
    .chat-title-text{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;color:var(--blue-deep);letter-spacing:-.015em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .chat-title-meta{font-size:12px;color:var(--ink3);font-weight:500;white-space:nowrap;flex-shrink:0}
    .chat-title-actions{display:flex;align-items:center;gap:12px;flex-shrink:0;align-self:center}
    .cts-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;position:relative;transition:all .14s}
    .cts-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
    .cts-btn svg{flex-shrink:0}

    /* WELCOME */
    .welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:96px 24px 40px;animation:fadeIn .55s ease;position:relative}
    .welcome-logo{height:50px;width:auto;max-width:92vw;margin-bottom:32px;transition:transform .2s ease,filter .2s ease;cursor:pointer}
    .welcome-logo:hover{transform:scale(1.06);filter:drop-shadow(0 4px 16px rgba(12,74,126,0.12))}
    /* Theme toggle centred between "Signed in" and "Log out" in the sidebar footer */
    .lnav-foot-theme{width:30px;height:30px;border-radius:8px;margin:0}
    .hero-nav{position:sticky;top:0;display:flex;justify-content:center;align-items:center;padding:14px 16px;z-index:30}
    .hero-nav-inner{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(12,74,126,.1);border-radius:100px;padding:6px 8px;box-shadow:0 2px 16px rgba(12,74,126,.08);max-width:calc(100vw - 32px)}
    .hn-logo{display:flex;align-items:center;padding:0 8px 0 5px;flex-shrink:0}
    .hn-logo img{height:34px;width:auto;display:block}
    .hn-link{color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:500;padding:7px 14px;border-radius:100px;white-space:nowrap;transition:all .15s;letter-spacing:-.01em}
    .hn-link:hover{color:var(--ink1);background:rgba(12,74,126,.06)}
    /* "The Database" — wordmark image instead of text (light/dark pair) */
    .hn-db{display:inline-flex;align-items:center}
    .hn-db-img{height:13px;width:auto;display:block}
    .hn-m-item.hn-m-db{display:flex;align-items:center}
    .hn-m-db-img{height:14px;width:auto;display:block}
    .hn-pro-ribbon{background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff !important;font-weight:800;font-size:17px;letter-spacing:.04em;padding:6px 16px;border-radius:99px;box-shadow:0 2px 10px rgba(217,119,6,.4);border:1.5px solid #fff;flex-shrink:0;display:inline-flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer;font-family:inherit}
    .hn-cta-mark{display:inline-flex;align-items:center;justify-content:center}
    .hn-pro-ribbon:hover{background:linear-gradient(135deg,#D97706,#B45309);color:#fff !important;box-shadow:0 4px 16px rgba(217,119,6,.44)}
    .hn-contact{color:var(--blue);font-weight:600}
    .hn-contact:hover{color:var(--blue);background:var(--blue-soft)}
    .hn-menu-btn{display:none;background:transparent;border:none;width:38px;height:38px;border-radius:100px;align-items:center;justify-content:center;color:var(--ink1);cursor:pointer;transition:background .15s;flex-shrink:0}
    .hn-menu-btn:hover{background:rgba(12,74,126,.06)}
    .hn-lang-btn{background:transparent;border:none;display:flex;align-items:center;gap:5px;padding:6px 12px 6px 10px;border-radius:100px;color:var(--ink1);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:background .15s;flex-shrink:0;border:1px solid rgba(12,74,126,.12);margin-left:4px}
    .hn-lang-btn:hover{background:rgba(12,74,126,.06);border-color:rgba(12,74,126,.22)}
    .hn-lang-globe{font-size:14px;line-height:1}
    .hn-lang-code{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hn-lang-card{min-width:300px;max-width:340px;max-height:80vh;overflow-y:auto}
    .hn-lang-head{padding:16px 22px;font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line);background:#fafbfc}
    .hn-lang-item{width:100%;box-sizing:border-box;display:flex !important;justify-content:space-between;align-items:center;font-size:15.5px;padding:14px 22px;text-align:left;border:none;background:#fff;border-bottom:1px solid var(--line);cursor:pointer;font-family:inherit;color:var(--ink1);transition:background .12s}
    .hn-lang-item:last-child{border-bottom:none}
    .hn-lang-item:hover{background:var(--blue-soft);color:var(--blue)}
    .hn-lang-item.active{background:#ECFDF5;color:#059669;font-weight:600}
    .hn-lang-native{font-weight:500}
    .hn-lang-check{color:#059669;font-weight:700;font-size:17px;margin-left:12px}
    .hn-mobile-sheet{position:fixed;inset:0;background:rgba(12,74,126,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:76px;animation:fadeIn .2s ease;cursor:pointer}
    .hn-mobile-card{cursor:auto}
    .hn-mobile-card{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(12,74,126,.25);min-width:240px;max-width:calc(100vw - 32px);overflow:hidden;animation:fadeUp .25s ease}
    .hn-m-item{display:block;padding:16px 22px;color:var(--ink1);text-decoration:none;font-size:15px;font-weight:500;border-bottom:1px solid var(--line);transition:background .12s}
    .hn-m-item:last-child{border-bottom:none}
    .hn-m-item:hover,.hn-m-item:active{background:var(--blue-soft);color:var(--blue)}
    .hn-m-contact{color:var(--blue) !important;font-weight:600}
    .welcome h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(28px,4vw,38px);font-weight:600;color:var(--blue-deep);line-height:1.12;letter-spacing:-.02em;margin-bottom:14px;max-width:880px}

    .cs-ico{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;flex-shrink:0}

    /* Live cycling suggestion shown ABOVE the search box */
    .hero-live{max-width:680px;margin:0 auto 14px;width:100%;display:flex;justify-content:center}

    .hero-search{width:100%;max-width:680px;margin-bottom:20px;position:relative}

      width:100%;padding:15px 16px 60px 16px;

    .hero-cam{width:38px!important;height:38px!important;border-radius:11px!important}

    .hero-send:hover{filter:brightness(1.08);transform:scale(1.05)}

    .hero-clip{background:#f8f7f4;border:1.5px solid var(--line);color:var(--ink2);border-radius:13px;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .14s;flex-shrink:0}
    .hero-clip:hover{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}

    .hero-attach-bar{max-width:680px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

    .sugs-label{font-size:12.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-bottom:14px}

    .sug:hover{border-color:var(--coral);color:var(--coral-deep);background:var(--coral-soft);transform:translateY(-1px)}

    /* ── Evidence section ─────────────────────────────────────────────── */
    .evidence{width:100%;max-width:920px;margin:8px auto 28px;padding:24px 20px 20px;border-top:1px solid #e5e7eb;text-align:center}

    .try-chip:hover{border-color:var(--coral);color:var(--coral-deep);background:var(--coral-soft);transform:translateY(-1px);box-shadow:0 2px 8px rgba(239,68,68,.12)}
    /* ── Live search suggestions — shown above the search bar ──────────── */

    @media(max-width:820px){.hero-suggests{margin-bottom:16px;gap:9px;padding:0 14px}.hs-chip{font-size:13px;padding:7px 13px}.hs-label{font-size:13px}}

    .founders-photo img{max-height:720px;width:auto;max-width:100%;object-fit:contain;display:block;filter:drop-shadow(0 14px 30px rgba(12,74,126,.18))}
    .founders-caption{font-size:13px;color:var(--ink2);font-style:italic;text-align:center;max-width:360px;line-height:1.45;margin-top:2px}

    .trust-strip{max-width:820px;margin:24px auto 0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 28px;padding:18px 24px;background:linear-gradient(135deg,rgba(13,148,136,.05),rgba(13,148,136,.08));border:1px solid rgba(13,148,136,.2);border-radius:18px;box-shadow:0 2px 12px rgba(13,148,136,.05)}
    .trust-item{font-size:13.5px;color:var(--ink1);display:flex;align-items:center;gap:9px;font-weight:500;line-height:1.35}
    .trust-icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:22px;height:22px;background:rgba(13,148,136,.1);border-radius:6px}
    .trust-icon svg{width:18px;height:auto}

    /* ── How it works section ────────────────────────────────────── */
    .how-works{width:100%;max-width:none;margin:40px 0 8px;padding:36px 20px 30px;text-align:center;background:linear-gradient(180deg,rgba(13,148,136,.045),rgba(13,148,136,.015))}
    .how-works .how-grid{max-width:920px;margin:0 auto}
    .how-eyebrow{font-size:11.5px;font-weight:700;color:#0d9488;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
    .how-title{font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:24px;font-weight:600;color:var(--blue-deep);line-height:1.25;margin:0 0 22px;letter-spacing:-.015em}
    .how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .how-step{background:#fff;border:1px solid #f0f0f0;border-radius:14px;padding:22px 18px 18px;text-align:center;position:relative;transition:all .2s;animation:howFadeIn .5s ease both}
    .how-step:nth-child(1){animation-delay:.05s}
    .how-step:nth-child(2){animation-delay:.18s}
    .how-step:nth-child(3){animation-delay:.31s}
    .how-step:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(13,148,136,.1);border-color:rgba(13,148,136,.25)}
    @keyframes howFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .how-num{position:absolute;top:10px;right:14px;font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:22px;font-weight:600;color:#0d9488;opacity:.25}
    .how-icon{width:48px;height:48px;background:linear-gradient(135deg,#ECFDF5,#F0F9FF);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
    .how-step-t{font-size:15px;font-weight:600;color:var(--ink1);margin-bottom:6px}
    .how-step-d{font-size:13px;color:var(--ink2);line-height:1.5}

    /* ── Modal email-toggle button ─────────────────────────────────── */
    .modal-email-toggle{background:transparent;border:none;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;padding:6px 0 14px;text-align:left;font-family:inherit;text-decoration:underline;text-underline-offset:3px;transition:color .15s}
    .modal-email-toggle:hover{color:var(--coral)}

    /* ── Two colorful info-CTA buttons replacing How-it-works block ──────── */
    .info-cta-row{max-width:920px;margin:30px auto 8px;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 20px}
    .info-cta{display:flex;align-items:center;gap:14px;padding:18px 20px;border:none;border-radius:18px;cursor:pointer;font-family:inherit;text-align:left;color:#fff;transition:all .22s ease;box-shadow:0 6px 22px rgba(12,74,126,.1);position:relative;overflow:hidden}
    .info-cta::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);transform:translateX(-100%);transition:transform .55s ease}
    .info-cta:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(12,74,126,.18)}
    .info-cta:hover::after{transform:translateX(100%)}
    .info-cta-how{background:#0d9488}
    .info-cta-compare{background:#7C3AED}
    .info-cta-icon{width:42px;height:42px;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .info-cta-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
    .info-cta-title{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
    .info-cta-sub{font-size:12.5px;opacity:.85;font-weight:500}
    .info-cta-arrow{font-size:22px;opacity:.75;font-weight:300;transition:transform .2s}
    .info-cta:hover .info-cta-arrow{transform:translateX(4px);opacity:1}

    /* ── T&C consent modal ─────────────────────────────────────────── */
    .tnc-wrap{align-items:center}
    .tnc-modal{max-width:480px;padding:32px 30px 24px;text-align:left;border-top:5px solid var(--coral);position:relative}
    .tnc-eyebrow{font-size:11px;font-weight:700;color:var(--coral);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
    .tnc-title{font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:22px;font-weight:600;color:var(--blue-deep);margin:0 0 16px;line-height:1.25;letter-spacing:-.015em}
    .tnc-body{font-size:14px;color:var(--ink2);line-height:1.6;margin-bottom:18px}
    .tnc-body p{margin-bottom:10px}
    .tnc-body p:last-child{margin-bottom:0}
    .tnc-body strong{color:var(--ink1);font-weight:600}
    .tnc-body a{color:var(--coral-deep);text-decoration:underline;text-underline-offset:2px}
    .tnc-body a:hover{color:var(--blue-deep)}
    .tnc-checkbox-row{display:flex;align-items:flex-start;gap:10px;padding:14px;border-radius:11px;background:#fafbfc;border:1px solid var(--line);cursor:pointer;margin-bottom:18px;transition:all .15s}
    .tnc-checkbox-row:hover{background:#FFF7ED;border-color:#FECACA}
    .tnc-checkbox-row input[type="checkbox"]{margin-top:2px;width:17px;height:17px;accent-color:var(--coral);cursor:pointer;flex-shrink:0}
    .tnc-checkbox-row span{font-size:13.5px;color:var(--ink1);font-weight:500;line-height:1.4}
    .tnc-actions{display:flex;gap:10px;justify-content:flex-end}
    .tnc-btn{padding:11px 18px;border-radius:11px;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;transition:all .15s}
    .tnc-btn-secondary{background:#f5f5f7;color:var(--ink2)}
    .tnc-btn-secondary:hover{background:#e5e7eb;color:var(--ink1)}
    .tnc-btn-primary{background:var(--coral);color:#fff;box-shadow:0 3px 10px rgba(239,68,68,.25)}
    .tnc-btn-primary:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 6px 16px rgba(239,68,68,.35)}
    .tnc-btn-primary:disabled{opacity:.5;cursor:not-allowed;background:#ccc;box-shadow:none}

    /* ── Consent modal: de-identification quick checklist ───────────── */
    .tnc-pii{background:#fafbfc;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 18px;text-align:left}
    .tnc-pii-t{font-size:13px;font-weight:700;color:var(--ink1);margin-bottom:8px}
    .tnc-pii-list{list-style:none;padding:0;margin:0}
    .tnc-pii-list li{font-size:12.5px;color:var(--ink2);line-height:1.5;padding:4px 0 4px 22px;position:relative}
    .tnc-pii-list li::before{content:'\2713';position:absolute;left:2px;top:4px;font-size:11px;color:#059669;font-weight:700;width:14px;height:14px;border-radius:50%;border:1.5px solid #059669;display:flex;align-items:center;justify-content:center;background:#ecfdf5}
    [dir="rtl"] .tnc-pii{text-align:right}
    [dir="rtl"] .tnc-pii-list li{padding:4px 22px 4px 0}
    [dir="rtl"] .tnc-pii-list li::before{left:auto;right:2px}

    /* ── How-it-works MODAL ───────────────────────────────────────── */
    .how-wrap,.comp-wrap{align-items:center}
    .how-modal{max-width:460px;padding:28px 26px 22px;text-align:left;position:relative}
    .comp-modal{max-width:780px;padding:30px 22px 16px;text-align:left;position:relative;max-height:92vh;overflow-y:auto;overscroll-behavior:contain}
    .how-close{position:absolute;top:14px;right:14px;background:#f5f5f7;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:all .15s;z-index:5}
    .how-close:hover{background:#FEE2E2;color:#DC2626;transform:rotate(90deg)}
    .how-modal-head{margin-bottom:22px;text-align:center}
    .how-modal-eyebrow{font-size:11.5px;font-weight:700;color:#0d9488;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
    .how-modal-title{font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:24px;font-weight:600;color:var(--blue-deep);margin:0;line-height:1.25;letter-spacing:-.015em}
    .how-modal-steps{display:flex;flex-direction:column;gap:14px;margin-bottom:24px}
    .hms-step{display:flex;gap:14px;align-items:flex-start;padding:14px 14px;border-radius:14px;background:#fafbfc;border:1px solid #f0f0f0;animation:hmsIn .4s ease both}
    .hms-step:nth-child(1){animation-delay:.05s}
    .hms-step:nth-child(2){animation-delay:.15s}
    .hms-step:nth-child(3){animation-delay:.25s}
    .pii-note{display:flex;gap:12px;align-items:flex-start;background:#f0fdf9;border:1px solid #6ee7b7;border-radius:12px;padding:13px 15px;margin-top:14px;font-size:13px;line-height:1.5;color:var(--ink2)}
    .pii-note strong{display:block;color:var(--ink1);font-size:13px;margin-bottom:3px}
    .pii-note p{margin:0;color:var(--ink2)}
    .pii-icon{font-size:20px;flex-shrink:0;line-height:1.2}
    @keyframes hmsIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    .hms-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-weight:700;font-size:17px;flex-shrink:0}
    .hms-1{background:linear-gradient(135deg,#0284C7,#0C4A7E)}
    .hms-2{background:linear-gradient(135deg,#0d9488,#0891b2)}
    .hms-3{background:linear-gradient(135deg,#7C3AED,#2563EB)}
    .hms-body{flex:1}
    .hms-t{font-size:15px;font-weight:700;color:var(--ink1);margin-bottom:3px}
    .hms-d{font-size:13.5px;color:var(--ink2);line-height:1.5}
    .how-modal-cta{background:linear-gradient(135deg,#FFF7ED,#FEF2F2);border:1px solid #FECACA;border-radius:16px;padding:18px 18px 16px}
    .hmc-eyebrow{font-size:11.5px;font-weight:700;color:var(--coral-deep);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
    .hmc-title{font-size:14.5px;color:var(--ink1);line-height:1.45;margin-bottom:14px}
    .how-modal-cta-buttons,.comp-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .comp-actions{padding-top:16px;justify-content:center}
    /* ── PaJR Info — Inline Collapsible Infographic ────────── */
    .pajr-info-inline{max-width:680px;margin:28px auto 0;overflow:hidden}
    .pajr-info-toggle{width:100%;background:#0284C7;border:none;border-radius:16px;padding:16px 22px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s;box-shadow:0 4px 16px rgba(2,132,199,.25)}
    .pajr-info-toggle:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(2,132,199,.35)}
    .pajr-info-toggle-icon{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .pajr-info-toggle-text{flex:1;text-align:left}
    .pajr-info-toggle-title{font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:16px;font-weight:700;color:#fff;display:block}
    .pajr-info-toggle-sub{font-size:12.5px;color:rgba(255,255,255,.85);display:block;margin-top:2px}
    .pajr-info-chevron{color:#fff;font-size:20px;transition:transform .3s;flex-shrink:0}
    .pajr-info-chevron.open{transform:rotate(180deg)}
    .pajr-info-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1);background:linear-gradient(180deg,#f0f9ff 0%,#fff 40%);border-radius:0 0 16px 16px}
    .pajr-info-body.open{max-height:2200px;border:1px solid #bae6fd;border-top:none}
    .pajr-info-inner{padding:28px 24px 24px}
    .pajr-flow{display:flex;flex-direction:column;gap:0;position:relative}
    .pajr-flow::before{content:'';position:absolute;left:27px;top:28px;bottom:28px;width:2px;background:linear-gradient(180deg,var(--coral),var(--teal),var(--blue),#7C3AED,#059669);border-radius:2px}
    .pajr-flow-step{display:flex;gap:16px;align-items:flex-start;position:relative;padding-bottom:20px}
    .pajr-flow-step:last-child{padding-bottom:0}
    .pajr-flow-icon{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;box-shadow:0 3px 12px rgba(0,0,0,.08)}
    .pajr-flow-content{flex:1;padding-top:4px}
    .pajr-flow-content h4{font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:15px;font-weight:700;color:var(--ink1);margin:0 0 4px}
    .pajr-flow-content p{font-size:13px;color:var(--ink2);margin:0;line-height:1.55}
    .pajr-pii-card{background:linear-gradient(135deg,#FEF2F2,#FFF7ED);border:2px solid #FECACA;border-radius:16px;padding:20px;margin:24px 0 20px;position:relative}
    .pajr-pii-card::before{content:'';position:absolute;top:-1px;left:24px;right:24px;height:3px;background:linear-gradient(90deg,var(--coral),var(--coral-deep));border-radius:0 0 3px 3px}
    .pajr-pii-title{font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:15px;font-weight:700;color:var(--coral-deep);margin:0 0 10px;display:flex;align-items:center;gap:8px}
    .pajr-pii-list{list-style:none;padding:0;margin:0}
    .pajr-pii-list li{font-size:13px;color:var(--ink2);line-height:1.55;padding:5px 0 5px 24px;position:relative}
    .pajr-pii-list li::before{content:'';position:absolute;left:0;top:11px;width:14px;height:14px;border-radius:50%;border:2px solid #059669;background:#ecfdf5}
    .pajr-pii-list li::after{content:'\2713';position:absolute;left:3px;top:10px;font-size:10px;color:#059669;font-weight:700}
    .pajr-info-hook{text-align:center;margin-top:20px}
    .pajr-info-hook button{background:var(--coral);color:#fff;border:none;border-radius:14px;padding:14px 32px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(224,74,57,.3)}
    .pajr-info-hook button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(224,74,57,.4)}
    @media(max-width:600px){.pajr-info-inner{padding:20px 16px 18px}.pajr-flow::before{left:24px}.pajr-flow-icon{width:48px;height:48px;border-radius:14px}.pajr-info-toggle{padding:14px 16px;border-radius:14px}.pajr-info-toggle-title{font-size:15px}}
    .hmc-btn{flex:1;min-width:140px;padding:10px 14px;border-radius:11px;border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;letter-spacing:-.005em;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;transition:all .15s}
    .hmc-btn-primary{background:var(--coral);color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.3)}
    .hmc-btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 8px 22px rgba(239,68,68,.4)}
    .hmc-btn-secondary{background:#0d9488;color:#fff;box-shadow:0 4px 14px rgba(13,148,136,.3)}
    .hmc-btn-secondary:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 8px 22px rgba(13,148,136,.4)}

    /* ── Comparison TABLE inside its modal ─────────────────────────── */
    .comp-table-wrap{overflow-x:auto;overflow-y:visible;margin:18px -6px 14px;padding-top:14px;-webkit-overflow-scrolling:touch}
    .comp-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:560px}
    .comp-notes{font-size:11.5px;color:var(--ink3);line-height:1.55;margin-top:14px;text-align:center;display:flex;flex-direction:column;gap:5px;padding:0 6px}
    /* ── Native account / subscription page ─────────────────────────────── */
    .sub-modal{max-width:480px;padding:28px 24px 20px;text-align:left;position:relative;max-height:92vh;overflow-y:auto;overscroll-behavior:contain}
    .sub-head{margin-bottom:16px}
    .sub-title{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
    .sub-sub{font-size:13px;color:var(--ink3);margin-top:2px;word-break:break-word}
    .sub-plan{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--paper)}
    .sub-plan-pro{border-color:transparent;background:linear-gradient(135deg,#FFFBEB,#F0FDFA)}
    [data-theme="dark"] .sub-plan-pro{background:linear-gradient(135deg,#2A2410,#0F241F)}
    .sub-plan-top{display:flex;align-items:center;gap:10px;margin-bottom:7px}
    .sub-plan-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink2);background:var(--paper2);border:1px solid var(--line);border-radius:100px;padding:4px 10px}
    .sub-plan-badge.spb-pro{color:#fff;background:linear-gradient(135deg,var(--coral),var(--coral-deep));border-color:transparent}
    .sub-plan-name{font-size:16px;font-weight:800;color:var(--ink)}
    .sub-plan-meta{font-size:13.5px;color:var(--ink2);line-height:1.5}
    .sub-warn{color:var(--coral-deep);font-weight:700}
    .sub-ents{margin:14px 0 4px;display:flex;flex-direction:column;gap:2px}
    .sub-ent{display:flex;align-items:flex-start;gap:11px;padding:9px 2px;border-bottom:1px solid var(--line)}
    .sub-ent:last-child{border-bottom:none}
    .sub-ent-ck{flex-shrink:0;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:var(--teal);margin-top:1px}
    .sub-ent-off .sub-ent-ck{background:var(--paper2);color:var(--ink3);border:1px solid var(--line)}
    .sub-ent-tx{min-width:0}
    .sub-ent-t{font-size:14px;font-weight:700;color:var(--ink1)}
    .sub-ent-off .sub-ent-t{color:var(--ink3)}
    .sub-ent-d{font-size:12px;color:var(--ink3);line-height:1.45;margin-top:1px}
    .sub-actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 6px}
    .sub-btn{flex:1 1 auto;min-width:132px;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid transparent;transition:filter .15s,background .15s;text-align:center}
    .sub-btn:disabled{opacity:.6;cursor:default}
    .sub-btn-primary{background:var(--coral);color:#fff}
    .sub-btn-primary:hover:not(:disabled){filter:brightness(1.05)}
    .sub-btn-ghost{background:var(--surface);color:var(--ink1);border-color:var(--line)}
    .sub-btn-ghost:hover:not(:disabled){background:var(--paper2)}
    .sub-btn-danger{background:transparent;color:var(--coral-deep);border-color:color-mix(in srgb,var(--coral-deep) 40%,transparent)}
    .sub-btn-danger:hover:not(:disabled){background:var(--coral-soft)}
    .sub-hist{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
    .sub-hist-h{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
    .sub-pay{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
    .sub-pay:last-child{border-bottom:none}
    .sub-pay-d{font-size:13.5px;font-weight:600;color:var(--ink1)}
    .sub-pay-s{font-size:11.5px;font-weight:700;color:var(--ink3);margin-top:1px}
    .sub-pay-s.sub-pay-ok{color:var(--teal)}
    .sub-pay-s.sub-pay-refund{color:var(--coral-deep)}
    .sub-pay-r{display:flex;align-items:center;gap:12px;flex-shrink:0}
    .sub-pay-amt{font-size:14px;font-weight:800;color:var(--ink)}
    .sub-pay-rc{font-size:12.5px;font-weight:700;color:var(--blue);text-decoration:none}
    .sub-pay-rc:hover{text-decoration:underline}
    .sub-empty{font-size:13px;color:var(--ink3);padding:8px 0}
    .sub-foot{margin-top:16px;font-size:11.5px;color:var(--ink3);text-align:center;line-height:1.5}
    .sub-foot a{color:var(--blue);text-decoration:none}
    @media(max-width:520px){ .sub-modal{padding:44px 16px 18px;max-width:calc(100vw - 20px)} .sub-btn{flex:1 1 100%} }
    /* Plan families: the first three tiers are private 1-to-1 chats (blue
       family); the PaJR Group is the WhatsApp care circle (teal family) */
    .comp-group-row th{background:transparent;border-bottom:none;padding:4px 6px 8px;vertical-align:middle}
    .comp-grp{display:block;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border-radius:100px;padding:5px 10px;text-align:center;white-space:nowrap}

    .comp-col-care{background:rgba(13,148,136,.06) !important}
    .comp-table tbody td.comp-col-care-cell{background:rgba(13,148,136,.05);color:#047857;font-weight:600}
    .comp-table th{padding:12px 5px 9px;text-align:center;vertical-align:bottom;background:transparent;border-bottom:2px solid var(--line);position:relative}

    /* ── tier header cards — each tier reads as its own little plan card ── */

    .tier-sub{font-size:10.5px;color:var(--ink3);font-weight:600;line-height:1.3}

    .th-signed .tier-name{color:var(--blue-deep)}
    .th-pro{background:linear-gradient(180deg,rgba(239,68,68,.10),rgba(245,158,11,.05));border:1.5px solid var(--coral);box-shadow:0 4px 16px rgba(239,68,68,.16);padding-top:13px}
    .tier-pop{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2.5px 9px;border-radius:99px;white-space:nowrap;box-shadow:0 3px 10px rgba(239,68,68,.4)}
    .tier-sub-pro{color:var(--coral-deep);font-weight:800}
    .comp-table thead .comp-feature{background:transparent;border-bottom:none}
    .comp-col-name{font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:14px;font-weight:700;color:var(--ink1);letter-spacing:-.01em}
    .comp-col-price{font-size:11px;color:var(--ink3);font-weight:500;margin-top:2px}
    .comp-col-recommended{background:linear-gradient(180deg,rgba(239,68,68,.06),rgba(239,68,68,.02)) !important;border-bottom:2px solid var(--coral) !important}
    .comp-col-recommended .comp-col-name{color:var(--coral-deep)}
    .comp-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:100px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;box-shadow:0 3px 10px rgba(239,68,68,.4)}
    .comp-col-mark{display:flex;justify-content:center;align-items:center;margin-top:18px;margin-bottom:6px;height:22px}
    .comp-table tbody td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:center;color:var(--ink2);font-weight:500;line-height:1.35}
    .comp-table tbody td.comp-feature{text-align:left;color:var(--ink1);font-weight:500;font-size:12.5px}
    .comp-table tbody td.comp-col-recommended-cell{background:rgba(239,68,68,.03);color:var(--coral-deep);font-weight:600}
    .comp-table tbody tr.comp-row-star td{background:linear-gradient(90deg,rgba(239,68,68,.04),rgba(239,68,68,.06));font-weight:600}
    .comp-table tbody tr.comp-row-star td.comp-feature{color:var(--coral-deep)}
    .comp-table tbody tr.comp-row-star td.comp-col-recommended-cell{background:rgba(239,68,68,.1);font-weight:700}
    .comp-table tbody tr:last-child td{border-bottom:none}
    /* ── the GOLD upsell row (signature PaJR RAG©) — always last, shines in
       both themes; the PRO cell carries a slow moving gold sheen ── */
    @keyframes goldSheen{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .comp-table tbody tr.comp-row-gold td{background:linear-gradient(90deg,rgba(245,158,11,.10),rgba(217,119,6,.16));font-weight:700;border-bottom:none}
    .comp-table tbody tr.comp-row-gold td.comp-feature{color:#B45309;font-weight:800}
    [data-theme="dark"] .comp-table tbody tr.comp-row-gold td{background:linear-gradient(90deg,rgba(245,158,11,.14),rgba(217,119,6,.22))}
    [data-theme="dark"] .comp-table tbody tr.comp-row-gold td.comp-feature{color:#FBBF24}
    .comp-table tbody tr.comp-row-gold td.comp-col-recommended-cell{background-image:linear-gradient(110deg,#D97706 25%,#F59E0B 40%,#FDE68A 50%,#F59E0B 60%,#D97706 75%);background-size:220% 100%;animation:goldSheen 3.6s linear infinite;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(120,53,15,.35);box-shadow:0 0 16px rgba(245,158,11,.4)}
    @media(prefers-reduced-motion:reduce){.comp-table tbody tr.comp-row-gold td.comp-col-recommended-cell,.cmob-feat.cmob-gold{animation:none}}
    /* the research-database row label is the Database wordmark image */
    .comp-db-img{height:19px;width:auto;display:inline-block;vertical-align:-5px}
    /* the named features column header */
    .comp-table th.comp-h-features{text-align:left;font-size:12px;font-weight:700;color:var(--ink3);vertical-align:bottom;padding-bottom:10px}
    /* ── the DATABASE standout row — the blue twin of the gold row ── */
    .comp-table tbody tr.comp-row-db td{background:linear-gradient(90deg,rgba(2,132,199,.09),rgba(12,74,126,.15));font-weight:700}
    [data-theme="dark"] .comp-table tbody tr.comp-row-db td{background:linear-gradient(90deg,rgba(74,166,230,.13),rgba(74,166,230,.20))}
    .comp-table tbody tr.comp-row-db td.comp-col-recommended-cell{background-image:linear-gradient(110deg,#0C4A7E 25%,#0284C7 45%,#7DD3FC 55%,#0284C7 65%,#0C4A7E 80%);background-size:220% 100%;animation:goldSheen 4.4s linear infinite;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(2,44,72,.4);box-shadow:0 0 14px rgba(2,132,199,.4)}
    @media(prefers-reduced-motion:reduce){.comp-table tbody tr.comp-row-db td.comp-col-recommended-cell,.cmob-feat.cmob-dbrow{animation:none}}

    /* ── Testimonials section ─────────────────────────────────────── */
    /* ══ PATIENT JOURNEY — interactive ════════════════════════════════════ */
    .pjourney{width:100%;max-width:920px;margin:26px auto 8px;padding:22px 20px 18px;text-align:center;position:relative}
    .pjn-eyebrow{font-size:12.5px;font-weight:700;color:var(--coral);letter-spacing:.16em;text-transform:uppercase;margin-bottom:11px}
    .pjn-title{font-family:'Inter','DM Sans',system-ui,sans-serif;font-size:30px;font-weight:600;color:var(--blue-deep);line-height:1.15;letter-spacing:-.02em;margin:0 auto 11px;max-width:640px}
    .pjn-sub{font-size:14.5px;color:var(--ink2);max-width:560px;margin:0 auto 9px;line-height:1.55}
    .pjn-patient{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);padding:6px 14px;border-radius:100px;text-decoration:none;cursor:pointer;transition:border-color .15s,color .15s,box-shadow .15s}
    .pjn-patient:hover{border-color:var(--coral);color:var(--ink1);box-shadow:0 4px 14px rgba(255,107,91,.14)}
    .pjn-pext{display:inline-flex;color:var(--coral);opacity:.85}
    .pjn-pext svg{width:12px;height:12px}
    .pjn-patient .pjn-pdot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 22%,transparent);flex-shrink:0}

    /* stage: the clickable line + walking figure */
    .pjn-stage{position:relative;max-width:860px;margin:14px auto 2px;overflow:visible}
    .pjn-line{width:100%;height:auto;aspect-ratio:1000/230;display:block;overflow:visible}
    .pjn-node{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .16s ease;outline:none}
    .pjn-node:hover{transform:scale(1.16)}
    .pjn-node:focus-visible{transform:scale(1.16)}
    .pjn-node circle,.pjn-node line,.pjn-node path{transition:r .25s ease,stroke-width .25s ease}
    .pjn-plus{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:pjPlus 2.4s ease-in-out infinite}
    .pjn-plus:hover{transform:scale(1.14)}
    .pjn-pulse{animation:pjPulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pjn-figure{position:absolute;width:46px;transform:translate(-50%,-100%);transition:left .55s cubic-bezier(.45,.05,.25,1),top .55s cubic-bezier(.45,.05,.25,1);pointer-events:none;z-index:3;filter:drop-shadow(0 4px 8px rgba(12,74,126,.16))}
    .pjn-fig-svg{width:100%;height:auto;display:block;overflow:visible}
    .pjn-hint{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.04em;opacity:.9;transition:opacity .4s;pointer-events:none;display:flex;align-items:center;gap:6px}
    .pjn-hint::before{content:"";width:14px;height:14px;border:1.5px solid var(--ink3);border-radius:50%;opacity:.6}
    .pjn-hint.gone{opacity:0}

    /* progress dots */
    .pjn-dots{display:flex;justify-content:center;gap:7px;margin:6px auto 2px}
    .pjn-dotbtn{position:relative;width:7px;height:7px;border-radius:50%;border:none;padding:0;background:var(--line);cursor:pointer;transition:transform .2s,background .2s}
    .pjn-dotbtn::after{content:"";position:absolute;inset:-12px}
    .pjn-dotbtn:hover{transform:scale(1.3)}
    .pjn-dotbtn.on{width:22px;border-radius:100px}

    /* detail panel — airy, no box */
    .pjn-detail{max-width:600px;margin:14px auto 0;min-height:198px;animation:pjFade .45s ease both}
    .pjn-d-era{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
    .pjn-d-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .pjn-d-t{font-family:'Inter','DM Sans',system-ui,sans-serif;font-size:23px;font-weight:600;color:var(--ink);line-height:1.2;letter-spacing:-.01em;margin:0 0 10px}
    .pjn-d-b{font-size:15px;color:var(--ink2);line-height:1.62;margin:0 auto 14px;max-width:560px}
    .pjn-d-q{font-family:'Inter','DM Sans',system-ui,sans-serif;font-style:italic;font-size:15px;color:var(--ink1);line-height:1.5;max-width:500px;margin:0 auto 13px;padding:2px 0 2px 16px;border-left:2.5px solid;text-align:left}
    .pjn-d-q cite{display:block;font-family:'DM Sans',system-ui,sans-serif;font-style:normal;font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.04em;margin-top:5px;text-transform:uppercase}
    .pjn-d-chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:100px;border:1px solid}
    .pjn-chip-mk{display:inline-flex;align-items:center}
    .pjn-detail.finale .pjn-d-t{color:var(--teal)}

    /* CTA */
    .pjn-cta{max-width:600px;margin:18px auto 0;text-align:center}
    .pjn-cta-line{font-family:'Inter','DM Sans',system-ui,sans-serif;font-style:italic;font-size:17px;color:var(--ink1);margin-bottom:13px;line-height:1.4}
    .pjn-cta-btn{display:inline-flex;align-items:center;gap:9px;background:var(--blue);color:#fff;border:none;border-radius:100px;padding:13px 26px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;box-shadow:0 10px 30px rgba(2,132,199,.32);transition:box-shadow .2s,transform .15s}
    .pjn-cta-btn:hover{box-shadow:0 14px 40px rgba(2,132,199,.45);transform:translateY(-1px)}
    .pjn-cta-btn .pjn-mk{display:inline-flex;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.14);align-items:center;justify-content:center}
    .pjn-cta-btn .pjn-mk svg{max-width:20px;max-height:10px;width:auto;height:auto}

    @keyframes pjFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes pjPulse{0%,100%{opacity:.16;transform:scale(1)}50%{opacity:.07;transform:scale(1.35)}}
    @keyframes pjPlus{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
    .pjn-blob{animation:pjFloat2 8s ease-in-out infinite}
    @keyframes pjFloat2{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .pjn-fig-svg{transform-origin:center bottom}
    .pjn-anim-0{animation:pjF0 4s ease-in-out infinite}
    @keyframes pjF0{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
    .pjn-anim-1{animation:pjF1 3.4s ease-in-out infinite}
    @keyframes pjF1{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(1.5px) scaleY(.97)}}
    .pjn-anim-3{animation:pjFR 2.8s ease-in-out infinite}
    @keyframes pjFR{0%,100%{transform:translateY(0)}45%{transform:translateY(-4px)}}
    .pjn-anim-4{animation:pjF3 .9s ease-in-out infinite}
    @keyframes pjF3{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-2px) rotate(1.2deg)}}
    .pjn-anim-5{animation:pjF4 .24s linear infinite}
    @keyframes pjF4{0%{transform:translateX(-1px) rotate(-1deg)}25%{transform:translateX(1.2px) rotate(1deg)}50%{transform:translateX(-1px) rotate(-.6deg)}75%{transform:translateX(1px) rotate(1deg)}100%{transform:translateX(-1px) rotate(-1deg)}}
    .pjn-anim-6{animation:pjF5 1.6s ease-in-out infinite}
    @keyframes pjF5{0%,100%{transform:translateY(0)}28%{transform:translateY(-3.5px)}44%{transform:translateY(-1px)}}
    .pjn-anim-7{animation:pjFB 3s ease-in-out infinite}
    @keyframes pjFB{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-1px)}}
    .pjn-vortex{transform-box:fill-box;transform-origin:center;animation:pjVortex 6s linear infinite}
    @keyframes pjVortex{to{transform:rotate(360deg)}}
    .pjn-suck{transform-box:fill-box;transform-origin:center bottom;animation:pjSuck 3.2s ease-in infinite}
    @keyframes pjSuck{0%{transform:translateY(0) scale(1) rotate(0);opacity:1}45%{transform:translateY(10px) scale(.22) rotate(170deg);opacity:.25}60%{transform:translateY(15px) scale(.08) rotate(240deg);opacity:0}61%{transform:translateY(0) scale(1) rotate(0);opacity:0}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}
    .pjn-acc{transform-box:fill-box;transform-origin:center;animation:pjAcc 1.5s ease-in-out infinite}
    @keyframes pjAcc{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.2);opacity:1}}
    .pjn-drip{transform-box:fill-box;transform-origin:center;animation:pjDrip 1.4s ease-in infinite}
    @keyframes pjDrip{0%{transform:translateY(0);opacity:.75}70%{opacity:.25}100%{transform:translateY(6px);opacity:0}}
    .pjn-viz{margin:2px auto 14px;max-width:560px;width:100%}
    .pjn-viz svg{width:100%;height:auto;display:block;overflow:visible}
    .pjn-viz-link{display:block;text-decoration:none;cursor:pointer}
    .pjn-viz-hint{display:block;text-align:right;font-size:11px;font-weight:600;color:var(--ink3);margin-top:1px;transition:color .15s}
    .pjn-viz-link:hover .pjn-viz-hint{color:var(--coral)}
    @media (prefers-reduced-motion:reduce){.pjn-figure{transition:none}.pjn-plus,.pjn-pulse,.pjn-blob,.pjn-vortex,.pjn-suck{animation:none}.pjn-detail{animation:none}.pjn-fig-svg,.pjn-acc,.pjn-drip{animation:none}}

    @media(max-width:640px){
      .pjourney{padding:18px 12px 14px}
      .pjn-title{font-size:23px}
      .pjn-sub{font-size:13.5px}
      .pjn-stage{margin-top:8px}
      .pjn-figure{width:30px}
      .pjn-d-t{font-size:20px}
      .pjn-d-b{font-size:14px}
      .pjn-detail{min-height:230px}
      .pjn-hint{font-size:11px}

    [dir="rtl"] .pjn-d-q{border-left:none;border-right:2.5px solid;padding:2px 16px 2px 0;text-align:right}

    /* ══ TESTIMONIALS — 3 real cases ══ */

    .pjt-quote b{color:var(--c);font-style:normal;font-weight:600}
