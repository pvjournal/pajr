    @media(max-width:720px){.pjt-row,.pjt-row:nth-child(even){flex-direction:column;gap:16px}.pjt-fig{flex:none;max-width:100%;width:100%}.pjt-name{font-size:20px}.pjt-title{font-size:24px}.pjt-story,.pjt-quote{max-width:100%}}
    [dir="rtl"] .pjt-row{text-align:right}
    [dir="rtl"] .pjt-zoomhint{right:auto;left:10px}
    .testimonials{width:100%;max-width:1080px;margin:40px auto 8px;padding:36px 20px 28px;text-align:center}
    .testi-eyebrow{font-size:15px;font-weight:700;color:var(--coral);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
    .testi-title{font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:30px;font-weight:600;color:var(--blue-deep);line-height:1.2;margin:0 0 10px;letter-spacing:-.02em}
    .testi-sub{font-size:14.5px;color:var(--ink2);max-width:560px;margin:0 auto 32px;line-height:1.55}
    .testi-flow{display:flex;flex-direction:column;gap:26px;text-align:left}
    /* Featured card: media + body side by side */
    .testi-feature{display:grid;grid-template-columns:1.15fr 1fr;gap:0;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:all .25s ease;animation:tFadeIn .55s ease both;box-shadow:0 4px 24px rgba(12,74,126,.05)}
    .testi-feature:hover{box-shadow:0 14px 44px rgba(12,74,126,.12);border-color:rgba(12,74,126,.16)}
    .testi-feature.flip{grid-template-columns:1fr 1.15fr}
    .testi-feature.flip .tf-media{order:2}
    .testi-feature.flip .tf-body{order:1}
    @keyframes tFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .tf-media{background:linear-gradient(135deg,var(--ta-soft),#fff);padding:22px;display:flex;flex-direction:column;justify-content:center;gap:12px;border-right:1px solid var(--line)}
    .testi-feature.flip .tf-media{border-right:none;border-left:1px solid var(--line)}
    .tf-img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 6px 24px rgba(12,74,126,.12);display:block}
    .tf-caption{font-size:12.5px;color:var(--ink2);line-height:1.5;font-style:italic;padding:0 4px}
    /* Fanned collage for the patient-log story */
    .tf-collage{position:relative;height:300px;margin:6px 4px}
    .tfc-img{position:absolute;width:54%;height:auto;max-height:260px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);box-shadow:0 8px 26px rgba(12,74,126,.18);transition:transform .25s ease,z-index 0s}
    .tfc-0{left:0;top:14px;transform:rotate(-4deg);z-index:1}
    .tfc-1{left:24%;top:0;transform:rotate(1.5deg);z-index:2}
    .tfc-2{left:46%;top:20px;transform:rotate(5deg);z-index:3}
    .tf-collage:hover .tfc-img{transform:rotate(0)}
    .tf-body{padding:30px 28px;display:flex;flex-direction:column;justify-content:center}
    .tf-quote{margin:14px 0 20px;padding:0;font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:18.5px;font-style:italic;color:var(--ink1);line-height:1.6;letter-spacing:-.005em}
    /* Mini card for shorter quotes */
    .testi-mini{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 26px;max-width:560px;margin:0 auto;width:100%;transition:all .2s;position:relative;overflow:hidden}
    .testi-mini::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ta)}
    .testi-mini:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(12,74,126,.1)}
    .tm-quote{margin:12px 0 16px;padding:0;font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:16.5px;font-style:italic;color:var(--ink1);line-height:1.55}
    .testi-tag{display:inline-flex;align-self:flex-start;font-size:11px;font-weight:700;color:var(--ta);background:var(--ta-soft);padding:5px 11px;border-radius:100px;letter-spacing:.06em;text-transform:uppercase}
    .testi-case{text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:4px;transition:color .15s;padding-top:14px;border-top:1px dashed var(--line)}
    .testi-case:hover .testi-case-link{color:var(--ta);transform:translateX(3px)}
    .testi-case-title{font-size:12.5px;color:var(--ink3);font-weight:500;line-height:1.4}
    .testi-case-link{font-size:13px;color:var(--ink2);font-weight:600;transition:all .18s;display:inline-block}
    /* Accent colour variants */
    .ta-coral  {--ta:#EF4444;--ta-soft:#FEF2F2}
    .ta-teal   {--ta:#0d9488;--ta-soft:#F0FDFA}
    .ta-blue   {--ta:#2563EB;--ta-soft:#EFF6FF}
    .ta-amber  {--ta:#D97706;--ta-soft:#FFFBEB}
    .ta-violet {--ta:#7C3AED;--ta-soft:#F5F3FF}

    /* (old .stats removed — replaced by .evidence) */

    /* BIG ORANGE CTA (welcome screen) */
    /* ── Floating Action Button — bottom right ─────────────────────── */
    .big-cta{position:fixed;bottom:22px;right:22px;left:auto;transform:none;z-index:60;
      background:var(--blue);
      color:#fff;border:none;border-radius:100px;
      padding:0;cursor:pointer;display:inline-flex;align-items:stretch;
      text-align:left;font-family:inherit;
      box-shadow:0 8px 28px rgba(2,132,199,.42),0 2px 8px rgba(0,0,0,.1);
      transition:box-shadow .25s ease,background .25s;
      animation:fabPulse 2.6s ease-in-out infinite,fabIn .5s ease;
      overflow:hidden}
    .big-cta-inner{display:flex;align-items:center;gap:0;padding:0;min-height:54px}
    .big-cta-icon{width:54px;height:54px;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 8px;box-sizing:border-box}
    .big-cta-icon svg{max-width:38px;max-height:18px;width:auto;height:auto}
    .big-cta-text{display:flex;flex-direction:column;justify-content:center;gap:1px;
      max-width:0;overflow:hidden;
      transition:max-width .3s cubic-bezier(.4,0,.2,1),padding .3s cubic-bezier(.4,0,.2,1);
      padding:0}
    .big-cta:hover .big-cta-text,.big-cta.expanded .big-cta-text{max-width:280px;padding:0 18px 0 12px}
    .big-cta:hover{box-shadow:0 14px 40px rgba(2,132,199,.5),0 4px 14px rgba(0,0,0,.15);animation:none}
    .big-cta-title{font-size:13.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .big-cta-sub{font-size:10.5px;opacity:.88;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @keyframes fabIn{from{opacity:0;transform:translateY(40px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes fabPulse{0%,100%{box-shadow:0 8px 28px rgba(2,132,199,.42),0 2px 8px rgba(0,0,0,.1),0 0 0 0 rgba(2,132,199,.5)}60%{box-shadow:0 8px 28px rgba(2,132,199,.42),0 2px 8px rgba(0,0,0,.1),0 0 0 14px rgba(2,132,199,0)}}
    .float-cta-spacer{display:none}
    .signed-in-banner{position:fixed;bottom:22px;right:22px;left:auto;transform:none;z-index:60;background:#059669;color:#fff;border-radius:100px;padding:0;display:inline-flex;align-items:stretch;overflow:hidden;box-shadow:0 8px 28px rgba(5,150,105,.4),0 2px 8px rgba(0,0,0,.1);animation:fabIn .5s ease;cursor:pointer;transition:box-shadow .25s ease}
    .signed-in-banner:hover{box-shadow:0 12px 36px rgba(5,150,105,.55),0 4px 12px rgba(0,0,0,.15)}
    .sib-icon{width:54px;height:54px;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .sib-text{display:flex;flex-direction:column;justify-content:center;padding:0 20px 0 14px;overflow:hidden}
    .sib-title{font-size:14px;font-weight:700;white-space:nowrap}
    .sib-sub{font-size:11px;opacity:.88;white-space:nowrap}

    /* ── Auth FAB (logged-in account menu, bottom-right) ───────────────── */
    .auth-fab{position:fixed;bottom:22px;right:22px;left:auto;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:12px;animation:fabIn .5s ease}
    .auth-fab-btn{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#1D9BF0;box-shadow:0 8px 28px rgba(29,155,240,.42),0 2px 8px rgba(0,0,0,.12);transition:box-shadow .2s,transform .12s;padding:0}
    .auth-fab-btn:hover{box-shadow:0 12px 36px rgba(29,155,240,.55),0 4px 12px rgba(0,0,0,.16);transform:translateY(-1px)}
    .auth-fab-btn:active{transform:scale(.96)}
    .auth-fab-btn.open{box-shadow:0 12px 36px rgba(29,155,240,.6)}
    .afb-logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:rgba(0,0,0,.14);border-radius:50%}
    .afb-logo svg{max-width:24px;max-height:12px;width:auto;height:auto}
    .auth-menu{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 44px rgba(12,74,126,.24);overflow:hidden;min-width:196px;animation:fabIn .18s ease}
    .auth-menu-item{display:flex;align-items:center;gap:11px;width:100%;padding:14px 18px;background:none;border:none;border-bottom:1px solid var(--line);font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink1);cursor:pointer;text-align:left;transition:background .12s}
    .auth-menu-item:last-child{border-bottom:none}
    .auth-menu-item:hover{background:var(--blue-soft)}
    .ami-ico{display:inline-flex;align-items:center;color:var(--blue);flex-shrink:0}
    [dir="rtl"] .auth-fab{left:22px;right:auto;align-items:flex-start}
    @media(max-width:820px){.auth-fab{bottom:14px;right:14px}.auth-fab-btn{width:52px;height:52px}}
    [dir="rtl"] .auth-menu-item{text-align:right}

    /* ══ MESSAGES — editorial, document-style chat ══════════════════════
       Bot answers are typeset full-width on the paper background — no
       bubble, no avatar, maximum reading width. User questions are
       compact right-aligned pills. Lean and quiet, made for small
       screens first. */
    .msg{display:block;margin-bottom:0;animation:fadeUp .32s ease both}
    .msg.user{display:flex;justify-content:flex-end;margin:26px 0 22px}
    .u-pill{max-width:78%;background:linear-gradient(135deg,#E9F3FB,#E2EEF9);border:1px solid rgba(2,132,199,.15);color:var(--ink);padding:11px 16px;border-radius:18px 18px 5px 18px;font-size:15.5px;line-height:1.55;font-family:'Inter','DM Sans',sans-serif;word-break:break-word}
    .u-pending{display:block;font-size:11px;color:var(--ink3);margin-top:4px;font-style:italic}
    .u-attach-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .u-attach-thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid rgba(2,132,199,.25);display:block;cursor:zoom-in}
    .u-attach-file{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.65);border:1px solid rgba(2,132,199,.2);border-radius:8px;padding:4px 9px;font-size:11.5px;color:var(--ink2);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .msg.bot{position:relative;padding-bottom:30px}
    .msg.bot .bot-inner{cursor:pointer}
    .msg.bot.selected::before{content:"";position:absolute;left:-14px;top:6px;bottom:36px;width:3px;border-radius:3px;background:var(--blue);opacity:.4}
    [data-theme="dark"] .msg.bot.selected::before{background:#4AA6E6;opacity:.5}
    .bot-brandrow{display:flex;align-items:center;gap:7px;margin-bottom:10px}
    .bot-brandrow img{height:15px;width:auto;display:block}
    .bot-brandrow .bot-mark{display:inline-flex;align-items:center;height:15px}
    .bot-brandname{font-family:'Inter','DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-deep)}
    .bot-brandtime{font-size:11px;color:var(--ink3);font-weight:500;margin-left:auto;font-family:'Inter','DM Sans',sans-serif}
    .md{font-family:'Inter','DM Sans',sans-serif;font-size:16px;line-height:1.72;color:var(--ink)}
    .md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
    .md p{margin:0 0 12px}
    .md strong,.md b{font-weight:700;color:var(--blue-deep)}
    .md ul,.md ol{margin:10px 0 14px 22px}
    .md li{margin-bottom:7px;line-height:1.7}
    .md h1,.md h2,.md h3{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--blue-deep);margin:18px 0 8px;line-height:1.25}
    .md h2{font-size:20px}.md h3{font-size:17.5px}
    .md a{color:var(--coral-deep);text-decoration:none;border-bottom:1.5px solid var(--coral-soft);font-weight:600;font-family:'Inter','DM Sans',sans-serif;font-size:14.5px;transition:all .14s;padding:0 1px}
    .md a:hover{background:var(--coral-soft);border-bottom-color:var(--coral)}
    .md code{background:var(--paper2);padding:2px 6px;border-radius:5px;font-size:14px;font-family:ui-monospace,monospace}
    .md blockquote{border-left:3px solid var(--coral);padding:2px 0 2px 14px;color:var(--ink2);margin:12px 0;font-style:italic}
    /* Inline media inside answers — images, voice notes, videos from the
       patient media vault render directly in the chat */
    .md img,.md-img{max-width:min(420px,100%);height:auto;border-radius:14px;border:1px solid var(--line);box-shadow:0 4px 18px rgba(12,74,126,.08);display:block;margin:12px 0 6px;cursor:zoom-in;background:#fff}
    .md-media{display:block}
    /* Case-image figure + source chip + collage */
    .md-figure{display:block;margin:12px 0 6px}
    .md-figure-src{display:inline-flex;align-items:center;gap:4px;font-family:'Inter','DM Sans',sans-serif;font-size:11.5px;font-weight:600;color:var(--blue-deep);text-decoration:none;background:var(--blue-soft);border:1px solid var(--line);border-radius:8px;padding:3px 9px;margin-top:3px;transition:all .15s}
    .md-figure-src:hover{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-deep)}
    .media-collage{position:relative;margin:14px 0;max-width:100%}
    .collage-track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
    .collage-track::-webkit-scrollbar{height:6px}
    .collage-track::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
    .media-collage .md-figure{margin:0;flex:0 0 auto;width:200px;scroll-snap-align:start;display:flex;flex-direction:column}
    .media-collage .md-img{width:100%;height:150px;object-fit:cover;margin:0;border-radius:12px;max-width:100%}
    .media-collage .md-img-cap{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;margin:5px 0 0;color:var(--ink3);line-height:1.35}
    .media-collage .md-figure-src{margin-top:5px;align-self:flex-start}
    .collage-arrow{position:absolute;top:77px;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink1);font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 10px rgba(12,74,126,.2);z-index:2;opacity:.95;transition:all .15s;padding:0}
    .collage-arrow:hover{background:var(--coral);color:#fff;border-color:var(--coral)}
    .collage-prev{left:-8px}
    .collage-next{right:-8px}
    @media(max-width:820px){.media-collage .md-figure{width:152px}.media-collage .md-img{height:118px}.collage-arrow{display:none}.collage-track{scroll-snap-type:x proximity}}
    .md-img-cap{display:block;font-family:'Inter','DM Sans',sans-serif;font-size:12.5px;color:var(--ink3);margin:2px 0 10px;line-height:1.45}
    .md audio{display:block;width:min(420px,100%);margin:12px 0;height:42px}
    .md video{display:block;max-width:min(480px,100%);width:100%;border-radius:14px;border:1px solid var(--line);margin:12px 0;background:#000}
    .md table{border-collapse:collapse;margin:14px 0;font-family:'Inter','DM Sans',sans-serif;font-size:13.5px;max-width:100%;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .md th,.md td{border:1px solid var(--line);padding:7px 11px;text-align:left;line-height:1.5}
    .md th{background:var(--paper2);font-weight:700;color:var(--blue-deep)}
    .md hr{border:none;border-top:1px solid var(--line);margin:18px 0}

    .bot-footer{display:flex;align-items:center;gap:2px;margin-top:14px;flex-wrap:wrap}
    .tts-btn,.retry-pill,.refs-pill,.copy-btn{display:inline-flex;align-items:center;gap:5px;font-family:'Inter','DM Sans',sans-serif;font-size:12.5px;font-weight:600;color:var(--ink3);background:transparent;border:none;border-radius:9px;padding:7px 10px;cursor:pointer;transition:all .14s;min-height:34px}
    .tts-btn:hover,.copy-btn:hover{color:#0d9488;background:#ECFDF5}
    .tts-btn.speaking{color:#0d9488;background:#ECFDF5}
    .retry-pill:hover{color:var(--blue);background:var(--blue-soft)}
    .retry-pill svg{transition:transform .4s}
    .retry-pill:hover svg{transform:rotate(-180deg)}
    .refs-pill:hover{color:var(--blue-deep);background:var(--blue-soft)}
    .refs-pill.active{color:var(--blue);background:var(--blue-soft)}
    .rate-group{display:flex;align-items:center;gap:2px;margin-left:auto}
    .rate-label{display:none}
    .rate-btn{background:none;border:none;border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink3);transition:all .14s}
    .rate-btn:hover{color:var(--blue);background:var(--blue-soft)}
    .rate-btn.up.on{color:#16A34A;background:#F0FDF4}
    .rate-btn.down.on{color:var(--coral-deep);background:var(--coral-soft)}
    .rate-thanks{font-family:'Inter','DM Sans',sans-serif;font-size:12px;color:#16A34A;font-weight:600;margin-left:auto;animation:fadeIn .3s}

    /* LEFT NAV SIDEBAR */
    .lnav{width:268px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;transition:width .3s cubic-bezier(.4,0,.2,1),opacity .25s;overflow:hidden}
    .lnav.collapsed{width:0;opacity:0;pointer-events:none;border-right:none}
    .lnav-head{padding:14px 14px 12px;border-bottom:1px solid var(--line)}
    .lnav-top{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:12px;min-height:44px}
    .lnav-brand{display:flex;align-items:center;justify-content:center}
    .lnav-brand img{height:12px;width:auto;border-radius:1px;object-fit:contain;display:block}
    .lnav-collapse{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink2);transition:all .15s;flex-shrink:0}
    .lnav-collapse:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
    .lnav-new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:'Inter','DM Sans',sans-serif;font-size:14px;font-weight:600;color:#fff;background:var(--blue);border:none;border-radius:11px;padding:11px;cursor:pointer;transition:background .15s}
    .lnav-new:hover{background:var(--blue-deep)}
    .lnav-sec{padding:14px 16px 6px;font-family:'Inter','DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
    .lnav-list{flex:1;overflow-y:auto;padding:0 8px 12px}
    .lnav-item{display:block;width:100%;text-align:left;font-family:'Inter','DM Sans',sans-serif;font-size:13.5px;color:var(--ink2);background:none;border:none;border-radius:9px;padding:9px 10px;cursor:pointer;transition:background .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lnav-item:hover{background:var(--paper)}
    .lnav-item.active{background:var(--blue-soft);color:var(--blue-deep);font-weight:600}
    /* Grouped conversation structure */
    .lnav-conv{padding:2px 4px}
    .lnav-conv-active .lnav-conv-btn{background:var(--blue-soft)}
    .lnav-conv-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;border-radius:9px;padding:8px 10px;cursor:pointer;font-family:'Inter','DM Sans',sans-serif;font-size:13px;color:var(--ink2);transition:background .12s;overflow:hidden}
    .lnav-conv-btn:hover{background:var(--paper)}
    .lnav-conv-dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex-shrink:0;transition:background .15s}
    .lnav-conv-dot.active{background:var(--blue)}
    .lnav-conv-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-weight:500}
    .lnav-sub-list{border-left:3px solid var(--line);margin-left:11px;padding:4px 0 2px}
    .lnav-sub-item{display:flex;align-items:baseline;gap:7px;width:100%;text-align:left;background:none;border:none;border-radius:0 8px 8px 0;padding:6px 10px 6px 10px;cursor:pointer;font-family:'Inter','DM Sans',sans-serif;font-size:12.5px;color:var(--ink2);transition:background .12s;white-space:nowrap;overflow:hidden}
    .lnav-sub-item:hover{background:var(--paper);color:var(--ink)}
    .lnav-sub-item.active{background:var(--blue-soft);color:var(--blue-deep);font-weight:600}
    .lnav-sub-num{flex-shrink:0;width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--ink3);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
    .lnav-sub-item.active .lnav-sub-num{background:var(--blue);color:#fff}
    .lnav-sub-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .lnav-empty{padding:10px;font-family:'Inter','DM Sans',sans-serif;font-size:13px;color:var(--ink3);line-height:1.5}
    .lnav-foot{border-top:1px solid var(--line);padding:12px 16px;font-family:'Inter','DM Sans',sans-serif;font-size:12.5px;color:var(--ink3)}
    .lnav-foot a{color:var(--blue);cursor:pointer;text-decoration:none}
    .lnav-foot a:hover{text-decoration:underline}
    .topbar-menu{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink2);transition:all .15s;flex-shrink:0}
    .topbar-menu:hover{border-color:var(--blue);color:var(--blue)}
    @media(max-width:820px){
      .lnav{position:fixed;inset:0 auto 0 0;z-index:160;width:min(268px,86vw);transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1),box-shadow .28s ease;display:flex}
      .lnav.mobile-open{transform:translateX(0);box-shadow:6px 0 40px rgba(12,74,126,.18)}
      .lnav-backdrop{display:block;position:fixed;inset:0;background:rgba(15,33,55,.32);z-index:150;opacity:0;pointer-events:none;transition:opacity .28s ease}
      .lnav-backdrop.show{opacity:1;pointer-events:all}
    }

    .typing{display:flex;gap:5px;padding:4px 0 10px;align-items:center}
    .typing span{width:7px;height:7px;border-radius:50%;background:var(--coral);animation:bounce 1.3s ease infinite}
    .typing span:nth-child(2){animation-delay:.18s}.typing span:nth-child(3){animation-delay:.36s}

    /* COMPOSER */
    .composer{padding:14px 24px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(to top,var(--paper),rgba(251,250,247,.6))}
    .composer-inner{max-width:780px;margin:0 auto;display:block}
    .attach-bar{max-width:780px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px;padding:0 2px}
    .attach-chip{display:inline-flex;align-items:center;gap:5px;background:var(--blue-soft);border:1px solid rgba(2,132,199,.25);border-radius:8px;padding:4px 8px 4px 10px;font-size:12px;color:var(--ink1);max-width:220px;transition:opacity .15s}
    .attach-chip.uploading{opacity:.7}
    .attach-chip.uploading::before{content:"";width:10px;height:10px;border:2px solid rgba(12,74,126,.18);border-top-color:var(--blue);border-radius:50%;animation:chipSpin .8s linear infinite;margin-right:2px;flex-shrink:0}
    .attach-chip.error{background:#FEF2F2;border-color:#FECACA;color:#B91C1C}
    @keyframes chipSpin{to{transform:rotate(360deg)}}
    .attach-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .attach-chip button{background:none;border:none;cursor:pointer;color:var(--ink3);padding:0;line-height:1;flex-shrink:0;display:flex;align-items:center}
    .attach-chip button:hover{color:var(--coral)}
    .attach-img{width:14px;height:14px;border-radius:3px;object-fit:cover;flex-shrink:0}
    .clip-btn{flex-shrink:0;width:42px;height:42px;border:1.5px solid var(--line);background:#f8f7f4;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:all .15s}
    .clip-btn:hover{border-color:var(--blue);color:var(--blue)}
    .clip-btn.has-files{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
    .composer-plus{flex-shrink:0;width:44px;height:44px;border:1.5px solid var(--line);background:var(--input-btn);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:all .15s}
    .composer-plus:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
    .composer-plus.has-files{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
    @media(max-width:820px){.composer-plus{width:38px;height:38px;border-radius:11px}}
    @keyframes blink{50%{opacity:0}}
    .streaming-cursor::after{content:'▋';display:inline-block;animation:blink .9s step-end infinite;color:var(--blue);margin-left:1px;font-size:.9em}
    .send{background:var(--blue);color:#fff;border:none;border-radius:14px;padding:0 22px;height:50px;font-weight:600;font-size:15.5px;cursor:pointer;display:flex;align-items:center;gap:8px;flex-shrink:0;font-family:inherit;transition:filter .15s,transform .1s}
    .send:hover:not(:disabled){filter:brightness(1.08)}
    .send:active:not(:disabled){transform:scale(.97)}
    .send:disabled{background:var(--line);cursor:not-allowed}
    .hint{max-width:780px;margin:8px auto 4px;font-size:12px;color:var(--ink3);text-align:center}

    /* COMPACT CTA (chat mode) — under composer */
    .compact-cta{max-width:780px;margin:6px auto 14px;background:var(--coral);color:#fff;border:none;border-radius:14px;padding:13px 20px;cursor:pointer;display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;box-shadow:0 8px 20px rgba(255,107,91,.22);transition:transform .15s,filter .15s;width:calc(100% - 48px)}
    .compact-cta:hover{transform:translateY(-1px);filter:brightness(1.06)}
    .compact-cta-icon{width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .compact-cta-text{flex:1}
    .compact-cta-title{font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:15.5px;font-weight:600;line-height:1.2}
    .compact-cta-sub{font-size:12.5px;opacity:.9;margin-top:1px}

    /* SIDEBAR */
    .sidebar{width:var(--sidebar-w);background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .32s cubic-bezier(.4,0,.2,1),opacity .25s;flex-shrink:0}
    .sidebar.collapsed{width:0;opacity:0;pointer-events:none;border-left:none}
    .sb-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .sb-title{font-family:'Inter','DM Sans',sans-serif;font-size:16px;font-weight:600;color:var(--blue-deep);display:flex;align-items:center;gap:8px}
    .sb-count{background:var(--blue);color:#fff;border-radius:9px;padding:1px 7px;font-size:11.5px;font-weight:700;margin-left:4px;font-family:'Inter','DM Sans',sans-serif}
    .sb-close{background:none;border:none;cursor:pointer;color:var(--ink3);display:flex;padding:3px;border-radius:6px}
    .sb-close:hover{color:var(--ink);background:var(--paper2)}
    .sb-body{flex:1;overflow-y:auto;padding:14px}
    .sb-body::-webkit-scrollbar{width:5px}.sb-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
    .sb-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:220px;color:var(--ink3);font-size:14px;text-align:center;padding:24px;gap:12px}
    /* ── Sidebar accordion groups ────────────────────────────────────── */
    .sb-group{border-bottom:1px solid var(--line)}
    .sb-group-head{width:100%;background:none;border:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;cursor:pointer;text-align:left;transition:background .13s;font-family:inherit}
    .sb-group-head:hover{background:var(--paper)}
    .sb-group.open .sb-group-head{background:var(--blue-soft)}
    .sb-group-q{font-size:13px;font-weight:500;color:var(--ink1);line-height:1.4;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sb-group.open .sb-group-q{white-space:normal;overflow:visible;font-weight:600;color:var(--blue-deep)}
    .sb-group-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
    .sb-group-count{background:var(--blue-soft);color:var(--blue-deep);font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
    .sb-group.open .sb-group-count{background:var(--blue);color:#fff}
    .sb-group-caret{font-size:10px;color:var(--ink3);flex-shrink:0}
    .sb-group-body{padding:6px 10px 10px}
    /* ── Reference cards — light, expandable ────────────────────────── */
    .ref{border-radius:10px;padding:0;margin-bottom:6px;cursor:pointer;transition:all .14s;animation:fadeUp .25s ease both;border:1px solid var(--line);overflow:hidden}
    .ref:hover{border-color:#0284C7;background:var(--blue-soft)}
    [data-theme="dark"] .ref:hover{border-color:#4AA6E6;background:rgba(74,166,230,.07)}
    .ref.ref-expanded{border-color:var(--blue-soft)}
    .ref-row{display:flex;align-items:flex-start;gap:8px;padding:10px 12px}
    .ref-left{flex:1;min-width:0}
    .ref-caret{font-size:10px;color:var(--ink3);flex-shrink:0;padding-top:3px}
    /* Per-source badge colours */
    .ref-memories .ref-src{color:#92400E;background:#FEF3C7}
    .ref-pajr .ref-src{color:#1E3A8A;background:#DBEAFE}
    .ref-portfolios .ref-src{color:#064E3B;background:#D1FAE5}
    .ref-pubmed .ref-src{color:#4C1D95;background:#EDE9FE}
    .ref-case .ref-src{color:#0F766E;background:#CCFBF1}
    .ref-web .ref-src{color:var(--ink2);background:var(--paper2)}
    .ref-src{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:5px;margin-bottom:5px}
    .ref-title{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35}
    .ref-detail{padding:0 12px 10px;border-top:1px solid var(--line);margin-top:0}
    .ref-snip{font-size:12.5px;color:var(--ink2);line-height:1.55;margin:8px 0 6px}
    .ref-pmid{display:inline-flex;align-items:center;gap:8px;margin:8px 0 4px;padding:4px 11px 4px 5px;background:var(--blue-soft);border:1px solid var(--line);border-radius:9px;line-height:1;cursor:pointer;transition:background .14s,border-color .14s;font-family:'Inter','DM Sans',sans-serif}
    .ref-pmid:hover,.ref-pmid:active{background:#dbeafe;border-color:#bfdbef}
    [data-theme="dark"] .ref-pmid:hover,[data-theme="dark"] .ref-pmid:active{background:#1d3a52;border-color:#2b526f}
    .ref-pmid-label{display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.01em;color:var(--blue-deep);opacity:.72;line-height:1}
    .ref-pmid-num{display:inline-flex;align-items:center;font-size:13.5px;font-weight:400;color:var(--ink1);font-variant-numeric:tabular-nums;letter-spacing:.02em;padding-left:8px;border-left:1px solid var(--line);line-height:1}
    [data-theme="dark"] .ref-pmid-num{color:var(--ink)}
    /* Inline numbered citations [n] + sidebar number badge */
    .cite-ref{font-size:.72em;line-height:0;vertical-align:super;font-weight:700;white-space:nowrap}
    .cite-ref a{color:var(--blue-deep);text-decoration:none;background:var(--blue-soft);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin:0 1px}
    .cite-ref a:hover{background:#0284C7;color:#fff;border-color:#0284C7}
    [data-theme="dark"] .cite-ref a{color:#9AD9F7;background:rgba(74,166,230,.16);border-color:rgba(74,166,230,.3)}
    [data-theme="dark"] .cite-ref a:hover{background:#4AA6E6;color:#06131f;border-color:#4AA6E6}
    /* Simple, clear reference number in the sidebar */
    .ref-num{flex:none;align-self:center;min-width:18px;text-align:center;color:#0284C7;font-size:13.5px;font-weight:800;margin-right:10px}
    [data-theme="dark"] .ref-num{color:#9AD9F7}
    @keyframes refFlash{0%{box-shadow:0 0 0 0 rgba(2,132,199,.5)}100%{box-shadow:0 0 0 9px rgba(2,132,199,0)}}
    .ref.ref-flash{animation:refFlash 1.3s ease-out;border-color:#0284C7!important}
    .ref-link-chip{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-soft);border:1px solid var(--line);padding:5px 11px;border-radius:20px;text-decoration:none;transition:background .14s,border-color .14s,transform .14s,box-shadow .14s}
    .ref-link-chip:hover,.ref-link-chip:active{background:#dbeafe;border-color:#bfdbef;transform:translateY(-1px);box-shadow:0 2px 6px rgba(2,132,199,.14)}
    [data-theme="dark"] .ref-link-chip:hover,[data-theme="dark"] .ref-link-chip:active{background:#1d3a52;border-color:#2b526f;box-shadow:0 2px 6px rgba(0,0,0,.3)}
    .ref-no-link{color:var(--ink3);background:var(--paper2)}
    .ref-sub-chips{display:flex;flex-direction:column;gap:5px;margin-top:8px}
    .ref-sub-chip{background:none;border:1px dashed var(--line);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;text-align:left;transition:all .13s;font-family:inherit}
    .ref-sub-chip:hover{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-deep)}
    /* ── Image reference results ──────────────────────────────────────── */
    .ref-img-wrap{display:flex;flex-direction:column;gap:4px;margin-top:8px}
    .ref-img-thumb{width:100%;border-radius:8px;max-height:200px;object-fit:cover;cursor:pointer;border:1px solid var(--line);transition:transform .15s}
    .ref-img-thumb:hover{transform:scale(1.02)}
    .ref-img-src{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:11.5px;font-weight:600;color:var(--blue);background:var(--blue-soft);border:1px solid var(--line);border-radius:8px;padding:3px 9px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .12s}
    .ref-img-src:hover{background:var(--coral-soft);color:var(--coral-deep)}
    .ref-img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:10px}
    .ref-img-grid img{width:100%;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .15s}
    .ref-img-grid img:hover{transform:scale(1.04);box-shadow:0 4px 12px rgba(0,0,0,.15)}
    .chat-img-results{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;padding:8px 0}
    .chat-img-card{width:100px;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .15s;background:#fff}
    .chat-img-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.12)}
    .chat-img-card img{width:100%;height:72px;object-fit:cover;display:block}
    .chat-img-card .chat-img-label{font-size:10px;color:var(--ink2);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .img-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s;cursor:pointer}
    .img-lightbox img{max-width:90vw;max-height:85vh;border-radius:8px;object-fit:contain}
    .lb-stage{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:92vw}
    .lb-stage img{max-height:78vh}
    .lb-cap{color:#fff;font-size:13.5px;max-width:680px;text-align:center;line-height:1.45}
    .lb-count{color:rgba(255,255,255,.72);font-size:12px;letter-spacing:.04em}
    .lb-close{position:absolute;top:16px;right:18px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3;transition:background .15s}
    .lb-close:hover{background:rgba(255,255,255,.3)}
    .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:30px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3;transition:background .15s}
    .lb-nav:hover{background:rgba(255,255,255,.3)}
    .lb-prev{left:16px}
    .lb-next{right:16px}
    @media(max-width:820px){.lb-nav{width:40px;height:40px;font-size:26px}.lb-prev{left:6px}.lb-next{right:6px}.lb-close{top:10px;right:10px;width:38px;height:38px}}
    /* Citation links in AI response — clearly styled as references, not plain text */
    .md a{color:#1E40AF;text-decoration:none;font-weight:500;background:#EFF6FF;padding:1px 5px;border-radius:4px;border-bottom:2px solid #93C5FD;transition:background .12s,border-color .12s}
    .md a:hover{background:#DBEAFE;border-bottom-color:var(--blue)}
    .md a::after{content:"↗";font-size:.65em;margin-left:2px;opacity:.55}
    /* Mobile chat topbar */
    .chat-topbar{display:none;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:#fff;flex-shrink:0;z-index:10}
    .chat-topbar-title{flex:1;min-width:0;display:flex;align-items:center;padding:0 4px}
    .chat-topbar-logo{height:14px;width:auto;display:block;cursor:pointer}
    .fab{display:none;position:fixed;bottom:88px;right:18px;background:var(--blue-deep);color:#fff;border:none;border-radius:26px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(12,74,126,.34);z-index:200;gap:8px;align-items:center;font-family:inherit}
    .overlay{position:fixed;inset:0;background:rgba(21,33,43,.45);z-index:150;animation:fadeIn .2s}

    /* MODAL */
    .modal-wrap{position:fixed;inset:0;background:rgba(21,33,43,.5);backdrop-filter:blur(3px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
    .modal{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:30px;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:fadeUp .3s ease}
    .modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:all .15s;flex-shrink:0;padding:0}
    .modal-close:hover{border-color:var(--ink2);background:var(--paper);color:var(--ink)}
    .modal-logo{height:48px;width:48px;border-radius:12px;margin:0 auto 16px;display:block}
    /* pop-up banner wordmark (OTP + privacy modals) — theme-swapped pair */
    .modal-wordmark{height:22px;width:auto;margin:0 auto 14px;display:block}
    .mlogo-dark{display:none}
    [data-theme="dark"] .mlogo-light{display:none}
    [data-theme="dark"] .mlogo-dark{display:block}
    .modal h2{font-family:'Plus Jakarta Sans','Figtree',system-ui,sans-serif;font-size:24px;font-weight:600;color:var(--blue-deep);margin-bottom:8px;line-height:1.2}
    .modal p{font-size:14.5px;color:var(--ink2);line-height:1.55;margin-bottom:20px}
    .modal label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
    .modal input{width:100%;padding:12px 15px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;outline:none;margin-bottom:16px;transition:border-color .15s,box-shadow .15s}
    .modal input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
    .cc-row{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
    .cc-select{flex:0 0 auto;width:138px;max-width:44%;padding:12px 8px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink1);cursor:pointer;outline:none;transition:border-color .15s,box-shadow .15s}
    .cc-select:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
    .cc-row input{flex:1 1 auto;min-width:0;margin-bottom:0 !important}
    .chat-signin-strip{display:flex;align-items:center;gap:12px;max-width:780px;width:100%;margin:0 auto 10px;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-family:inherit;text-align:left;box-shadow:0 4px 16px rgba(2,132,199,.10);transition:transform .16s,box-shadow .16s,border-color .16s}
    .chat-signin-strip:hover{transform:translateY(-1px);border-color:rgba(2,132,199,.40);box-shadow:0 10px 26px rgba(2,132,199,.20)}
    .css-ic{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:#D1FAE5;color:#059669;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(5,150,105,.22)}
    .css-tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
    .css-tx-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .css-tx b{font-size:14px;font-weight:700;color:var(--ink1);line-height:1.2}
    .css-speed{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--blue-deep);background:var(--blue-soft);padding:2px 8px;border-radius:100px;white-space:nowrap}
    .css-tx-sub{font-size:11.5px;color:var(--ink3);line-height:1.3}
    .css-cta{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:#fff;background:var(--blue);padding:8px 15px;border-radius:100px;white-space:nowrap;box-shadow:0 2px 12px rgba(2,132,199,.34);animation:ctaPulse 2.6s ease-in-out infinite;transition:background .15s}
    .chat-signin-strip:hover .css-cta{background:var(--blue-deep);animation:none}

    /* ── Chat input wrapper — premium, mirrors hero search ──────────── */
    .chat-input-wrap{position:relative;flex:1;min-width:0;background:#fff;border-radius:18px;
      box-shadow:0 2px 6px rgba(12,74,126,.04),0 8px 24px rgba(12,74,126,.08);
      border:2px solid transparent;background-clip:padding-box;transition:box-shadow .2s}
    .chat-input-wrap::before{content:"";position:absolute;inset:-2px;border-radius:20px;
      background:linear-gradient(135deg,var(--line),var(--line));z-index:-1;transition:background .2s}
    .chat-input-wrap:focus-within::before{background:linear-gradient(135deg,var(--blue) 0%,var(--teal) 100%)}
    .chat-input-wrap:focus-within{box-shadow:0 4px 6px rgba(255,107,91,.06),0 12px 32px rgba(12,74,126,.12)}
    .chat-input-wrap textarea{width:100%;padding:15px 16px 60px 16px;border:none;border-radius:16px;font-size:16px;font-family:inherit;background:transparent;outline:none;resize:none;min-height:96px;max-height:160px;line-height:1.5;color:var(--ink);display:block}
    .chat-input-wrap textarea::placeholder{color:#b0bac8}
    .chat-input-btns{position:absolute;bottom:9px;right:9px;display:flex;align-items:center;gap:6px}
    .chat-input-btns-left{position:absolute;bottom:9px;left:9px;display:flex;align-items:center;gap:6px}
    [dir="rtl"] .chat-input-btns{right:auto;left:9px}
    [dir="rtl"] .chat-input-btns-left{left:auto;right:9px}
    .chat-send{background:var(--blue);color:#fff;border:none;border-radius:13px;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:filter .14s,transform .1s;flex-shrink:0}
    .chat-send:hover:not(:disabled){filter:brightness(1.08);transform:scale(1.05)}
    .chat-send:active:not(:disabled){transform:scale(.96)}
    .chat-send:disabled{background:var(--line);cursor:not-allowed}

    /* ── Chat mic button ─────────────────────────────────────────────── */
    .chat-mic-btn{flex-shrink:0;width:44px;height:44px;border:1.5px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:all .15s}
    .chat-mic-btn:hover{background:#FEF2F2;border-color:var(--coral);color:var(--coral)}
    .chat-mic-btn.voice-on{background:var(--coral-soft);border-color:var(--coral);color:var(--coral);animation:micPulse 1.2s ease-in-out infinite}

    /* ── Footer ─────────────────────────────────────────────────────── */
    .site-footer{width:100%;background:var(--paper2);border-top:1px solid var(--line);padding:22px 24px 18px;text-align:center;font-size:12.5px;color:var(--ink3);line-height:1.7}
    .site-footer-mark{display:inline-flex;align-items:center;opacity:.55;margin-right:2px;vertical-align:middle;transition:opacity .15s}
    .site-footer-mark svg path{transition:fill .15s}
    .site-footer a:hover .site-footer-mark,.site-footer a:focus .site-footer-mark,.site-footer a:active .site-footer-mark{opacity:1}
    .site-footer a:hover .site-footer-mark svg path,.site-footer a:focus .site-footer-mark svg path,.site-footer a:active .site-footer-mark svg path{fill:var(--blue)}
    .site-footer-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 18px;margin-bottom:8px}
    .site-footer a{color:var(--ink2);text-decoration:none;font-weight:500;transition:color .14s}
    .site-footer a:hover{color:var(--blue)}
    .site-footer-divider{opacity:.4}
    .site-footer-copy{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.6}
    @media(max-width:820px){.site-footer{padding:18px 16px 14px;font-size:12px}}


    /* ── Voice-first: prominent mic CTA below hero search ──────────── */
    .hero-voice-cta{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px auto 0;max-width:680px;cursor:pointer;padding:14px 24px;border-radius:100px;background:var(--coral);color:#fff;font-size:15px;font-weight:600;font-family:inherit;border:none;transition:filter .15s,transform .1s;box-shadow:0 4px 18px rgba(239,68,68,.28)}
    .hero-voice-cta:hover{filter:brightness(1.08);transform:scale(1.02)}
    .hero-voice-cta:active{transform:scale(.97)}
    .hero-voice-cta .hvc-mic{width:28px;height:28px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .hero-voice-cta.voice-on{animation:micPulse 1.2s ease-in-out infinite;background:#DC2626}
    @media(max-width:820px){.hero-voice-cta{margin:12px 18px 0;font-size:14px;padding:12px 20px}}

    /* ── TTS (text-to-speech) button on bot messages ─────────────────── */
    .tts-btn{display:inline-flex;align-items:center;gap:5px;font-family:'Inter','DM Sans',sans-serif;font-size:12.5px;color:var(--ink3);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:5px 11px;cursor:pointer;transition:all .15s}
    .tts-btn:hover{border-color:#0d9488;color:#0d9488;background:#ECFDF5}
    .tts-btn.speaking{border-color:#0d9488;color:#0d9488;background:#ECFDF5;font-weight:600}

    /* ── Follow-up suggestions — quiet editorial chips ───────────────── */
    .followup-chips{display:flex;flex-direction:column;gap:7px;padding:2px 24px 12px;max-width:780px;margin:0 auto;width:100%}
    .followup-label{font-family:'Inter','DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
    .followup-chip{display:flex;align-items:flex-start;gap:9px;background:#fff;color:var(--ink1);border:1px solid var(--line);border-radius:13px;padding:11px 14px;font-size:14px;font-weight:500;font-family:'Inter','DM Sans',sans-serif;cursor:pointer;transition:all .15s;text-align:left;line-height:1.45;min-height:44px}
    .followup-chip::before{content:"+";font-size:16px;font-weight:700;color:var(--coral);flex-shrink:0;line-height:1.3}
    .followup-chip:hover{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-deep)}
    .followup-chip:active{transform:scale(.985)}
    /* Gemini-style live "thinking" — shimmering status text + pulsing spark */
    .typing-status{font-family:'Inter','DM Sans',sans-serif;font-size:13px;font-weight:600;margin-left:9px;
      background:linear-gradient(90deg,var(--ink3) 0%,var(--blue) 38%,var(--coral) 58%,var(--ink3) 78%);
      background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
      color:var(--ink3);-webkit-text-fill-color:transparent;
      animation:shimmerTxt 2.1s linear infinite}
    @keyframes shimmerTxt{0%{background-position:130% 0}100%{background-position:-130% 0}}
    [dir="rtl"] .typing-status{margin-left:0;margin-right:9px}
    .ai-spark{display:block;flex-shrink:0}
    .ai-spark.on{animation:sparkPulse 1.4s ease-in-out infinite}
    @keyframes sparkPulse{0%,100%{transform:scale(1) rotate(0deg);opacity:1}50%{transform:scale(1.22) rotate(12deg);opacity:.7}}
    /* PII nudge above attachments */
    .attach-pii{max-width:780px;margin:0 auto 8px;font-family:'Inter','DM Sans',sans-serif;font-size:12px;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:7px 12px;line-height:1.45}

    /* ── Offline indicator ──────────────────────────────────────────── */
    .offline-bar{position:fixed;top:0;left:0;right:0;z-index:200;background:#FEF2F2;color:#B91C1C;font-size:13px;font-weight:600;text-align:center;padding:8px;font-family:'Inter','DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid #FECACA}
    .offline-dot{width:8px;height:8px;border-radius:50%;background:#DC2626;animation:voiceBlink 1.5s infinite}
    .msg-pending-icon{display:inline-flex;align-items:center;margin-left:4px}
    .msg-pending-icon svg{animation:spin 1.5s linear infinite}

    /* ── Camera button ─────────────────────────────────────────────── */
    .hero-cam,.chat-cam-btn{background:#f8f7f4;border:1.5px solid var(--line);color:var(--ink2);border-radius:13px;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .14s;flex-shrink:0}

            NO question consumed, with an "I'm safe — continue" path so
            informational queries are never trapped (anti-over-firing, cf. owner pass 11).
   ADVISE = acute red flags → non-blocking urgent-care banner, answer continues.

   (Govt. of India — telemanas.mohfw.gov.in); UK 999, Samaritans 116 123. */
var PAJR_CARE_WA="";/* optional: care-team WhatsApp number with country code, e.g. "9196XXXXXXXX" — enables the WhatsApp button on the crisis card */
var CRISIS_BLOCK=[
  /(kill|hurt|harm|cut(ting)?)\s+(myself|my\s*self)/i,
  /\b(end|ending|take|taking)\s+my\s+(own\s+)?life\b/i,
  /\bsuicid/i,
  /\bwant(ed)?\s+to\s+die\b/i,
  /\bdon'?t\s+want\s+to\s+(live|be\s+alive)\b/i,
  /\bno\s+reason\s+to\s+live\b/i,
  /\bbetter\s+off\s+dead\b/i,
  /\bself[\s-]?harm/i,
  /(aa?tma\s*hatya|khud\s*kushi|khudkushi)/i,
  /marna\s+chaht/i,/apni\s+jaan\s+(le|de)/i,
  /(आत्महत्या|ख़ुदकुशी|खुदकुशी)/,/मरना\s*चाहत/,/अपनी\s*जान\s*(ले|दे)/

var CRISIS_ADVISE=[
  /\bchest\s+(pain|tightness|pressure|heaviness)/i,/(seene|सीने)\s*(में|me[in]?)\s*(dard|दर्द)/i,
  /\b(can'?t|cannot|difficulty|trouble)\s+breath/i,/\bshort(ness)?\s+of\s+breath\b/i,/(saans|सांस|साँस)\s*(nahi|नहीं)/i,
  /\bheart\s+attack\b/i,/(dil|दिल)\s*(ka|का)\s*(daura|दौरा)/i,
  /\b(face|mouth)\s+droop/i,/\bslurred\s+speech\b/i,/\bhaving\s+a\s+stroke\b/i,
  /\bunconscious\b/i,/\bunresponsive\b/i,/\bnot\s+waking\s+up\b/i,
  /\bseizure\b/i,/\bconvulsion/i,/(mirgi|मिर्गी)/i,

function detectCrisis(q){
  if(!q)return null;
  for(var i=0;i<CRISIS_BLOCK.length;i++)if(CRISIS_BLOCK[i].test(q))return{mode:'block',cat:'selfharm'};
  for(var j=0;j<CRISIS_ADVISE.length;j++)if(CRISIS_ADVISE[j].test(q))return{mode:'advise',cat:'emergency'};
  return null;
}

var PJT2_I18N = {"en":{"pjt_walk":"Walk through their PaJR","pjt_c1_kick":"82M · Diabetes · High BP 30 yrs · Kidney disease · Telangana","pjt_c1_name":"Care that reached his village","pjt_c1_story":"He is 82 and lives in a remote village in Telangana, far from any clinic and unable to afford a glucometer. Through his PaJR group his diabetes, long-standing high blood pressure and kidney disease are looked after from home. He has learned to read his own sugars and adjust his insulin safely — and in over three years he has not needed a single hospital admission.","pjt_c1_quote":"He is happy with the improvement in his health.","pjt_c1_cap":"His village is 10 km from the nearest PHC. PaJR became his greatest safety net.","pjt_c2_kick":"65M · Metabolic syndrome · High BP · West Bengal","pjt_c2_name":"Off all his blood-pressure pills","pjt_c2_story":"His blood pressure climbed after he lost his wife during the pandemic. Over three years of daily check-ins, small honest changes to how he eats, moves and rests slowly brought it down — until he no longer needed any medication. It has stayed steady since.","pjt_c2_quote":"At 5:30 I left the house and walked to the bridge, did some freehand exercise, then walked on to the tea shop for half a litre of water and a milk tea without sugar.","pjt_c2_cap":"His blood-pressure and pulse readings — tap to enlarge.","pjt_c3_kick":"43F · Anxiety 20 yrs · Skin & metabolic · West Bengal","pjt_c3_name":"Writing her way to calmer days","pjt_c3_story":"A schoolteacher who has lived with anxiety for twenty years. In her PaJR group she writes about her days in her own words — including the day she calmly got a collapsed student to the health centre and stayed until help arrived. Putting life into words has steadied her, and a low-salt diet is bringing her blood pressure down.","pjt_c3_quote":"I really feel safer, healthier with you.","pjt_c3_cap":"Linking anxiety and skin issues by understanding her psychoneuroendocrine axis through PaJR."},"hi":{"pjt_walk":"उनकी PaJR यात्रा देखें","pjt_c1_kick":"82M · मधुमेह · उच्च रक्तचाप 30 वर्ष · गुर्दा रोग · तेलंगाना","pjt_c1_name":"देखभाल जो उनके गाँव तक पहुँची","pjt_c1_story":"वे 82 वर्ष के हैं और तेलंगाना के एक दूरस्थ गाँव में रहते हैं — किसी भी क्लिनिक से दूर और ग्लूकोमीटर ख़रीदने में असमर्थ। अपने PaJR समूह के ज़रिए उनकी मधुमेह, वर्षों पुराना उच्च रक्तचाप और गुर्दा रोग घर से ही संभाले जाते हैं। उन्होंने अपनी शुगर पढ़ना और सुरक्षित रूप से इंसुलिन समायोजित करना सीख लिया है — और तीन साल से अधिक समय में उन्हें एक बार भी अस्पताल में भर्ती नहीं होना पड़ा।","pjt_c1_quote":"वे अपनी सेहत में सुधार से ख़ुश हैं।","pjt_c1_cap":"उनका गाँव नज़दीकी PHC से 10 किमी दूर है। PaJR उनकी सबसे बड़ी सुरक्षा बन गया।","pjt_c2_kick":"65M · मेटाबॉलिक सिंड्रोम · उच्च रक्तचाप · पश्चिम बंगाल","pjt_c2_name":"रक्तचाप की सारी दवाएँ बंद","pjt_c2_story":"महामारी में पत्नी को खोने के बाद उनका रक्तचाप बढ़ गया। तीन साल की रोज़ाना बातचीत और खाने, चलने-फिरने व आराम में छोटे-छोटे ईमानदार बदलावों ने इसे धीरे-धीरे इतना घटाया कि अब उन्हें कोई दवा नहीं चाहिए। तब से यह स्थिर है।","pjt_c2_quote":"5:30 बजे मैं घर से निकला और पुल तक टहला, थोड़ा फ़्रीहैंड व्यायाम किया, फिर चाय की दुकान तक गया — आधा लीटर पानी और बिना चीनी की दूध वाली चाय।","pjt_c2_cap":"उनके रक्तचाप और नाड़ी के रीडिंग — बड़ा करने के लिए टैप करें।","pjt_c3_kick":"43F · चिंता 20 वर्ष · त्वचा व मेटाबॉलिक · पश्चिम बंगाल","pjt_c3_name":"लिखते हुए शांत दिनों की ओर","pjt_c3_story":"एक स्कूल शिक्षिका जो बीस वर्षों से चिंता के साथ जी रही हैं। अपने PaJR समूह में वे अपनी ज़िंदगी अपने शब्दों में लिखती हैं — उस दिन सहित जब उन्होंने बेहोश हुई एक छात्रा को शांति से स्वास्थ्य केंद्र पहुँचाया और मदद आने तक साथ रहीं। बातों को शब्दों में ढालना उन्हें स्थिर कर रहा है, और कम-नमक आहार से उनका रक्तचाप घट रहा है।","pjt_c3_quote":"तुम्हारे साथ मैं सचमुच ज़्यादा सुरक्षित और स्वस्थ महसूस करती हूँ।","pjt_c3_cap":"PaJR के ज़रिए उनके साइकोन्यूरोएंडोक्राइन तंत्र को समझकर चिंता और त्वचा की समस्याओं को जोड़ना।"},"te":{"pjt_walk":"వారి PaJR ప్రయాణాన్ని చూడండి","pjt_c1_kick":"82M · మధుమేహం · అధిక రక్తపోటు 30 ఏళ్లు · మూత్రపిండ వ్యాధి · తెలంగాణ","pjt_c1_name":"ఆయన ఊరికి చేరిన సంరక్షణ","pjt_c1_story":"ఆయన వయసు 82, తెలంగాణలోని ఒక మారుమూల గ్రామంలో నివసిస్తారు — ఏ క్లినిక్‌కూ దూరంగా, గ్లూకోమీటర్ కొనలేని స్థితిలో. తన PaJR గ్రూప్ ద్వారా ఆయన మధుమేహం, చాలా ఏళ్ల అధిక రక్తపోటు, మూత్రపిండ వ్యాధి ఇంటి నుండే చక్కబెట్టబడుతున్నాయి. తన షుగర్‌ను చదవడం, ఇన్సులిన్‌ను సురక్షితంగా సర్దుబాటు చేయడం నేర్చుకున్నారు — మూడేళ్లకు పైగా ఒక్కసారి కూడా ఆసుపత్రిలో చేరాల్సిన అవసరం రాలేదు.","pjt_c1_quote":"తన ఆరోగ్యంలో మెరుగుదల చూసి ఆయన సంతోషంగా ఉన్నారు.","pjt_c1_cap":"ఆయన ఊరు దగ్గరి PHC నుండి 10 కి.మీ. దూరం. PaJR ఆయనకు అతిపెద్ద రక్షణగా మారింది.","pjt_c2_kick":"65M · మెటబాలిక్ సిండ్రోమ్ · అధిక రక్తపోటు · పశ్చిమ బెంగాల్","pjt_c2_name":"రక్తపోటు మందులన్నీ ఆపేశారు","pjt_c2_story":"మహమ్మారిలో భార్యను కోల్పోయాక ఆయన రక్తపోటు పెరిగింది. మూడేళ్ల రోజువారీ సంభాషణలు, తినడం-నడవడం-విశ్రాంతిలో చిన్న చిన్న నిజాయితీ మార్పులు దాన్ని క్రమంగా ఎంతగా తగ్గించాయంటే ఇక ఏ మందూ అవసరం లేదు. అప్పటి నుండి అది స్థిరంగా ఉంది.","pjt_c2_quote":"5:30కి ఇంటి నుండి బయలుదేరి వంతెన వరకు నడిచాను, కొంత ఫ్రీహ్యాండ్ వ్యాయామం చేశాను, తర్వాత టీ దుకాణం వరకు నడిచి — అర లీటరు నీళ్లు, చక్కెర లేని పాల టీ తాగాను.","pjt_c2_cap":"ఆయన రక్తపోటు, నాడి రీడింగ్‌లు — పెద్దది చేయడానికి నొక్కండి.","pjt_c3_kick":"43F · ఆందోళన 20 ఏళ్లు · చర్మం & మెటబాలిక్ · పశ్చిమ బెంగాల్","pjt_c3_name":"రాస్తూ ప్రశాంత రోజుల వైపు","pjt_c3_story":"ఇరవై ఏళ్లుగా ఆందోళనతో జీవిస్తున్న ఒక స్కూల్ టీచర్. తన PaJR గ్రూప్‌లో ఆమె తన రోజులను సొంత మాటల్లో రాస్తారు — స్పృహ తప్పిన ఒక విద్యార్థినిని ప్రశాంతంగా ఆరోగ్య కేంద్రానికి చేర్చి, సాయం వచ్చేవరకు తోడుగా ఉన్న రోజుతో సహా. జీవితాన్ని మాటల్లో పెట్టడం ఆమెను నిలకడగా చేస్తోంది, తక్కువ ఉప్పు ఆహారం ఆమె రక్తపోటును తగ్గిస్తోంది.","pjt_c3_quote":"నీతో నేను నిజంగా మరింత సురక్షితంగా, ఆరోగ్యంగా అనిపిస్తోంది.","pjt_c3_cap":"PaJR ద్వారా ఆమె సైకోన్యూరోఎండోక్రైన్ అక్షాన్ని అర్థం చేసుకుని ఆందోళన, చర్మ సమస్యలను అనుసంధానించడం."},"ta":{"pjt_walk":"அவரின் PaJR பயணத்தைப் பாருங்கள்","pjt_c1_kick":"82M · நீரிழிவு · உயர் ரத்த அழுத்தம் 30 ஆண்டு · சிறுநீரக நோய் · தெலங்கானா","pjt_c1_name":"அவரின் கிராமத்தை எட்டிய பராமரிப்பு","pjt_c1_story":"அவருக்கு 82 வயது, தெலங்கானாவின் ஒரு தொலைதூர கிராமத்தில் வசிக்கிறார் — எந்த மருத்துவமனைக்கும் தொலைவில், குளுக்கோமீட்டர் வாங்க இயலாதவர். தனது PaJR குழுவின் மூலம் அவரது நீரிழிவு, பல ஆண்டு உயர் ரத்த அழுத்தம், சிறுநீரக நோய் வீட்டிலிருந்தே கவனிக்கப்படுகின்றன. தனது சர்க்கரையை படிக்கவும், இன்சுலினை பாதுகாப்பாக சரிசெய்யவும் கற்றுக்கொண்டார் — மூன்று ஆண்டுகளுக்கும் மேலாக ஒருமுறை கூட மருத்துவமனையில் சேர வேண்டியதில்லை.","pjt_c1_quote":"தனது உடல்நலம் முன்னேறியதில் அவர் மகிழ்ச்சியாக இருக்கிறார்.","pjt_c1_cap":"அவரின் கிராமம் அருகிலுள்ள PHC-யிலிருந்து 10 கி.மீ. தொலைவு. PaJR அவரின் மிகப்பெரிய பாதுகாப்பு வலையானது.","pjt_c2_kick":"65M · வளர்சிதை நோய்க்குறி · உயர் ரத்த அழுத்தம் · மேற்கு வங்கம்","pjt_c2_name":"ரத்த அழுத்த மாத்திரைகள் அனைத்தும் நிறுத்தம்","pjt_c2_story":"தொற்றுநோய் காலத்தில் மனைவியை இழந்த பிறகு அவரது ரத்த அழுத்தம் உயர்ந்தது. மூன்று ஆண்டு தினசரி உரையாடல்களும், உணவு, நடை, ஓய்வில் சிறிய நேர்மையான மாற்றங்களும் அதை மெல்ல மெல்ல குறைத்தன — இறுதியில் எந்த மருந்தும் தேவையில்லாமல் போனது. அன்றிலிருந்து அது நிலையாக உள்ளது.","pjt_c2_quote":"5:30 மணிக்கு வீட்டை விட்டு புறப்பட்டு பாலம் வரை நடந்தேன், சிறிது ஃப்ரீஹேண்ட் பயிற்சி செய்தேன், பின்பு தேநீர் கடை வரை நடந்து — அரை லிட்டர் தண்ணீர், சர்க்கரை இல்லாத பால் தேநீர் அருந்தினேன்.","pjt_c2_cap":"அவரின் ரத்த அழுத்தம் & நாடித் துடிப்பு அளவீடுகள் — பெரிதாக்கத் தட்டவும்.","pjt_c3_kick":"43F · பதற்றம் 20 ஆண்டு · தோல் & வளர்சிதை · மேற்கு வங்கம்","pjt_c3_name":"எழுதி அமைதியான நாட்களை நோக்கி","pjt_c3_story":"இருபது ஆண்டுகளாக பதற்றத்துடன் வாழும் ஒரு பள்ளி ஆசிரியை. தனது PaJR குழுவில் அவர் தனது நாட்களை சொந்த வார்த்தைகளில் எழுதுகிறார் — மயங்கி விழுந்த ஒரு மாணவியை அமைதியாக சுகாதார மையத்துக்கு அழைத்துச் சென்று, உதவி வரும் வரை உடனிருந்த நாள் உட்பட. வாழ்க்கையை வார்த்தைகளாக்குவது அவரை நிலைப்படுத்துகிறது, குறைந்த உப்பு உணவு அவரின் ரத்த அழுத்தத்தைக் குறைக்கிறது.","pjt_c3_quote":"உன்னுடன் நான் உண்மையிலேயே மிகவும் பாதுகாப்பாகவும் ஆரோக்கியமாகவும் உணர்கிறேன்.","pjt_c3_cap":"PaJR மூலம் அவரின் சைக்கோநியூரோஎண்டோகிரைன் அச்சைப் புரிந்துகொண்டு பதற்றத்தையும் தோல் பிரச்சினைகளையும் இணைத்தல்."},"mr":{"pjt_walk":"त्यांची PaJR यात्रा पाहा","pjt_c1_kick":"82M · मधुमेह · उच्च रक्तदाब 30 वर्षे · मूत्रपिंड आजार · तेलंगणा","pjt_c1_name":"त्यांच्या गावापर्यंत पोहोचलेली काळजी","pjt_c1_story":"ते 82 वर्षांचे असून तेलंगणातील एका दुर्गम गावात राहतात — कोणत्याही दवाखान्यापासून दूर आणि ग्लुकोमीटर घेणे न परवडणारे. त्यांच्या PaJR गटामार्फत त्यांचा मधुमेह, अनेक वर्षांचा उच्च रक्तदाब आणि मूत्रपिंड आजार घरूनच सांभाळले जातात. त्यांनी स्वतःची साखर वाचणे आणि इन्सुलिन सुरक्षितपणे जुळवणे शिकले आहे — आणि तीन वर्षांहून अधिक काळात त्यांना एकदाही रुग्णालयात दाखल व्हावे लागले नाही.","pjt_c1_quote":"आपल्या तब्येतीतील सुधारणेमुळे ते आनंदी आहेत.","pjt_c1_cap":"त्यांचे गाव जवळच्या PHC पासून 10 किमी दूर आहे. PaJR त्यांचे सर्वात मोठे सुरक्षाकवच ठरले.","pjt_c2_kick":"65M · मेटाबॉलिक सिंड्रोम · उच्च रक्तदाब · पश्चिम बंगाल","pjt_c2_name":"रक्तदाबाच्या सर्व गोळ्या बंद","pjt_c2_story":"महामारीत पत्नी गमावल्यानंतर त्यांचा रक्तदाब वाढला. तीन वर्षांच्या रोजच्या संवादाने आणि खाणे, चालणे व विश्रांतीतील लहान प्रामाणिक बदलांनी तो हळूहळू इतका कमी केला की आता कोणतेही औषध लागत नाही. तेव्हापासून तो स्थिर आहे.","pjt_c2_quote":"5:30 वाजता मी घरातून निघालो आणि पुलापर्यंत चाललो, थोडा फ्रीहँड व्यायाम केला, मग चहाच्या दुकानापर्यंत — अर्धा लिटर पाणी आणि साखरेविना दुधाचा चहा.","pjt_c2_cap":"त्यांची रक्तदाब व नाडीची रीडिंग — मोठे करण्यासाठी टॅप करा.","pjt_c3_kick":"43F · चिंता 20 वर्षे · त्वचा व मेटाबॉलिक · पश्चिम बंगाल","pjt_c3_name":"लिहित शांत दिवसांकडे","pjt_c3_story":"वीस वर्षांपासून चिंतेसह जगणारी एक शाळाशिक्षिका. आपल्या PaJR गटात ती आपले दिवस स्वतःच्या शब्दांत लिहिते — बेशुद्ध पडलेल्या एका विद्यार्थिनीला शांतपणे आरोग्य केंद्रात नेऊन मदत येईपर्यंत सोबत राहिलेल्या त्या दिवसासह. आयुष्य शब्दांत मांडणे तिला स्थिर करत आहे, आणि कमी-मीठ आहारामुळे तिचा रक्तदाब कमी होत आहे.","pjt_c3_quote":"तुझ्यासोबत मला खरोखरच अधिक सुरक्षित आणि निरोगी वाटते.","pjt_c3_cap":"PaJR द्वारे तिच्या सायकोन्युरोएंडोक्राइन अक्षाचे आकलन करून चिंता आणि त्वचेच्या समस्या जोडणे."},"bn":{"pjt_walk":"তাঁর PaJR যাত্রা দেখুন","pjt_c1_kick":"82M · ডায়াবেটিস · উচ্চ রক্তচাপ ৩০ বছর · কিডনি রোগ · তেলেঙ্গানা","pjt_c1_name":"যে যত্ন তাঁর গ্রামে পৌঁছেছে","pjt_c1_story":"তাঁর বয়স ৮২, তেলেঙ্গানার এক প্রত্যন্ত গ্রামে থাকেন — কোনো ক্লিনিক থেকে দূরে এবং গ্লুকোমিটার কেনার সামর্থ্য নেই। তাঁর PaJR গ্রুপের মাধ্যমে তাঁর ডায়াবেটিস, বহু বছরের উচ্চ রক্তচাপ ও কিডনি রোগ বাড়ি থেকেই দেখাশোনা হয়। তিনি নিজের সুগার পড়া আর নিরাপদে ইনসুলিন সামঞ্জস্য করা শিখেছেন — আর তিন বছরেরও বেশি সময়ে একবারও হাসপাতালে ভর্তি হতে হয়নি।","pjt_c1_quote":"নিজের স্বাস্থ্যের উন্নতিতে তিনি খুশি।","pjt_c1_cap":"তাঁর গ্রাম নিকটতম PHC থেকে ১০ কিমি দূরে। PaJR হয়ে উঠল তাঁর সবচেয়ে বড় নিরাপত্তা।","pjt_c2_kick":"65M · মেটাবলিক সিনড্রোম · উচ্চ রক্তচাপ · পশ্চিমবঙ্গ","pjt_c2_name":"রক্তচাপের সব ওষুধ বন্ধ","pjt_c2_story":"মহামারিতে স্ত্রীকে হারানোর পর তাঁর রক্তচাপ বেড়ে যায়। তিন বছরের প্রতিদিনের কথোপকথন এবং খাওয়া, চলাফেরা ও বিশ্রামে ছোট ছোট সৎ পরিবর্তন ধীরে ধীরে এমনভাবে তা কমিয়ে আনে যে আর কোনো ওষুধ লাগে না। তখন থেকে তা স্থিতিশীল।","pjt_c2_quote":"৫:৩০-এ বাড়ি থেকে বেরিয়ে সেতু পর্যন্ত হাঁটলাম, কিছুটা ফ্রিহ্যান্ড ব্যায়াম করলাম, তারপর চায়ের দোকান পর্যন্ত — আধ লিটার জল আর চিনি ছাড়া দুধ চা।","pjt_c2_cap":"তাঁর রক্তচাপ ও নাড়ির রিডিং — বড় করে দেখতে ট্যাপ করুন।","pjt_c3_kick":"43F · উদ্বেগ ২০ বছর · ত্বক ও মেটাবলিক · পশ্চিমবঙ্গ","pjt_c3_name":"লিখতে লিখতে শান্ত দিনের পথে","pjt_c3_story":"কুড়ি বছর ধরে উদ্বেগ নিয়ে বেঁচে থাকা একজন স্কুলশিক্ষিকা। তাঁর PaJR গ্রুপে তিনি নিজের দিনগুলো নিজের ভাষায় লেখেন — যে দিন অজ্ঞান হয়ে পড়া এক ছাত্রীকে শান্তভাবে স্বাস্থ্যকেন্দ্রে নিয়ে গিয়ে সাহায্য আসা পর্যন্ত পাশে ছিলেন, সেই দিনসহ। জীবনকে কথায় গাঁথা তাঁকে স্থির করছে, আর কম-নুন খাবারে তাঁর রক্তচাপ কমছে।","pjt_c3_quote":"তোমার সঙ্গে আমি সত্যিই অনেক বেশি নিরাপদ আর সুস্থ বোধ করি।","pjt_c3_cap":"PaJR-এর মাধ্যমে তাঁর সাইকোনিউরোএন্ডোক্রাইন অক্ষ বুঝে উদ্বেগ ও ত্বকের সমস্যাকে যুক্ত করা।"},"kn":{"pjt_walk":"ಅವರ PaJR ಪ್ರಯಾಣವನ್ನು ನೋಡಿ","pjt_c1_kick":"82M · ಮಧುಮೇಹ · ಅಧಿಕ ರಕ್ತದೊತ್ತಡ 30 ವರ್ಷ · ಮೂತ್ರಪಿಂಡ ಕಾಯಿಲೆ · ತೆಲಂಗಾಣ","pjt_c1_name":"ಅವರ ಹಳ್ಳಿಗೆ ತಲುಪಿದ ಆರೈಕೆ","pjt_c1_story":"ಅವರಿಗೆ 82 ವರ್ಷ, ತೆಲಂಗಾಣದ ಒಂದು ದೂರದ ಹಳ್ಳಿಯಲ್ಲಿ ವಾಸಿಸುತ್ತಾರೆ — ಯಾವುದೇ ಕ್ಲಿನಿಕ್‌ನಿಂದ ದೂರ, ಗ್ಲುಕೋಮೀಟರ್ ಕೊಳ್ಳಲಾಗದ ಸ್ಥಿತಿ. ತಮ್ಮ PaJR ಗುಂಪಿನ ಮೂಲಕ ಅವರ ಮಧುಮೇಹ, ಹಲವು ವರ್ಷಗಳ ಅಧಿಕ ರಕ್ತದೊತ್ತಡ ಮತ್ತು ಮೂತ್ರಪಿಂಡ ಕಾಯಿಲೆ ಮನೆಯಿಂದಲೇ ನಿರ್ವಹಿಸಲ್ಪಡುತ್ತವೆ. ತಮ್ಮ ಸಕ್ಕರೆಯನ್ನು ಓದುವುದು, ಇನ್ಸುಲಿನ್ ಅನ್ನು ಸುರಕ್ಷಿತವಾಗಿ ಹೊಂದಿಸುವುದು ಕಲಿತಿದ್ದಾರೆ — ಮೂರು ವರ್ಷಗಳಿಗೂ ಹೆಚ್ಚು ಕಾಲ ಒಮ್ಮೆಯೂ ಆಸ್ಪತ್ರೆಗೆ ದಾಖಲಾಗಬೇಕಾಗಿಲ್ಲ.","pjt_c1_quote":"ತಮ್ಮ ಆರೋಗ್ಯದ ಸುಧಾರಣೆಯಿಂದ ಅವರು ಸಂತೋಷವಾಗಿದ್ದಾರೆ.","pjt_c1_cap":"ಅವರ ಹಳ್ಳಿ ಹತ್ತಿರದ PHC ಯಿಂದ 10 ಕಿ.ಮೀ. ದೂರ. PaJR ಅವರ ಅತಿದೊಡ್ಡ ಸುರಕ್ಷಾ ಜಾಲವಾಯಿತು.","pjt_c2_kick":"65M · ಮೆಟಬಾಲಿಕ್ ಸಿಂಡ್ರೋಮ್ · ಅಧಿಕ ರಕ್ತದೊತ್ತಡ · ಪಶ್ಚಿಮ ಬಂಗಾಳ","pjt_c2_name":"ರಕ್ತದೊತ್ತಡದ ಎಲ್ಲಾ ಮಾತ್ರೆಗಳು ನಿಂತವು","pjt_c2_story":"ಸಾಂಕ್ರಾಮಿಕದಲ್ಲಿ ಪತ್ನಿಯನ್ನು ಕಳೆದುಕೊಂಡ ಮೇಲೆ ಅವರ ರಕ್ತದೊತ್ತಡ ಏರಿತು. ಮೂರು ವರ್ಷಗಳ ದಿನನಿತ್ಯದ ಮಾತುಕತೆ ಮತ್ತು ತಿನ್ನುವುದು, ನಡೆಯುವುದು, ವಿಶ್ರಾಂತಿಯಲ್ಲಿ ಸಣ್ಣ ಪ್ರಾಮಾಣಿಕ ಬದಲಾವಣೆಗಳು ಅದನ್ನು ನಿಧಾನವಾಗಿ ಎಷ್ಟು ಇಳಿಸಿದವೆಂದರೆ ಈಗ ಯಾವ ಔಷಧಿಯೂ ಬೇಕಿಲ್ಲ. ಅಂದಿನಿಂದ ಅದು ಸ್ಥಿರವಾಗಿದೆ.","pjt_c2_quote":"5:30ಕ್ಕೆ ಮನೆಯಿಂದ ಹೊರಟು ಸೇತುವೆಯವರೆಗೆ ನಡೆದೆ, ಸ್ವಲ್ಪ ಫ್ರೀಹ್ಯಾಂಡ್ ವ್ಯಾಯಾಮ ಮಾಡಿದೆ, ನಂತರ ಚಹಾ ಅಂಗಡಿಯವರೆಗೆ — ಅರ್ಧ ಲೀಟರ್ ನೀರು, ಸಕ್ಕರೆ ಇಲ್ಲದ ಹಾಲಿನ ಚಹಾ.","pjt_c2_cap":"ಅವರ ರಕ್ತದೊತ್ತಡ ಮತ್ತು ನಾಡಿ ರೀಡಿಂಗ್‌ಗಳು — ದೊಡ್ಡದಾಗಿಸಲು ಟ್ಯಾಪ್ ಮಾಡಿ.","pjt_c3_kick":"43F · ಆತಂಕ 20 ವರ್ಷ · ಚರ್ಮ & ಮೆಟಬಾಲಿಕ್ · ಪಶ್ಚಿಮ ಬಂಗಾಳ","pjt_c3_name":"ಬರೆಯುತ್ತಾ ಶಾಂತ ದಿನಗಳೆಡೆಗೆ","pjt_c3_story":"ಇಪ್ಪತ್ತು ವರ್ಷಗಳಿಂದ ಆತಂಕದೊಂದಿಗೆ ಬದುಕುತ್ತಿರುವ ಒಬ್ಬ ಶಾಲಾ ಶಿಕ್ಷಕಿ. ತಮ್ಮ PaJR ಗುಂಪಿನಲ್ಲಿ ಅವರು ತಮ್ಮ ದಿನಗಳನ್ನು ಸ್ವಂತ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯುತ್ತಾರೆ — ಪ್ರಜ್ಞೆ ತಪ್ಪಿ ಬಿದ್ದ ಒಬ್ಬ ವಿದ್ಯಾರ್ಥಿನಿಯನ್ನು ಶಾಂತವಾಗಿ ಆರೋಗ್ಯ ಕೇಂದ್ರಕ್ಕೆ ಕರೆದೊಯ್ದು ಸಹಾಯ ಬರುವವರೆಗೆ ಜೊತೆಗಿದ್ದ ದಿನ ಸೇರಿದಂತೆ. ಬದುಕನ್ನು ಮಾತುಗಳಲ್ಲಿ ಹಿಡಿದಿಡುವುದು ಅವರನ್ನು ಸ್ಥಿರಗೊಳಿಸುತ್ತಿದೆ, ಕಡಿಮೆ ಉಪ್ಪಿನ ಆಹಾರ ಅವರ ರಕ್ತದೊತ್ತಡವನ್ನು ಇಳಿಸುತ್ತಿದೆ.","pjt_c3_quote":"ನಿನ್ನ ಜೊತೆ ನಾನು ನಿಜವಾಗಿಯೂ ಹೆಚ್ಚು ಸುರಕ್ಷಿತ, ಆರೋಗ್ಯವಾಗಿ ಭಾವಿಸುತ್ತೇನೆ.","pjt_c3_cap":"PaJR ಮೂಲಕ ಅವರ ಸೈಕೋನ್ಯೂರೋಎಂಡೋಕ್ರೈನ್ ಅಕ್ಷವನ್ನು ಅರ್ಥಮಾಡಿಕೊಂಡು ಆತಂಕ ಮತ್ತು ಚರ್ಮದ ಸಮಸ್ಯೆಗಳನ್ನು ಜೋಡಿಸುವುದು."},"gu":{"pjt_walk":"તેમની PaJR યાત્રા જુઓ","pjt_c1_kick":"82M · ડાયાબિટીસ · હાઈ બીપી 30 વર્ષ · કિડની રોગ · તેલંગાણા","pjt_c1_name":"તેમના ગામ સુધી પહોંચેલી સંભાળ","pjt_c1_story":"તેઓ 82 વર્ષના છે અને તેલંગાણાના એક દૂરના ગામમાં રહે છે — કોઈ ક્લિનિકથી દૂર અને ગ્લુકોમીટર ખરીદવા અસમર્થ. તેમના PaJR જૂથ દ્વારા તેમનો ડાયાબિટીસ, વર્ષોજૂનો હાઈ બીપી અને કિડની રોગ ઘરેથી જ સંભાળાય છે. તેમણે પોતાની સુગર વાંચતા અને ઇન્સ્યુલિન સલામત રીતે ગોઠવતા શીખ્યું છે — અને ત્રણ વર્ષથી વધુ સમયમાં એક પણ વાર હોસ્પિટલમાં દાખલ થવું પડ્યું નથી.","pjt_c1_quote":"પોતાના સ્વાસ્થ્યમાં સુધારાથી તેઓ ખુશ છે.","pjt_c1_cap":"તેમનું ગામ નજીકના PHC થી 10 કિમી દૂર છે. PaJR તેમની સૌથી મોટી સલામતી બની ગયું.","pjt_c2_kick":"65M · મેટાબોલિક સિન્ડ્રોમ · હાઈ બીપી · પશ્ચિમ બંગાળ","pjt_c2_name":"બ્લડ પ્રેશરની બધી ગોળીઓ બંધ","pjt_c2_story":"મહામારીમાં પત્ની ગુમાવ્યા પછી તેમનું બ્લડ પ્રેશર વધ્યું. ત્રણ વર્ષની રોજિંદી વાતચીત અને ખાવા, ચાલવા તથા આરામમાં નાના પ્રામાણિક ફેરફારોએ તેને ધીમે ધીમે એટલું ઘટાડ્યું કે હવે કોઈ દવા જોઈતી નથી. ત્યારથી તે સ્થિર છે.","pjt_c2_quote":"5:30 વાગ્યે હું ઘરેથી નીકળ્યો અને પુલ સુધી ચાલ્યો, થોડી ફ્રીહેન્ડ કસરત કરી, પછી ચાની દુકાન સુધી — અડધો લિટર પાણી અને ખાંડ વગરની દૂધવાળી ચા.","pjt_c2_cap":"તેમના બ્લડ પ્રેશર અને નાડીના રીડિંગ — મોટું કરવા ટૅપ કરો.","pjt_c3_kick":"43F · ચિંતા 20 વર્ષ · ત્વચા અને મેટાબોલિક · પશ્ચિમ બંગાળ","pjt_c3_name":"લખતાં લખતાં શાંત દિવસો તરફ","pjt_c3_story":"વીસ વર્ષથી ચિંતા સાથે જીવતી એક શાળાશિક્ષિકા. પોતાના PaJR જૂથમાં તે પોતાના દિવસો પોતાના શબ્દોમાં લખે છે — બેહોશ થઈ ગયેલી એક વિદ્યાર્થિનીને શાંતિથી આરોગ્ય કેન્દ્રે લઈ જઈ મદદ આવે ત્યાં સુધી સાથે રહેલા તે દિવસ સહિત. જીવનને શબ્દોમાં ઢાળવું તેને સ્થિર કરી રહ્યું છે, અને ઓછા-મીઠાવાળો આહાર તેનું બ્લડ પ્રેશર ઘટાડી રહ્યો છે.","pjt_c3_quote":"તારી સાથે હું ખરેખર વધુ સલામત અને સ્વસ્થ અનુભવું છું.","pjt_c3_cap":"PaJR દ્વારા તેના સાયકોન્યુરોએન્ડોક્રાઇન અક્ષને સમજીને ચિંતા અને ત્વચાની સમસ્યાઓને જોડવી."},"ml":{"pjt_walk":"അവരുടെ PaJR യാത്ര കാണൂ","pjt_c1_kick":"82M · പ്രമേഹം · ഉയര്‍ന്ന രക്തസമ്മര്‍ദ്ദം 30 വര്‍ഷം · വൃക്കരോഗം · തെലങ്കാന","pjt_c1_name":"അവന്റെ ഗ്രാമത്തിലെത്തിയ പരിചരണം","pjt_c1_story":"അദ്ദേഹത്തിന് 82 വയസ്സ്, തെലങ്കാനയിലെ ഒരു വിദൂര ഗ്രാമത്തിലാണ് താമസം — ഏതു ക്ലിനിക്കില്‍ നിന്നും അകലെ, ഗ്ലൂക്കോമീറ്റര്‍ വാങ്ങാന്‍ കഴിയാത്ത അവസ്ഥ. തന്റെ PaJR ഗ്രൂപ്പിലൂടെ അദ്ദേഹത്തിന്റെ പ്രമേഹം, വര്‍ഷങ്ങളായുള്ള ഉയര്‍ന്ന രക്തസമ്മര്‍ദ്ദം, വൃക്കരോഗം എന്നിവ വീട്ടില്‍ നിന്നുതന്നെ പരിചരിക്കപ്പെടുന്നു. സ്വന്തം ഷുഗര്‍ വായിക്കാനും ഇന്‍സുലിന്‍ സുരക്ഷിതമായി ക്രമീകരിക്കാനും പഠിച്ചു — മൂന്നു വര്‍ഷത്തിലേറെയായി ഒരിക്കല്‍ പോലും ആശുപത്രിയില്‍ പ്രവേശിപ്പിക്കേണ്ടി വന്നിട്ടില്ല.","pjt_c1_quote":"തന്റെ ആരോഗ്യത്തിലെ പുരോഗതിയില്‍ അദ്ദേഹം സന്തുഷ്ടനാണ്.","pjt_c1_cap":"അവന്റെ ഗ്രാമം അടുത്തുള്ള PHC യില്‍ നിന്ന് 10 കിലോമീറ്റര്‍ അകലെ. PaJR അദ്ദേഹത്തിന്റെ ഏറ്റവും വലിയ സുരക്ഷാവലയമായി.","pjt_c2_kick":"65M · മെറ്റബോളിക് സിന്‍ഡ്രോം · ഉയര്‍ന്ന രക്തസമ്മര്‍ദ്ദം · പശ്ചിമ ബംഗാള്‍","pjt_c2_name":"രക്തസമ്മര്‍ദ്ദ ഗുളികകളെല്ലാം നിര്‍ത്തി","pjt_c2_story":"മഹാമാരിയില്‍ ഭാര്യയെ നഷ്ടപ്പെട്ടശേഷം അദ്ദേഹത്തിന്റെ രക്തസമ്മര്‍ദ്ദം ഉയര്‍ന്നു. മൂന്നു വര്‍ഷത്തെ ദിനംപ്രതിയുള്ള സംഭാഷണവും ഭക്ഷണം, നടത്തം, വിശ്രമം എന്നിവയിലെ ചെറിയ സത്യസന്ധമായ മാറ്റങ്ങളും അതിനെ പതുക്കെ ഇത്രയും കുറച്ചു — ഇനി ഒരു മരുന്നും വേണ്ടാതായി. അന്നുമുതല്‍ അത് സ്ഥിരമാണ്.","pjt_c2_quote":"5:30ന് വീട്ടില്‍ നിന്നിറങ്ങി പാലം വരെ നടന്നു, അല്പം ഫ്രീഹാന്‍ഡ് വ്യായാമം ചെയ്തു, പിന്നെ ചായക്കടവരെ — അര ലിറ്റര്‍ വെള്ളവും പഞ്ചസാരയില്ലാത്ത പാല്‍ച്ചായയും.","pjt_c2_cap":"അദ്ദേഹത്തിന്റെ രക്തസമ്മര്‍ദ്ദം, പള്‍സ് റീഡിംഗുകള്‍ — വലുതാക്കാന്‍ ടാപ്പ് ചെയ്യൂ.","pjt_c3_kick":"43F · ഉത്കണ്ഠ 20 വര്‍ഷം · ത്വക്ക് & മെറ്റബോളിക് · പശ്ചിമ ബംഗാള്‍","pjt_c3_name":"എഴുതി ശാന്തമായ ദിനങ്ങളിലേക്ക്","pjt_c3_story":"ഇരുപതു വര്‍ഷമായി ഉത്കണ്ഠയോടെ ജീവിക്കുന്ന ഒരു സ്കൂള്‍ അധ്യാപിക. തന്റെ PaJR ഗ്രൂപ്പില്‍ അവര്‍ തന്റെ ദിനങ്ങള്‍ സ്വന്തം വാക്കുകളില്‍ എഴുതുന്നു — ബോധംകെട്ടു വീണ ഒരു വിദ്യാര്‍ഥിനിയെ ശാന്തമായി ആരോഗ്യ കേന്ദ്രത്തിലെത്തിച്ച് സഹായം വരുന്നതുവരെ കൂടെനിന്ന ദിവസമടക്കം. ജീവിതം വാക്കുകളിലാക്കുന്നത് അവരെ സ്ഥിരപ്പെടുത്തുന്നു, കുറഞ്ഞ ഉപ്പുള്ള ഭക്ഷണം അവരുടെ രക്തസമ്മര്‍ദ്ദം കുറയ്ക്കുന്നു.","pjt_c3_quote":"നിന്നോടൊപ്പം എനിക്ക് ശരിക്കും കൂടുതല്‍ സുരക്ഷിതവും ആരോഗ്യകരവുമായി തോന്നുന്നു."," c3_cap":"PaJR ਰਾਹੀਂ ਉਸਦੇ ਸਾਈਕੋਨਿਊਰੋਐਂਡੋਕ੍ਰਾਈਨ ਧੁਰੇ ਨੂੰ ਸਮਝ ਕੇ ਚਿੰਤਾ ਅਤੇ ਚਮੜੀ ਦੀਆਂ ਸਮੱਸਿਆਵਾਂ ਨੂੰ ਜੋੜਨਾ।"},"ur":{"pjt_walk":"ان کے PaJR کا سفر دیکھیں","pjt_c1_kick":"82M · ذیابیطس · ہائی بی پی 30 سال · گردے کی بیماری · تلنگانہ","pjt_c1_name":"دیکھ بھال جو ان کے گاؤں تک پہنچی","pjt_c1_story":"اُن کی عمر 82 سال ہے اور وہ تلنگانہ کے ایک دور افتادہ گاؤں میں رہتے ہیں — کسی کلینک سے دور اور گلوکومیٹر خریدنے سے قاصر۔ اپنے PaJR گروپ کے ذریعے ان کی ذیابیطس، برسوں پرانا ہائی بلڈ پریشر اور گردے کی بیماری گھر ہی سے سنبھالے جاتے ہیں۔ انہوں نے اپنی شوگر پڑھنا اور انسولین کو محفوظ طریقے سے ایڈجسٹ کرنا سیکھ لیا ہے — اور تین سال سے زائد عرصے میں ایک بار بھی اسپتال میں داخل نہیں ہونا پڑا۔","pjt_c1_quote":"اپنی صحت میں بہتری سے وہ خوش ہیں۔","pjt_c1_cap":"ان کا گاؤں قریبی PHC سے 10 کلومیٹر دور ہے۔ PaJR ان کا سب سے بڑا تحفظ بن گیا۔","pjt_c2_kick":"65M · میٹابولک سنڈروم · ہائی بی پی · مغربی بنگال","pjt_c2_name":"بلڈ پریشر کی تمام گولیاں بند","pjt_c2_story":"وبا میں اہلیہ کے انتقال کے بعد ان کا بلڈ پریشر بڑھ گیا۔ تین سال کی روزانہ گفتگو اور کھانے، چلنے پھرنے اور آرام میں چھوٹی چھوٹی سچی تبدیلیوں نے اسے آہستہ آہستہ اتنا کم کر دیا کہ اب کسی دوا کی ضرورت نہیں۔ تب سے یہ مستحکم ہے۔","pjt_c2_quote":"5:30 پر میں گھر سے نکلا اور پل تک پیدل گیا، کچھ فری ہینڈ ورزش کی، پھر چائے کی دکان تک — آدھا لیٹر پانی اور بغیر چینی دودھ والی چائے۔","pjt_c2_cap":"ان کے بلڈ پریشر اور نبض کی ریڈنگ — بڑا کرنے کے لیے ٹیپ کریں۔","pjt_c3_kick":"43F · پریشانی 20 سال · جلد و میٹابولک · مغربی بنگال","pjt_c3_name":"لکھتے ہوئے پُرسکون دنوں کی طرف","pjt_c3_story":"بیس سال سے پریشانی کے ساتھ جینے والی ایک اسکول ٹیچر۔ اپنے PaJR گروپ میں وہ اپنے دن اپنے الفاظ میں لکھتی ہیں — اُس دن سمیت جب انہوں نے بے ہوش ہو جانے والی ایک طالبہ کو سکون سے صحت مرکز پہنچایا اور مدد آنے تک ساتھ رہیں۔ زندگی کو الفاظ میں ڈھالنا انہیں مستحکم کر رہا ہے، اور کم نمک والی غذا ان کا بلڈ پریشر کم کر رہی ہے۔","pjt_c3_quote":"تمہارے ساتھ مجھے واقعی زیادہ محفوظ اور صحت مند محسوس ہوتا ہے۔","pjt_c3_cap":"PaJR کے ذریعے ان کے سائیکونیورواینڈوکرائن محور کو سمجھ کر پریشانی اور جلد کے مسائل کو جوڑنا۔"},"ar":{"pjt_walk":"تابِع رحلتهم في PaJR","pjt_c1_kick":"82M · سكري · ضغط دم مرتفع 30 سنة · مرض كلى · تيلانغانا","pjt_c1_name":"رعاية وصلت إلى قريته","pjt_c1_story":"عمره 82 عامًا ويعيش في قرية نائية بولاية تيلانغانا — بعيدًا عن أي عيادة وغير قادر على شراء جهاز قياس السكر. من خلال مجموعته في PaJR تُدار حالته من السكري وارتفاع ضغط الدم المزمن ومرض الكلى من المنزل. وقد تعلّم قراءة سكره وضبط الأنسولين بأمان — ولم يحتج خلال أكثر من ثلاث سنوات إلى دخول المستشفى ولو مرة واحدة.","pjt_c1_quote":"إنه سعيد بالتحسن في صحته.","pjt_c1_cap":"تبعد قريته 10 كم عن أقرب مركز صحي أولي. أصبح PaJR شبكة الأمان الكبرى له.","pjt_c2_kick":"65M · متلازمة أيضية · ضغط دم مرتفع · البنغال الغربية","pjt_c2_name":"أوقف كل أدوية الضغط","pjt_c2_story":"ارتفع ضغط دمه بعد فقدانه زوجته في الجائحة. وعلى مدى ثلاث سنوات من المتابعة اليومية وتغييرات صغيرة صادقة في الأكل والمشي والراحة، انخفض تدريجيًا حتى لم يعد بحاجة إلى أي دواء. وظل مستقرًا منذ ذلك الحين.","pjt_c2_quote":"في الساعة 5:30 خرجت من المنزل ومشيت إلى الجسر، وقمت ببعض التمارين الحرة، ثم مشيت إلى محل الشاي — نصف لتر ماء وكوب شاي بالحليب دون سكر.","pjt_c2_cap":"قراءات ضغط دمه ونبضه — انقر للتكبير.","pjt_c3_kick":"43F · قلق 20 سنة · جلد وأيض · البنغال الغربية","pjt_c3_name":"تكتب طريقها نحو أيام أهدأ","pjt_c3_story":"معلّمة مدرسة عاشت مع القلق عشرين عامًا. في مجموعتها على PaJR تكتب أيامها بكلماتها — بما في ذلك اليوم الذي نقلت فيه بهدوء طالبة فقدت وعيها إلى المركز الصحي وبقيت معها حتى وصلت المساعدة. تحويل الحياة إلى كلمات يمنحها الثبات، وحمية قليلة الملح تخفض ضغط دمها.","pjt_c3_quote":"معك أشعر حقًا بأمان أكبر وصحة أفضل.","pjt_c3_cap":"ربط القلق ومشكلات الجلد عبر فهم محورها النفسي-العصبي-الغدي من خلال PaJR."}};

  if(MEDIA_EXT.vid.test(clean))return 'vid';

  if(/\/\/(?:[a-z0-9-]+\.)?(?:blogger\.googleusercontent\.com|bp\.blogspot\.com|lh[3-6]\.googleusercontent\.com)\//i.test(clean))return 'img';

}

  /* ── Voice input (Web Speech API) ─────────────────────────────────────── */
  function langToBCP47(c){
    var m={en:'en-IN',hi:'hi-IN',te:'te-IN',ta:'ta-IN',mr:'mr-IN',bn:'bn-IN',kn:'kn-IN',gu:'gu-IN',ml:'ml-IN',pa:'pa-IN',ur:'ur-PK',ar:'ar-SA'};
    return m[c]||'en-IN';
  }
  function showVoiceError(msg){
    setHeroPlaceholder(msg);
    setTimeout(function(){ setHeroPlaceholder(t('hero_placeholder')); }, 4500);
  }
  function startVoice(mode){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      showVoiceError("Voice input needs Chrome or Edge. Please type your question instead.",mode);
      return;
    }
    /* HTTPS check — Web Speech needs a secure context (except localhost) */
    if(window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1'){
      showVoiceError("Voice needs a secure (HTTPS) connection. Please open this page on https://",mode);
      return;
    }
    var isChat=mode==='chat';
    var currentVoiceActive=isChat?chatVoiceActive:voiceActive;
    if(currentVoiceActive){
      if(recogRef.current){ try{ recogRef.current.stop(); }catch(e){} }
      return;
    }
    var rec;
    try { rec = new SR(); } catch(e){ showVoiceError("Voice input failed to start.",mode); return; }
    rec.lang = langToBCP47(lang);
    rec.interimResults = true;
    /* continuous=false: capture one utterance and stop. Continuous mode on Android
       Chrome re-delivers finalized results, which produced the "where where where"
       word duplication. Single-utterance mode avoids that accumulation entirely. */
    rec.continuous = false;
    rec.maxAlternatives = 1;

    /* Text already in the box before we start listening — voice appends after it */
    var baseText = (isChat ? input : heroInput) || '';
    if(baseText && !baseText.endsWith(' ')) baseText += ' ';

    rec.onstart = function(){ if(isChat) setChatVoiceActive(true); else setVoiceActive(true); };
    rec.onresult = function(ev){
      /* Rebuild the whole transcript from scratch on every event. Some browsers
         (notably Android Chrome) re-deliver already-finalised results with a
         resultIndex of 0, so the previous "finalText += newFinal" approach kept
         re-appending the same words ("where where where are are…"). Reassembling
         from index 0 each time is idempotent and immune to that quirk. */
      var assembled = '';
      for (var i=0; i<ev.results.length; i++){
        assembled += ev.results[i][0].transcript;
        if (ev.results[i].isFinal) assembled += ' ';
      }
      var full = (baseText + assembled).replace(/\s{2,}/g,' ').replace(/^\s+/,'');
      if(isChat) setInput(full); else setHeroInput(full);
    };
    rec.onend = function(){
      if(isChat) setChatVoiceActive(false); else setVoiceActive(false);
      recogRef.current = null;
    };
    rec.onerror = function(e){
      if(isChat) setChatVoiceActive(false); else setVoiceActive(false);
      recogRef.current = null;
      var msg = 'Voice input error.';
      if      (e.error === 'not-allowed' || e.error === 'service-not-allowed') msg = 'Please allow microphone access in your browser settings.';
      else if (e.error === 'no-speech')        msg = "Didn't catch that — please try again.";
      else if (e.error === 'audio-capture')    msg = 'No microphone found on this device.';
      else if (e.error === 'network')          msg = 'Voice needs an internet connection.';
      else if (e.error === 'language-not-supported') msg = 'Voice not supported for this language. Switch to English and try again.';
      showVoiceError(msg,mode);
    };
    recogRef.current = rec;
    try { rec.start(); } catch(e){ showVoiceError("Voice already started — please wait.",mode); }
  }

  /* ── TTS: read bot message aloud ──────────────────────────────────── */
  /* TTS audio element ref for server-side Google Cloud TTS */
  var ttsAudioRef = useRef(null);

  function toggleTTS(idx, text){
    /* If currently playing this message, stop */
    if(ttsId===idx){
      if(ttsAudioRef.current){ ttsAudioRef.current.pause(); ttsAudioRef.current=null; }
      if(window.speechSynthesis) window.speechSynthesis.cancel();
      setTtsId(null);
      return;
    }
    /* Stop any previous playback */
    if(ttsAudioRef.current){ ttsAudioRef.current.pause(); ttsAudioRef.current=null; }
    if(window.speechSynthesis) window.speechSynthesis.cancel();

    /* Strip markdown/HTML for cleaner speech */
    var clean = text.replace(/<[^>]+>/g,' ').replace(/[#*_~`>\[\]()]/g,'').replace(/\n+/g,'. ').replace(/\s+/g,' ').trim();
    if(!clean) return;
    if(clean.length > 4000) clean = clean.slice(0, 4000);

    var bcp = langToBCP47(lang);
    setTtsId(idx);

    /* Server-side Google Cloud TTS (supports all 12 languages natively) */
    fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: clean, lang: bcp })
    })
    .then(function(r){
      if(!r.ok) throw new Error('TTS server error');
      return r.blob();
    })
    .then(function(blob){
      var url = URL.createObjectURL(blob);
      var audio = new Audio(url);
      ttsAudioRef.current = audio;
      audio.onended = function(){ setTtsId(null); ttsAudioRef.current=null; URL.revokeObjectURL(url); };
      audio.onerror = function(){ setTtsId(null); ttsAudioRef.current=null; URL.revokeObjectURL(url); fallbackBrowserTTS(clean, bcp, idx); };
      audio.play().catch(function(){ fallbackBrowserTTS(clean, bcp, idx); });
    })
    .catch(function(){
      fallbackBrowserTTS(clean, bcp, idx);
    });
  }

  function fallbackBrowserTTS(clean, bcp, idx){
    if(!window.speechSynthesis){ setTtsId(null); return; }
    var utter = new SpeechSynthesisUtterance(clean);
    utter.lang = bcp;
    try {
      var voices = window.speechSynthesis.getVoices();
      var best = null;
      for(var i=0;i<voices.length;i++){
        if(voices[i].lang===bcp){ best=voices[i]; break; }
        if(!best && voices[i].lang.replace(/_/g,'-').toLowerCase().indexOf(bcp.split('-')[0])===0) best=voices[i];
      }
      if(best) utter.voice = best;
    } catch(_){}
    utter.rate = 0.92;
    utter.onend = function(){ setTtsId(null); };
    utter.onerror = function(){ setTtsId(null); };
    setTtsId(idx);
    window.speechSynthesis.speak(utter);
  }
