      return h("span",{className:"lcap"+(x[1]?"":" off")+(click?" golink":""),key:i,
        style:x[1] ? {background:x[2]} : null,
        onClick:click, role:click?"button":undefined, title:click?("Open "+x[0]):undefined},
        h("i",{style:{background:x[3]}}), x[0]);

var IDX = {rows:null, promise:null};
function normTxt(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim(); }
async function ensureIndex(){
  if(IDX.rows) return IDX.rows;
  if(IDX.promise) return IDX.promise;
  IDX.promise = (async function(){
    var rows = [];
    function push(x){ if(x && x.title){ x.norm=normTxt(x.title+" "+(x.idtext||"")); x.catsNorm=normTxt(x.cats||""); rows.push(x); } }
    var rr = await Promise.all([
      SB.rpc("research_cases").then(function(r){return r.data||[];}).catch(function(){return [];}),
      fetchPajrCases().catch(function(){return {rows:[]};}),
      fetchPortfolioCases().catch(function(){return {rows:[]};}),
      SB.from("projrs").select("id,slug,title,theme,synthesis").limit(400).then(function(r){return r.data||[];}).catch(function(){return [];}),
      SB.from("layer2_reports").select("case_id,keywords,themes").eq("is_published",true).limit(4000).then(function(r){return r.data||[];}).catch(function(){return [];})
    ]);
    var kwByCase = {};
    (rr[4]||[]).forEach(function(x){
      kwByCase[x.case_id] = (x.keywords||[]).concat(x.themes||[]).join(" ");
    });
    (rr[0]||[]).forEach(function(c){
      push({modality:"case", pajr_id:c.pajr_id, idtext:c.pajr_id, title:c.title||c.pajr_id,
        cats:(kwByCase[c.id]||"")+" "+[c.age_band,c.sex,c.region].filter(Boolean).join(" "),
        created_at:c.created_at, updated_at:c.updated_at,
        snippet:[c.age_band,c.sex,c.region].filter(Boolean).join(" · ")||null});
    });
    (rr[1].rows||[]).forEach(function(r){
      push({modality:"pajr", link:r.link, title:r.title||r.link, cats:r.categories,
        snippet:splitCats(r.categories).join(" · ")||null});
    });
    (rr[2].rows||[]).forEach(function(r){
      push({modality:"portfolio", link:r.link, title:r.title||r.link, cats:r.categories,
        snippet:splitCats(r.categories).join(" · ")||null});
    });
    (rr[3]||[]).forEach(function(p){
      push({modality:"projr", slug:p.slug, id:p.id, title:p.title, cats:p.theme||"",
        snippet:(p.synthesis||"").slice(0,180)||null});
    });
    IDX.rows = rows;
    return rows;
  })();
  return IDX.promise;
}
/* bigram similarity — the typo net (diabtes ≈ diabetes) */
function bigramSim(a,b){
  if(a===b) return 1;
  if(Math.abs(a.length-b.length)>4 || a.length<3 || b.length<3) return 0;
  var A={}, i, g, n=0, hit=0;
  for(i=0;i<a.length-1;i++){ g=a.substr(i,2); A[g]=(A[g]||0)+1; }
  for(i=0;i<b.length-1;i++){ g=b.substr(i,2); n++; if(A[g]){ hit++; A[g]--; } }
  return n ? (2*hit)/(n+(a.length-1)) : 0;
}
function scoreRow(row, toks){
  var total=0, matched=0, i, t, best, w, words;
  for(i=0;i<toks.length;i++){
    t=toks[i]; best=0;
    if(row.norm===t) best=150;
    else if((" "+row.norm+" ").indexOf(" "+t+" ")>=0) best=95;           /* whole word */
    else {
      words=row.norm.split(" ");
      for(w=0;w<words.length;w++){
        if(words[w].indexOf(t)===0){ best=Math.max(best,72); }           /* prefix */
        else if(t.length>=5 && words[w].indexOf(t)>=0){ best=Math.max(best,50); } /* substring */
        else if(t.length>=4 && bigramSim(t,words[w])>=0.6){ best=Math.max(best,36); } /* fuzzy */
      }
    }
    if(!best && row.catsNorm && (" "+row.catsNorm+" ").indexOf(" "+t)>=0) best=58;   /* category */
    if(best){ matched++; total+=best; }
  }
  if(!matched) return 0;
  return total * (matched===toks.length ? 2 : 0.6) * (matched/toks.length);
}
function localSearch(q, limit){
  if(!IDX.rows) return [];
  var toks = normTxt(q).split(" ").filter(function(t){return t.length>=2;});
  if(!toks.length) return [];
  var out=[], i, s, r;
  for(i=0;i<IDX.rows.length;i++){
    r=IDX.rows[i]; s=scoreRow(r,toks);
    if(s>0) out.push({r:r, s:s});
  }
  out.sort(function(a,b){ return b.s-a.s; });
  return out.slice(0, limit||30).map(function(x){
    return {id:x.r.id||x.r.link||x.r.pajr_id||x.r.slug, modality:x.r.modality,
      pajr_id:x.r.pajr_id||null, link:x.r.link||null, slug:x.r.slug||null,
      title:x.r.title, snippet:x.r.snippet, score:x.s, leg:"instant"};
  });
}
/* DEEP leg — migration 014/021: cases, published reports, ProJRs, the
   community + hospital corpus, the redacted EXTERNAL daily stream, and the
   50k+ media library (PII-flagged rows excluded server-side; thumbnails via
   file_path). mediaFirst rides the 021 media-first mode: media gets a
   protected quota and a +1000 rank so it always leads. If 021 isn't applied
   yet, the extra argument would 404 the RPC — retry without it so search
   never breaks during rollout. */
async function deepSearch(qtext, n, mediaFirst){
  try{
    var args = {q:qtext, match_count:n||40};
    if(mediaFirst) args.media_first = true;
    var r = await SB.rpc("research_search", args);
    if(r.error && mediaFirst){
      r = await SB.rpc("research_search",{q:qtext, match_count:n||40});
    }
    if(r.error || !r.data) return null;
    var MODMAP = {"case":"case", layer2:"layer2", projr:"projr", community:"pajr",
                  hospital:"portfolio", external:"external", media:"media"};
    return r.data.map(function(x){
      var mod = MODMAP[x.source]||"result";
      var storage = null;
      if(mod==="media"){
        storage = x.file_path ? (STORAGE_BASE + x.file_path) : vaultUrl(x.link||null);
      }
      return {id:x.id, modality:mod, pajr_id:x.pajr_id||null,
        link:x.link||null, slug:x.slug||null, title:x.title||x.link||"Record",
        snippet:x.snippet||null, marked:!!(x.snippet && x.snippet.indexOf("[[")>=0),
        cats:x.categories||null, hits:x.hits?Number(x.hits):null,
        storage_url:storage,
        score:x.rank||0, matched:x.matched, leg:"deep"};
    });
  }catch(e){ return null; }
}
/* MEDIA leg — fires ONLY on media intent. research_search_media (migration
   021) is a media-only engine with its own exact→prefix→fuzzy ladder, so the
   thumbnails land fast and independently of the big cross-source pass. Quietly
   absent (null) until the migration is applied. */
async function mediaLibSearch(qtext, n){
  try{
    var r = await SB.rpc("research_search_media",{q:qtext, match_count:n||24});
    if(r.error || !r.data) return null;

        cats:x.categories||null, hits:x.hits?Number(x.hits):null,
        storage_url: x.file_path ? (STORAGE_BASE + x.file_path) : vaultUrl(x.link||null),
        score:(x.rank||0)+1000, matched:x.matched, leg:"media"};

}
/* SEMANTIC leg — the backend n8n engine, hard 12s timeout */
async function semanticSearch(qtext){
  if(!API_BASE) return null;
  try{
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    if(ctrl) setTimeout(function(){ try{ctrl.abort();}catch(e){} }, 12000);
    var resp = await fetch(API_BASE+"/api/search",{method:"POST",
      headers:{"Content-Type":"application/json"},
      signal:ctrl?ctrl.signal:undefined,
      body:JSON.stringify({query:qtext, match_count:20})});
    if(!resp.ok) return null;
    var arr = await resp.json();
    if(!Array.isArray(arr)) return null;
    return arr.map(function(x,i){
      var src = String(x.source||"").toLowerCase();
      var mod = src==="pajr" ? "pajr" : src==="portfolios" ? "portfolio"
              : src==="pubmed" ? "pubmed" : src==="memories" ? "patient" : "result";
      var link = x.link || x.pajr_link || x.pajrhealth_link || x.url || null;
      return {id:x.id||link||("s"+i), modality:mod,
        title:x.case_title||x.title||x.pajr_id||"Result",

        pajrhealth_link:x.pajrhealth_link||null, pajr_link:x.pajr_link||null,
        pajr_id:x.pajr_id||null, score:x.score||x.similarity||0, leg:"semantic"};

/* GATED leg — pajr_search (006) is SECURITY INVOKER: it returns Layer 1 and
   media rows only when the signed-in user's RLS allows them. */
async function gatedSearch(qtext){

/* the one true in-house test — mirrors media_is_inhouse() in migration 021.
   In-house = a PaJR journey's own media (WhatsApp care groups + web Pro
   uploads, bucket pajrmedia/). The portfolio_images harvest lives in
   case-images/. NEVER test pajr_id for this: media_monster_backfill writes
   the portfolio case id into media.pajr_id too, which is why every earlier
   pajr_id-based preference silently failed. */
function isInhouseMedia(r){
  var p = String(r.file_path || r.storage_url || r.link || "");
  if(p.indexOf("pajrmedia/") >= 0) return true;
  if(p.indexOf("case-images/") >= 0) return false;
  return !!r.pajr_id;   /* no path signal at all — legacy fallback */
}
function mergeResults(groups){
  var seen={}, out=[];
  groups.forEach(function(rows){
    (rows||[]).forEach(function(r){
      /* media rows key on their own identity — NEVER on pajr_id. Keyed by
         pajr_id they were silently swallowed whenever the parent case also
         matched, which is exactly the query where the student wanted the
         image ("images of <case topic>"). */
      var k = r.modality==="media"
        ? "media:"+(r.id||r.storage_url||r.link)
        : (r.pajr_id || r.link || r.slug || (r.modality+":"+r.id));
      var ex = seen[k];
      if(ex){
        if(r.leg==="deep" && ex.leg!=="deep"){
          ex.snippet=r.snippet||ex.snippet; ex.marked=r.marked; ex.hits=r.hits||ex.hits;
          ex.matched=r.matched; ex.cats=r.cats||ex.cats; ex.leg="deep";
        }
        ex.legs[r.leg]=1;
        return;
      }
      r.legs={}; r.legs[r.leg]=1;
      seen[k]=r; out.push(r);
    });
  });
  /* media preference: our own journey media comes first — portfolio media is
     shown ONLY when the library has no matching image of its own. Uses the
     bucket/source discriminator (isInhouseMedia), NOT pajr_id: portfolio rows
     carry a pseudo case id there, so the old test classified everything as
     in-house and this rule never actually fired. */
  var inhouse = out.some(function(r){ return r.modality==="media" && isInhouseMedia(r); });
  if(inhouse) out = out.filter(function(r){ return r.modality!=="media" || isInhouseMedia(r); });
  return out;
}
/* orchestrator — calls onUpdate as each leg lands; resolves when all done */
/* ── search analytics — every submitted search is logged, anonymous and
   signed-in alike (fire-and-forget; never blocks or breaks the search).
   A repeat of the same query within 30s (e.g. Back restoring results) is
   not double-counted. Failures warn ONCE in the console so a missing
   migration or RLS problem is visible instead of silent. ── */
var LOG_LAST = {q:null, t:0, warned:false};
function logSearch(q){
  try{
    if(!SB) return;
    var qn = String(q).slice(0,300);
    var now = Date.now();
    if(LOG_LAST.q===qn && now-LOG_LAST.t<30000) return;
    LOG_LAST.q = qn; LOG_LAST.t = now;
    SB.auth.getSession().then(function(r){
      var u = r && r.data && r.data.session && r.data.session.user;
      SB.from("search_logs").insert({
        q:qn, user_id:u?u.id:null, anon:!u, source:"research-db"
      }).then(function(res){
        if(res && res.error && !LOG_LAST.warned){

/* ═══════════ runtime translation — one English page, every language ═══════════
   No baked translations, no bloat: when a language is picked, the visible
   TEXT of the page is translated on demand through the backend
   (POST /api/translate → Google Cloud Translation), cached per string in
   Supabase server-side AND in localStorage client-side, so each string is
   ever translated once. New content (search results, opened cases) is picked
   up automatically by a mutation observer. English = the untouched original. */
var LANGS = [["en","English"],["hi","हिन्दी"],["te","తెలుగు"],["ta","தமிழ்"],["mr","मराठी"],
             ["bn","বাংলা"],["kn","ಕನ್ನಡ"],["gu","ગુજરાતી"],["ml","മലയാളം"],["pa","ਪੰਜਾਬੀ"],
             ["ur","اردو"],["ar","العربية"]];
function getLang(){ try{ return localStorage.getItem("pajr_lang")||"en"; }catch(e){ return "en"; } }
var TX = {cache:{}, lang:null, obs:null, timer:null, busy:false};
function txLoad(l){
  if(TX.cache[l]) return TX.cache[l];
  try{ TX.cache[l] = JSON.parse(localStorage.getItem("pajr_tx_"+l)||"{}"); }
  catch(e){ TX.cache[l] = {}; }
  return TX.cache[l];
}
function txSave(l){
  try{
    var c = TX.cache[l]||{};
    if(Object.keys(c).length > 6000){ c = {}; TX.cache[l] = c; }   /* crude cap */
    localStorage.setItem("pajr_tx_"+l, JSON.stringify(c));
  }catch(e){}
}
function txNodes(){
  var out = [];
  var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
  var skip = /^(SCRIPT|STYLE|INPUT|TEXTAREA|SELECT|OPTION|CODE|PRE)$/;
  var n;
  while((n = walker.nextNode())){
    var v = n.nodeValue;
    if(!v || !/[A-Za-z]{2}/.test(v)) continue;            /* latin text only → idempotent */
    var el = n.parentElement;
    if(!el || skip.test(el.tagName)) continue;
    if(el.closest && el.closest(".mono,.idcap,.captag,.finder-num,.lang-sel,[data-notx]")) continue;
    out.push(n);
  }
  return out;
}
/* a small self-managed toast so translation NEVER fails silently */
function txToast(msg, ms){
  try{
    var el = document.getElementById("tx-toast");
    if(!el){
      el = document.createElement("div");
      el.id = "tx-toast"; el.className = "toast";
      el.setAttribute("data-notx","1");
      document.body.appendChild(el);
    }
    el.textContent = msg; el.style.display = "block";
    if(TX.toastT) clearTimeout(TX.toastT);
    if(ms) TX.toastT = setTimeout(function(){ el.style.display = "none"; }, ms);
  }catch(e){}
}
function txFriendly(e){
  var m = String((e && e.message) || e || "");
  if(/http 404/.test(m))          return "the server doesn't have /api/translate yet — copy the new server.js and restart it";
  if(/http 502|backend/.test(m))  return "the translation backend failed — is the Cloud Translation API enabled on the GCP project?";
  if(/http 4\d\d/.test(m))        return "the API rejected the request ("+m.slice(0,80)+")";
  if(/Failed to fetch|NetworkError|network/i.test(m)) return "cannot reach the API server";
  return m.slice(0,120) || "unknown error";
}
async function txBatch(texts, l){
  var resp = await fetch(API_BASE + "/api/translate", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({texts:texts, target:l})});
  if(!resp.ok){
    var body = ""; try{ body = (await resp.text()).slice(0,150); }catch(e){}
    throw new Error("http "+resp.status+" "+body);
  }
  var doc = await resp.json();
  return doc.translations || [];
}
async function txRun(l){
  if(!API_BASE){ txToast("⚠ Translation needs API_BASE in config.js", 6000); return; }
  if(TX.busy) return; TX.busy = true;
  var langName = (LANGS.filter(function(x){return x[0]===l;})[0]||[l,l])[1];
  try{
    var cache = txLoad(l);
    var nodes = txNodes();
    var missing = [], seen = {};
    nodes.forEach(function(n){
      var t = n.nodeValue.trim();
      if(t.length < 2 || cache[t] !== undefined || seen[t]) return;
      seen[t] = 1; missing.push(t);
    });
    if(missing.length) txToast("Translating to "+langName+"… ("+missing.length+" strings)");
    var failed = null;
    for(var i=0; i<missing.length && i<1200; i+=90){
      var chunk = missing.slice(i, i+90);
      try{
        var tr = await txBatch(chunk, l);
        chunk.forEach(function(t,ix){ if(tr[ix]) cache[t] = tr[ix]; });
        if(missing.length > 120) txToast("Translating to "+langName+"… ("+Math.min(i+90,missing.length)+"/"+missing.length+")");
      }catch(e){
        failed = e;
        try{ console.error("[translate]", e); }catch(_){}
        break;
      }
    }
    txSave(l);
    var applied = 0;
    txNodes().forEach(function(n){
      var t = n.nodeValue.trim();
      if(cache[t] && cache[t] !== t){
        n.nodeValue = n.nodeValue.replace(t, cache[t]);
        applied++;
      }
    });
    if(failed) txToast("⚠ Translation failed: "+txFriendly(failed), 9000);
    else if(missing.length || applied) txToast("✓ "+langName+" — "+applied+" item(s) translated", 2500);
  } finally { TX.busy = false; }
}
function startTranslate(l){
  TX.lang = l;
  try{
    document.documentElement.lang = l;
    document.documentElement.dir = (l==="ur"||l==="ar") ? "rtl" : "ltr";
  }catch(e){}
  txRun(l);
  if(!TX.obs){
    TX.obs = new MutationObserver(function(){
      if(!TX.lang || TX.lang==="en") return;
      if(TX.timer) clearTimeout(TX.timer);
      TX.timer = setTimeout(function(){ txRun(TX.lang); }, 600);
    });
    try{ TX.obs.observe(document.body, {childList:true, subtree:true, characterData:false}); }catch(e){}
  }
}
function setLang(l){
  try{ localStorage.setItem("pajr_lang", l); }catch(e){}
  if(l === "en"){ location.reload(); return; }   /* originals restore on reload */
  startTranslate(l);
}
try{
  window.addEventListener("load", function(){
    var l = getLang();
    if(l !== "en") setTimeout(function(){ startTranslate(l); }, 700);
  });
}catch(e){}

/* ═══════════ media intent — "images of…", "wound photos", "show the ecg" ═══
   When a query ASKS for media, understand it: search the engines with the
   clean core term (carrier words like "images of" only pollute FTS), land
   the user on the Media view, and make it reversible — one tap shows all,
   and if no media matched we fall back to everything automatically. */
var MI_DETECT = /\b(images?|imgs?|photos?|photographs?|pictures?|pics?|media|videos?|audio|voice ?notes?|scans?|x-?rays?|ecg|ekg|mri|ct ?scan|ultrasound|usg|fundus|radiographs?)\b/i;
var MI_CARRIERS = /\b(images?|imgs?|photos?|photographs?|pictures?|pics?|media|videos?|audio|voice ?notes?|scans?|show ?(me)?|see)\b/gi;
function mediaIntent(q){
  var s = String(q||"").trim();
  if(!MI_DETECT.test(s)) return {media:false, core:s};
  var core = s.replace(MI_CARRIERS," ")
              .replace(/\b(of|the|for|from|a|an|any|all|me|please|his|her|their)\b/gi," ")
              .replace(/\s+/g," ").trim();
  return {media:true, core: core || s};
}

async function runSearch(qtext, onUpdate, opts){
  opts = opts || {};
  logSearch(opts.raw || qtext);   /* analytics keep the user's real words */
  var mediaMode = !!opts.media;
  var state = {q:qtext, rows:[], instant:[], deep:null, semantic:null, gated:null,
    mediaLib:null, mediaFirst:mediaMode,
    deepStatus:"wait", semStatus:API_BASE?"wait":"off",
    mediaStatus:mediaMode?"wait":null, done:false, mode:"live"};
  function emit(){
    state.rows = mergeResults([state.mediaLib||[], state.deep||[],
                               state.instant, state.gated||[], state.semantic||[]]);
    /* media intent = media leads, always — a stable partition keeps each
       block's own ranking intact */
    if(mediaMode && state.rows.length){
      var md=[], rest=[];
      state.rows.forEach(function(r){ (r.modality==="media"?md:rest).push(r); });
      state.rows = md.concat(rest);
    }
    if(onUpdate) onUpdate(Object.assign({}, state));
  }
  try{ await ensureIndex(); }catch(e){}
  state.instant = localSearch(qtext, 30);
  emit();
  var jobs = [
    deepSearch(qtext, 40, mediaMode).then(function(rows){ state.deep=rows; state.deepStatus=(rows===null?"off":"ok"); emit(); }),
    semanticSearch(qtext).then(function(rows){ state.semantic=rows; state.semStatus=(rows===null?(API_BASE?"off":"off"):"ok"); emit(); }),
    gatedSearch(qtext).then(function(rows){ state.gated=rows; emit(); })
  ];
  if(mediaMode) jobs.push(
    mediaLibSearch(qtext, 24).then(function(rows){ state.mediaLib=rows; state.mediaStatus=(rows===null?"off":"ok"); emit(); }));
  await Promise.all(jobs.map(function(p){ return p.catch(function(){}); }));
  state.done = true; emit();
  return state;
}
/* render a [[marked]] snippet safely — split, never inject */
function headlineNodes(s){
  if(!s) return null;
  var parts = String(s).split(/\[\[|\]\]/g);
  return parts.map(function(p,i){ return i%2===1 ? h("mark",{key:i,className:"hlx"},p) : p; });
}

function SearchTray(){

/* ── deterministic daily shuffle for the home shelf ──
   The library RPC returns cases in a FIXED order, so slicing the first four
   always surfaced the same four cases. A small PRNG seeded by today's date
   reshuffles the candidate list instead: every visitor sees the SAME picks on

/* ── shared media-count capsule ──────────────────────────────────────────────
   A small amber capsule showing how many media items a case carries. It reads a
   shared count cache that the home picks and cohort cards already populate when
   they fetch a representative image, so no extra request is made there; search
   rows (which don't otherwise touch media) fetch lazily, once per id, cached.
   Hidden entirely when a case has no media. Clicking opens the case's media. */
var MEDIA_COUNT_CACHE = {};   /* pajr_id → media row count */
function MediaCap(props){
  var pid = props.pajrId;
  var st = useState(MEDIA_COUNT_CACHE[pid]); var n = st[0], setN = st[1];
  useEffect(function(){
    var alive = true;
    if(!pid) return;

    fetchMedia(pid).then(function(r){
      var c = ((r && r.rows) || []).length;
      MEDIA_COUNT_CACHE[pid] = c; if(alive) setN(c);

    return function(){ alive = false; };

  if(!n) return null;   /* unknown or zero → render nothing (keeps cards clean) */
  return h("span",{className:"lcap media-cap golink",role:"button",title:"Open the media gallery",
    onClick:function(e){ e.stopPropagation(); window.__pajrTab="media"; nav("case",pid); }},
    I.img(12,"var(--amber)"), "Media ", h("b",null,String(n)));
}

/* ═══════════ one reference row — EVERY reference is clickable ═══════════
   Two link tiers, neither of which can ever open the WRONG specific article:
     • DIRECT (confirmed) — a hand-curated url/doi, or a PMID that
       verify_citations.py confirmed against PubMed (verified_at set). Opens the
       exact record; shows the PMID chip.
     • SEARCH (unconfirmed) — for everything else, the title links to a PubMed
       title-search, falling back to a Google Scholar search. A search can't
       point at a wrong paper: it lists candidates for that exact title. No
       PMID chip is shown, and a small ⌕ marks it as a lookup rather than a
       confirmed record. Re-running verify_citations.py promotes these to
       DIRECT as they get confirmed. */
function CiteItem(ct, idx){
  var url = ct.url && !/[?&]term=/.test(ct.url) ? ct.url : null;   /* curated direct link */
  var doi = ct.doi ? String(ct.doi).trim().replace(/^(https?:\/\/(dx\.)?doi\.org\/|doi:\s*)/i,"") : null;
  var pmid = ct.verified_at && ct.pmid ? ct.pmid : null;           /* PubMed-confirmed only */
  var direct = url
    || (doi ? "https://doi.org/"+doi : null)
    || (pmid ? "https://pubmed.ncbi.nlm.nih.gov/"+pmid+"/" : null);
  /* unconfirmed → a title SEARCH so the reference is still linked but never
     resolves to a specific wrong record */
  var q = (ct.title||"").trim();
  var search = q
    ? (ct.pmid                                     /* looks biomedical → PubMed first */
        ? "https://pubmed.ncbi.nlm.nih.gov/?term="+encodeURIComponent('"'+q+'"'+"[Title]")
        : "https://scholar.google.com/scholar?q="+encodeURIComponent('"'+q+'"'))
    : null;
  var href = direct || search;
  return h("div",{className:"cite-item",key:ct.id},
    h("span",{className:"cn"},(idx!=null?idx+1:1)+"."),
    h("span",{style:{minWidth:0}},
      href ? h("a",{href:href,target:"_blank",rel:"noopener noreferrer",
                    title: direct ? "Open article" : "Search for this reference"},
                 ct.title||href)
           : (ct.title||"reference"),
      pmid && h("span",{className:"cpmid mono"}," · PMID "+pmid),
      (!direct && href) && h("span",{className:"cpmid mono",style:{opacity:.55},
                                      title:"Unconfirmed — links to a title search"}," ⌕")));
}

/* ═══════ quoted messages — quote the WHOLE original, and make it a link ═══════
   Backend shape: "[HH:MM AM] Human (Name): body… [id:MSGID]". A reply that
   quotes another message starts with "> " + a VERBATIM copy of the original's
   text (possibly many paragraphs) — with NO end marker and NO quote id.
   So: (1) index every message's own text (its body minus its own leading
   quote), (2) for each "> " body find the earlier message it reproduces
   (whitespace-collapsed prefix walk, tolerant of truncated quotes), then
   (3) fold the quote into the parser's native "> [quote_id:<id>] …" syntax so
   the ENTIRE quote renders as one clickable block that jumps to the original. */
var PQ_HUMAN_RE = /^\[\d{1,2}:\d{2}\s?[APap]\.?[Mm]\.?\]\s*[^:\n]*?(?:Human|Patient|Advocate)[^:\n]*?:\s*/;
var PQ_AI_RE    = /^(?:💡\s*)?\[?PaJR Health AI[^\]:\n]*\]?:\s*/;
function pqNorm(s){ return String(s||"").replace(/\s+/g," ").trim(); }
function pqExtract(text){
  var lines = String(text||"").replace(/\\n/g,"\n").split("\n");
  var msgs = [], cur = null, pre = [];
  lines.forEach(function(ln){
    var hm = ln.match(PQ_HUMAN_RE) || ln.match(PQ_AI_RE);
    if(hm){
      if(cur) msgs.push(cur);
      cur = {head: hm[0], lines: [ln.slice(hm[0].length)]};
    } else if(cur){ cur.lines.push(ln); }
    else pre.push(ln);
  });
  if(cur) msgs.push(cur);
  msgs.forEach(function(m){
    var body = m.lines.join("\n");
    var idm = body.match(/\[id:([^\]]+)\]\s*$/);
    m.id = idm ? idm[1] : null;
    if(idm) body = body.slice(0, idm.index).replace(/\s+$/,"");
    m.body = body;
  });
  return {pre: pre, msgs: msgs};
}
/* walk the quoting body until it reproduces `target`; returns the last quote
   line index, or null. Accepts a long prefix when WhatsApp truncated the quote. */
function pqQuoteExtent(bodyLines, target){
  var acc = "", lastGood = -1;
  for(var i=0; i<bodyLines.length; i++){
    var raw = i===0 ? String(bodyLines[0]).replace(/^>\s*/,"") : bodyLines[i];
    var ln = pqNorm(raw);
    var next = ln ? (acc ? acc+" "+ln : ln) : acc;
    if(next === target) return {end:i, full:true};
    if(target.indexOf(next) === 0){ acc = next; lastGood = i; continue; }
    break;
  }
  if(lastGood >= 0 && acc.length >= 30) return {end:lastGood, full:false};
  return null;
}
/* build {msgId → {qid, quote, reply}} across ALL rows of a case, in order */
function pajrQuoteResolutions(texts){
  var all = [], res = {};
  (texts||[]).forEach(function(t){ all = all.concat(pqExtract(t).msgs); });
  all.forEach(function(m, idx){
    var bodyLines = m.body.split("\n");
    m.reply = m.body;
    if(/^>\s?/.test(bodyLines[0]||"")){
      /* MARKED quote ("> …"): match tolerantly, fall back to the first blank line */
      var firstQ = pqNorm(bodyLines[0].replace(/^>\s*/,""));
      var best = null;
      if(firstQ){
        for(var j=idx-1; j>=0; j--){                 /* most recent original first */
          var cand = all[j];
          if(!cand.replyNorm || cand.replyNorm.indexOf(firstQ)!==0) continue;
          var ext = pqQuoteExtent(bodyLines, cand.replyNorm);
          if(ext){ best = {qid:cand.id, end:ext.end}; break; }
        }
      }
      if(!best){                                     /* unmatched: first blank line */
        var e0 = bodyLines.length-1;
        for(var b=1; b<bodyLines.length; b++){ if(!bodyLines[b].trim()){ e0=b-1; break; } }
        best = {qid:null, end:e0};
      }
      var qlines = bodyLines.slice(0, best.end+1);
      qlines[0] = String(qlines[0]).replace(/^>\s*/,"");
      while(qlines.length && !qlines[qlines.length-1].trim()) qlines.pop();
      m.qid = best.qid;
      m.quote = qlines.join("\n");
      m.reply = bodyLines.slice(best.end+1).join("\n").replace(/^\s+/,"");
    } else {
      /* UNMARKED quote: some bridge messages embed the quoted original with no
         ">" at all — the body simply STARTS with a verbatim copy of an earlier
         message, and the actual reply trails it. Detect semantically, and be
         STRICT (full reproduction of a substantial original only) so ordinary
         messages can never be misread as quotes. */
      var bNorm0 = pqNorm(bodyLines[0]||"");
      if(bNorm0.length >= 8){
        for(var j2=idx-1; j2>=0; j2--){
          var c2 = all[j2];
          if(!c2.replyNorm || c2.replyNorm.length < 40) continue;
          if(c2.replyNorm.indexOf(bNorm0)!==0) continue;
          if(pqNorm(m.body) === c2.replyNorm) break;   /* identical repost, not a quote */
          var ext2 = pqQuoteExtent(bodyLines, c2.replyNorm);
          if(ext2 && ext2.full){
            m.qid   = c2.id;
            m.quote = bodyLines.slice(0, ext2.end+1).join("\n");
            m.reply = bodyLines.slice(ext2.end+1).join("\n").replace(/^\s+/,"");
            break;
          }
        }
      }
    }
    m.replyNorm = pqNorm(m.reply);
    if(m.id) res[m.id] = m;
  });
  return res;
}
/* rewrite one day's text: each resolved quote becomes a single clickable block
   (runs whenever any message resolved a quote — marked with ">" or unmarked) */
function pajrFoldQuotes(text, res){
  var any = false, k;
  for(k in res){ if(res[k] && res[k].quote != null){ any = true; break; } }
  if(!any && String(text).indexOf(">") < 0) return text;
  var ex = pqExtract(text);
  if(!ex.msgs.length) return text;
  var out = ex.pre.join("\n").replace(/\s+$/,"");
  ex.msgs.forEach(function(m){
    var r = (m.id && res && res[m.id]) || null;
    var body = m.body;
    if(r && r.quote != null){
      body = "> " + (r.qid ? "[quote_id:"+r.qid+"] " : "")
           + r.quote.replace(/\n/g,"<br>")
           + (r.reply ? "\n\n"+r.reply : "");
    }
    out += (out ? "\n\n" : "") + m.head + body + (m.id ? " [id:"+m.id+"]" : "");
  });
  return out;
}

function pajrParseLog(text, pajrId, qres){
  if(!text) return "";

  var processedText = String(text).replace(/<REDACTED>/gi,"[REDACTED]").replace(/\\n/g,"\n");

     when called without a case-wide index, resolve within this text alone */
  try{
    processedText = pajrFoldQuotes(processedText, qres || pajrQuoteResolutions([processedText]));
  }catch(e){}

  processedText = processedText.replace(/\[id:([^\]]+)\]/g, '<span id="msg-$1" class="pajr-msg-id" style="display:none;"></span>');
  var lines = processedText.split("\n");
  var aiSenderRegex = /^(?:💡\s*)?(?:\[\d{2}:\d{2}\s?[APM]{2}\]\s*)?\[?(PaJR Health AI[^\]:]*)\]?:\s*(.*)/i;
  var humanSenderRegex = /^\s*(?:(\[\d{1,2}:\d{2}\s?[a-zA-Z]{0,2}\])\s*)?([^:]*Human[^:]*):\s*(.*)/i;
  var mediaRegex = /(https?:\/\/[^\s"'<>\)]+\.(?:ogg|mp3|wav|mp4|webm|mov|png|jpg|jpeg|gif|webp)(?:\?[^\s"'<>\)]+)?)/i;
  var inlineFormat = function(s){ return s
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([\s\S]+?)\*\*/g,"<strong>$1</strong>")
    .replace(/__([\s\S]+?)__/g,"<strong>$1</strong>")
    .replace(/(^|[^\*])\*(?!\s)([^*\n]+?)\*(?!\*)/g,"$1<em>$2</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>"); };
  var listActive=false, aiBlockActive=false, humanBlockActive=false;
  var quoteActive=false, quoteBuffer=[], quoteIdTarget=null;
  var MAX_QUOTE_LINES=8;
  var flushQuote = function(){
    if(!quoteActive) return; quoteActive=false;
    var collected=quoteBuffer, idTarget=quoteIdTarget; quoteBuffer=[]; quoteIdTarget=null;
    if(!collected.length) return;
    var attr="class='pajr-quoted-message'";
    if(idTarget) attr='class="pajr-quoted-message pajr-clickable-quote" data-quote-target="'+idTarget+'" title="Click to view original message"';
    var shown=collected, truncated=false;
    if(collected.length>MAX_QUOTE_LINES){ shown=collected.slice(0,MAX_QUOTE_LINES); truncated=true; }
    var inner=shown.join("<br>"); if(truncated) inner+='<br><span class="pajr-quote-more">…</span>';
    html+="<div "+attr+">"+inner+"</div>";
  };
  var closeOpenBlocks = function(){
    flushQuote();
    if(listActive){ html+="</ul>"; listActive=false; }
    if(aiBlockActive){ html+="</div></div></div>"; aiBlockActive=false; }
    if(humanBlockActive){ html+="</div></div></div>"; humanBlockActive=false; }
  };
  var parseQuote = function(t){
    if(!t.trim().startsWith(">")) return {quoteHtml:"", remainingText:t};
    var quoteText=t.trim().replace(/^>\s*/,"");
    var quoteIdAttr=" class='pajr-quoted-message' ";
    var m=quoteText.match(/^\[quote_id:([^\]]+)\]\s*/);
    if(m){ quoteIdAttr=' class="pajr-quoted-message pajr-clickable-quote" data-quote-target="'+m[1]+'" title="Click to view original message" ';
      quoteText=quoteText.replace(/^\[quote_id:[^\]]+\]\s*/,""); }
    return {quoteHtml:"<div"+quoteIdAttr+">"+quoteText+"</div>", remainingText:""};
  };
  lines.forEach(function(line){
    var cleanLine=line.trim();
    if(!cleanLine){ flushQuote(); return; }
    if(quoteActive){
      var endsQuote = cleanLine.startsWith(">") || mediaRegex.test(cleanLine) ||
        aiSenderRegex.test(cleanLine) || humanSenderRegex.test(cleanLine) ||
        cleanLine.match(/^\[\d{1,2}:\d{2}/) || cleanLine.startsWith("##") ||
        (cleanLine.startsWith("[") && cleanLine.includes("]"));
      if(endsQuote){ flushQuote(); }
      else { quoteBuffer.push(inlineFormat(cleanLine)); return; }
    }
    var mediaMatch=cleanLine.match(mediaRegex);
    if(mediaMatch){
      closeOpenBlocks();
      var url=mediaMatch[1], file=url.split("/").pop().split("?")[0], mediaTag="";
      if(url.match(/\.(mp4|webm|mov)/i)) mediaTag='<a href="'+url+'" target="_blank" class="pajr-media-link"><video controls src="'+url+'" onerror="window.handlePaJRMediaError(this)"></video></a>';
      else if(url.match(/\.(ogg|mp3|wav)/i)) mediaTag='<audio controls src="'+url+'" onerror="window.handlePaJRMediaError(this)"></audio>';
      else mediaTag='<a href="'+url+'" target="_blank" class="pajr-media-link"><img src="'+url+'" loading="lazy" onerror="window.handlePaJRMediaError(this)" /></a>';
      html+='<div class="pajr-media-wrapper">'+mediaTag+'<span class="pajr-media-caption">'+pajrId+" / "+file+"</span></div>";
      return;
    }
    var aiMatch=cleanLine.match(aiSenderRegex);
    if(aiMatch){
      closeOpenBlocks(); aiBlockActive=true;
      var aiName=aiMatch[1].trim(), aiContent=aiMatch[2].trim();
      var aq=parseQuote(aiContent);
      html+='<div class="pajr-ai-wrapper"><div class="pajr-ai-block"><span class="log-ai-badge">✨ '+aiName+'</span><div class="pajr-ai-content">'+aq.quoteHtml+(aq.remainingText?'<p style="margin:0;">'+inlineFormat(aq.remainingText)+"</p>":"");
      /* ALWAYS stop here. The old `if(!aiContent) return;` fell through when the
         sender line carried inline content (every image analysis does), letting
         the catch-all re-append the whole line — the analysis showed twice. */
      return;
    }
    else if(cleanLine.match(/^\[\d{1,2}:\d{2}/)){ closeOpenBlocks(); }
    cleanLine=cleanLine.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
    cleanLine=cleanLine.replace(/(?<!href="|">)(https?:\/\/[^\s<]+)/gi,'<a href="$1" target="_blank">$1</a>');
    cleanLine=cleanLine.replace(/\*\*([\s\S]+?)\*\*/g,"<strong>$1</strong>")
      .replace(/__([\s\S]+?)__/g,"<strong>$1</strong>")
      .replace(/(^|[^\*\w])\*(?!\s)([^*\n]+?)\*(?!\*)/g,"$1<em>$2</em>")
      .replace(/`([^`]+)`/g,"<code>$1</code>");
    if(cleanLine.startsWith(">")){
      flushQuote(); quoteActive=true; quoteBuffer=[]; quoteIdTarget=null;
      var qt=cleanLine.replace(/^>\s*/,"");
      var idm=qt.match(/^\[quote_id:([^\]]+)\]\s*/);
      if(idm){ quoteIdTarget=idm[1]; qt=qt.replace(/^\[quote_id:[^\]]+\]\s*/,""); }
      quoteBuffer.push(qt); return;
    }
    if(cleanLine.match(/^#{1,6}\s/)){ var hl=cleanLine.match(/^(#{1,6})/)[1].length;
      var ht=(hl<=2?2:3); html+='<h'+ht+' class="scribe-title">'+cleanLine.replace(/^#{1,6}\s*/,"")+"</h"+ht+">"; return; }
    if(cleanLine.startsWith("[") && cleanLine.includes("]") && !cleanLine.match(/^\[\d{1,2}:\d{2}/)){
      html+='<strong class="log-section-header">'+cleanLine+"</strong>"; return;
    }
    /* bullets (• - *) and numbered lists — inline markdown already applied above */
    if(cleanLine.match(/^\s*[•\-]\s+/) || cleanLine.match(/^\s*\*\s+/) || cleanLine.match(/^\s*\d+\.\s+/)){
      if(!listActive){ html+="<ul>"; listActive=true; }
      html+="<li>"+cleanLine.replace(/^\s*(?:[•\-\*]|\d+\.)\s+/,"")+"</li>"; return;
    } else if(listActive){ html+="</ul>"; listActive=false; }
    var humanMatch=cleanLine.match(humanSenderRegex);
    if(humanMatch){
      closeOpenBlocks(); humanBlockActive=true;
      var timestamp=humanMatch[1]?'<div class="human-timestamp">'+humanMatch[1]+"</div>":"";
      var sender=humanMatch[2]?'<span class="log-messenger-name">'+humanMatch[2].trim()+"</span>":"";
      var hq=parseQuote(humanMatch[3]);
      html+='<div class="pajr-human-wrapper"><div class="pajr-human-block"><div class="pajr-human-header">'+sender+"</div>"+timestamp+'<div class="pajr-human-content">'+hq.quoteHtml+(hq.remainingText?'<p style="margin:0;">'+hq.remainingText+"</p>":"");
      return;
    } else if(humanBlockActive){ html+='<p style="margin:8px 0 0 0;">'+cleanLine+"</p>"; return; }
    html+="<p>"+cleanLine+"</p>";
  });
  flushQuote(); closeOpenBlocks();
  return html;
}

/* within one day, a "message" starts at a sender line (Human / PaJR Health AI)
   or a bare [hh:mm] timestamp line; everything after it belongs to that message
   until the next boundary. Reversing the chunks flips a day to last-sent-first
   while keeping each message (with its quotes, media and continuations) intact.
   Any unheaded preamble before the first sender stays pinned at the top. */
function pajrReverseMsgs(text){
  var aiRe = /^(?:💡\s*)?(?:\[\d{2}:\d{2}\s?[APM]{2}\]\s*)?\[?PaJR Health AI[^\]:]*\]?:/i;
  var huRe = /^\s*(?:\[\d{1,2}:\d{2}\s?[a-zA-Z]{0,2}\]\s*)?[^:\n]*Human[^:\n]*:/i;
  var tsRe = /^\[\d{1,2}:\d{2}/;
  var lines = String(text||"").split("\n");
  var chunks=[], cur=[];
  lines.forEach(function(ln){
    var t = ln.trim();
    if(t && (aiRe.test(t) || huRe.test(t) || tsRe.test(t))){
      if(cur.length) chunks.push(cur);
      cur=[ln];
    } else cur.push(ln);
  });
  if(cur.length) chunks.push(cur);
  if(chunks.length<2) return text;
  var head = null, f = (chunks[0][0]||"").trim();
  if(!(aiRe.test(f) || huRe.test(f) || tsRe.test(f))) head = chunks.shift();
  chunks.reverse();
  if(head) chunks.unshift(head);
  return chunks.map(function(c){ return c.join("\n").replace(/^\n+|\n+$/g,""); }).join("\n\n");
}

/* group entries into year → month → day accordions.
   dayOrder  "desc" (default) = latest day at the top · "asc" = earliest first
   msgOrder  "first" (default) = messages in sent order · "last" = reversed */
function pajrBuildDays(rows, pajrId, dayOrder, msgOrder){
  dayOrder = dayOrder==="asc" ? "asc" : "desc";
  msgOrder = msgOrder==="last" ? "last" : "first";
  var monthOrder=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var groups={}, undated=[], latest=0, earliest=Infinity;
  /* case-wide quote index (rows arrive oldest-first), so a reply can quote a
     message from ANY earlier day and still link back to it */
  var qres = {};
  try{ qres = pajrQuoteResolutions((rows||[]).map(function(r){ return r.body; })); }catch(e){}
  function add(y,mo,d,content){
    if(!content || !content.trim()) return;
    var mn=monthOrder[mo-1], ts=new Date(y,mo-1,d).getTime();
    if(ts>latest) latest=ts;
    if(ts<earliest) earliest=ts;
    if(!groups[y]) groups[y]={}; if(!groups[y][mn]) groups[y][mn]=[];
    groups[y][mn].push({ts:ts, disp:d+" "+mn+" "+y, content:content});
  }
  (rows||[]).forEach(function(r){
    var body=String(r.body||""), matched=false;
    body.split(/(?=CONVERSATIONAL LOG \(\d{4}-\d{2}-\d{2}\))/i).forEach(function(seg){
      var dm=seg.match(/CONVERSATIONAL LOG \((\d{4})-(\d{2})-(\d{2})\)/i);
      if(dm){ matched=true; add(+dm[1],+dm[2],+dm[3], seg.replace(/CONVERSATIONAL LOG \(.*?\):?/i,"").trim()); }
    });
    if(!matched){
      var cd=r.clinical_date?String(r.clinical_date).slice(0,10):null;
      if(cd && /^\d{4}-\d{2}-\d{2}$/.test(cd)){ var p=cd.split("-"); add(+p[0],+p[1],+p[2], body); }
      else if(body.trim()) undated.push(body);
    }
  });
  var chevron='<svg class="pajr-chevron" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>';
  var asc = dayOrder==="asc";
  /* the auto-opened day follows the sort: the top of the page is always the
     day the reader lands on — latest for newest-first, earliest for oldest-first */
  var openTs = asc ? earliest : latest;
  function dayText(content){
    return pajrParseLog(msgOrder==="last" ? pajrReverseMsgs(content) : content, pajrId, qres);
  }
  var html="";
  var years = Object.keys(groups).sort();
  if(!asc) years.reverse();
  years.forEach(function(year,yIdx){
    html+='<details class="pajr-year-acc" '+(yIdx===0?"open":"")+'><summary class="pajr-year-sum"><span>'+year+"</span> "+chevron+"</summary>";
    Object.keys(groups[year]).sort(function(a,b){
      return asc ? monthOrder.indexOf(a)-monthOrder.indexOf(b) : monthOrder.indexOf(b)-monthOrder.indexOf(a);
    }).forEach(function(month,mIdx){
      html+='<details class="pajr-month-acc" '+((yIdx===0&&mIdx===0)?"open":"")+'><summary class="pajr-month-sum"><span>'+month+"</span> "+chevron+"</summary>";
      groups[year][month].sort(function(a,b){
        return asc ? a.ts-b.ts : b.ts-a.ts;
      }).forEach(function(log){
        html+='<details class="pajr-day-acc" '+(log.ts===openTs?"open":"")+'><summary class="pajr-day-summary"><span>📅 '+log.disp+"</span>"+chevron+'</summary><div class="pajr-log-body">'+dayText(log.content)+"</div></details>";
      });
      html+="</details>";
    });
    html+="</details>";
  });
  if(undated.length){
    var und = msgOrder==="last" ? undated.slice().reverse() : undated;
    html+='<details class="pajr-day-acc" open><summary class="pajr-day-summary"><span>Undated</span>'+chevron+'</summary><div class="pajr-log-body">'+und.map(function(b){return dayText(b);}).join("")+"</div></details>";
  }
  return html;
}

/* ── jump to the diary passage a search result cited: pick the right day
   (by entry id → clinical date, else by matching the snippet text), open
   its year/month/day accordions, scroll there, and flash the block ── */
var MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function jumpToL1Citation(l1, find){
  try{
    var rows = (l1 && l1.rows) || [];
    /* the most distinctive piece of the snippet, clear of […] fragment joins */
    var pieces = String(find.snippet||"").replace(/\[\[|\]\]/g,"").split(/…|\.\.\./);
    var frag = pieces.sort(function(a,b){ return b.length-a.length; })[0] || "";
    frag = frag.replace(/\s+/g," ").trim();
    var probe = frag.slice(0, 90).toLowerCase();
    var row = null;
    if(find.id!=null) rows.some(function(r){ if(String(r.id)===String(find.id)){ row=r; return true; } return false; });
    if(!row && probe) rows.some(function(r){
      if(String(r.body||"").replace(/\s+/g," ").toLowerCase().indexOf(probe)>=0){ row=r; return true; } return false; });
    var disp = null;
    if(row && row.clinical_date && /^\d{4}-\d{2}-\d{2}/.test(String(row.clinical_date))){
      var p = String(row.clinical_date).slice(0,10).split("-");
      disp = (+p[2])+" "+MONTHS_EN[+p[1]-1]+" "+(+p[0]);
    }
    var days = document.querySelectorAll(".pajr-day-acc"), day = null, k;
    if(disp) for(k=0;k<days.length;k++){
      var s = days[k].querySelector(".pajr-day-summary");
      if(s && s.textContent.indexOf(disp)>=0){ day = days[k]; break; }
    }
    if(!day && probe) for(k=0;k<days.length;k++){
      if(days[k].textContent.replace(/\s+/g," ").toLowerCase().indexOf(probe)>=0){ day = days[k]; break; }
    }
    if(!day) return;
    var up = day;
    while(up){ if(up.tagName==="DETAILS") up.open = true; up = up.parentElement; }
    var target = null;
    if(probe){
      var blocks = day.querySelectorAll(".pajr-human-block,.pajr-ai-block");
      for(k=0;k<blocks.length;k++){
        if(blocks[k].textContent.replace(/\s+/g," ").toLowerCase().indexOf(probe)>=0){ target = blocks[k]; break; }
      }
    }
    var el = target || day;
    el.scrollIntoView({behavior:"smooth",block:"center"});
    if(target && target.classList){
      target.classList.remove("pajr-highlight-target"); void target.offsetWidth;
      target.classList.add("pajr-highlight-target");
    }
  }catch(e){}
}

function L1View(l1, media, labs, traj, setZoom, pajrId, sortCtl){
  /* labs → per-analyte cards with sparkline */
  var byAnalyte = {};
  (labs||[]).forEach(function(x){
    if(x.value==null) return;
    (byAnalyte[x.analyte] = byAnalyte[x.analyte]||[]).push(x);
  });
  var analytes = Object.keys(byAnalyte);

  function spark(points){
    var vals = points.map(function(p){return Number(p.value);});
    var min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
    var W=200,H=44,P=4, span=(max-min)||1;
    var step = vals.length>1 ? (W-2*P)/(vals.length-1) : 0;
    var d = vals.map(function(v,i){
      return (i?"L":"M")+(P+i*step).toFixed(1)+" "+(H-P-((v-min)/span)*(H-2*P)).toFixed(1);
    }).join(" ");
    return h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:44,marginTop:6},"aria-hidden":true},
      h("path",{d:d,fill:"none",stroke:"var(--teal)",strokeWidth:2.2,strokeLinecap:"round",strokeLinejoin:"round"}),
      vals.length>0 && h("circle",{cx:P+(vals.length-1)*step,cy:H-P-((vals[vals.length-1]-min)/span)*(H-2*P),r:3.2,fill:"var(--coral)"}));
  }

  var dSort = (sortCtl && sortCtl.dSort) || "desc";
  var msgSort = (sortCtl && sortCtl.msgSort) || "first";
  var logHtml = pajrBuildDays(l1.rows, pajrId || "unknown-id", dSort, msgSort);

  /* the diary sort bar — two right-aligned dropdowns: day order, and the
     order of messages within each day */
  var sortBar = sortCtl && h("div",{className:"sortbar"},
    h("select",{className:"sortsel","aria-label":"Order the days",value:dSort,
      onChange:function(e){ sortCtl.setDSort(e.target.value); }},
      h("option",{value:"desc"},"Dates: newest first"),
      h("option",{value:"asc"},"Dates: oldest first")),
    h("select",{className:"sortsel","aria-label":"Order the messages within each day",value:msgSort,
      onChange:function(e){ sortCtl.setMsgSort(e.target.value); }},
      h("option",{value:"first"},"Messages: first sent on top"),
      h("option",{value:"last"},"Messages: last sent on top")));

  return h("div",{className:"stream"},
    traj && traj.narrative && h("div",{className:"card",style:{padding:"20px 24px",marginBottom:22,borderLeft:"3px solid var(--teal)"}},
      h("div",{className:"kicker",style:{color:"var(--teal-deep)",display:"flex",alignItems:"center",gap:7,marginBottom:8}},
        I.spark(13,"var(--teal)"),"AI trajectory summary"),
      h("p",{style:{fontSize:14.5,lineHeight:1.7,whiteSpace:"pre-wrap"}},traj.narrative),
      h("div",{style:{fontSize:11.5,color:"var(--faint)",marginTop:10}},
        (traj.model?traj.model+" · ":"")+"regenerated as the stream evolves")),
    analytes.length>0 && h("div",{style:{marginBottom:26}},
      h("div",{className:"kicker",style:{display:"flex",alignItems:"center",gap:7}},
        I.flask(13,"var(--teal-deep)"),"Extracted lab time-series"),
      h("div",{className:"lab-grid"},
        analytes.map(function(a){
          var pts = byAnalyte[a], last = pts[pts.length-1];
          return h("div",{className:"lab-card",key:a},
            h("div",{className:"a"},a.replace(/_/g," ")),
            h("div",{className:"last"},String(last.value),
              h("span",{className:"u"}," ",last.unit||"")),
            spark(pts),
            h("div",{style:{fontSize:11,color:"var(--faint)",marginTop:2}},
              plural(pts.length,"reading"),
              last.measured_on ? " · last "+fmtDate(last.measured_on) : ""));
        }))),
    sortBar,
    h("div",{className:"pajr-log",dangerouslySetInnerHTML:{__html:logHtml}}),
    l1.count > l1.rows.length && h("p",{style:{textAlign:"center",color:"var(--faint)",fontSize:13,marginTop:18}},
      "Showing the first "+fmtN(l1.rows.length)+" of "+fmtN(l1.count)+" entries."));
}

/* ═══════════════════════ ProJR — journeys, woven together ═══════════════════════
   A ProJR (Project Journey Record) collects patients whose trajectories rhyme.
   The page reads as narratives: an interactive constellation of the members,
   their journeys on one shared timeline, and a story card per patient built
   from their published case report. The Studio lets ANYONE hand-pick cases
   and weave their own ProJR — shareable as a plain link, no account needed. */

var PJHUES = ["var(--teal)","var(--blue)","var(--coral)","var(--amber)","#7C3AED","#DB2777","#0B7A70","#B45309"];
function pjHue(i){ return PJHUES[i % PJHUES.length]; }
function clamp01(v, dflt){ v = (v==null||isNaN(v)) ? dflt : Number(v); return Math.max(0, Math.min(1, v)); }
function truncTitle(s, n){ s=String(s||""); return s.length>n ? s.slice(0,n-1)+"…" : s; }

/* ── the constellation: every member orbits the collective; closer = more similar ── */
function Constellation(props){
  var mem = props.members||[];
  if(!mem.length) return null;
  var n = mem.length;
  var W = 680, H = Math.max(380, 320 + n*6), cx = W/2, cy = H/2 + 6;
  var nodes = mem.map(function(m,i){
    var sim = clamp01(m.similarity, 0.55);
    var a = -Math.PI/2 + i*(2*Math.PI/n);
    var dist = 100 + (1-sim)*110;
    return {m:m, i:i, sim:sim,
      x: cx + Math.cos(a)*dist*1.55,
      y: cy + Math.sin(a)*dist*0.78,
      r: 14 + sim*14, c: pjHue(i)};
  });
  return h("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":"Similarity constellation"},
    nodes.map(function(nd){
      return h("line",{key:"e"+nd.i,className:"pj-edge",x1:cx,y1:cy,x2:nd.x,y2:nd.y,
        stroke:nd.c,strokeWidth:1+nd.sim*2.2,opacity:.55});
    }),
    h("g",null,
      h("circle",{cx:cx,cy:cy,r:44,fill:"var(--blue)",fillOpacity:.1,stroke:"var(--blue)",strokeWidth:2}),
      h("text",{x:cx,y:cy-3,textAnchor:"middle",fontSize:12,fontWeight:800,fill:"var(--ink)"},props.centerLabel||"ProJR"),
      h("text",{x:cx,y:cy+13,textAnchor:"middle",fontSize:10,fontWeight:600,fill:"var(--muted)"},plural(n,"journey"))),
    nodes.map(function(nd){
      return h("g",{key:"n"+nd.i,className:"pj-node",onClick:function(){ if(props.onOpen) props.onOpen(nd.m); }},
        h("title",null,(nd.m.title||nd.m.pajr_id||"case")+(nd.m.similarity!=null?" · "+Math.round(nd.sim*100)+"% similar":"")),
        h("circle",{className:"halo",cx:nd.x,cy:nd.y,r:nd.r+9,fill:nd.c}),
        h("circle",{className:"c",cx:nd.x,cy:nd.y,r:nd.r,fill:nd.c,fillOpacity:.14,stroke:nd.c,strokeWidth:2}),
        nd.m.similarity!=null && h("text",{x:nd.x,y:nd.y+3.5,textAnchor:"middle",fontSize:9.5,fontWeight:800,fill:"var(--ink)"},
          Math.round(nd.sim*100)+"%"),
        h("text",{x:nd.x,y:nd.y+nd.r+15,textAnchor:"middle",fontSize:10.5,fontWeight:600,fill:"var(--muted)"},
          truncTitle(nd.m.title||nd.m.pajr_id, 26)));
    }));
}

/* ── shared-time view: every journey as a bar on one clock ── */
function TimelineStrip(props){
  var mem = (props.members||[]).filter(function(m){ return m.created_at; });
  if(mem.length<2) return null;
  var t0=Infinity, t1=-Infinity;
  mem.forEach(function(m){
    var a=new Date(m.created_at).getTime(), b=new Date(m.updated_at||m.created_at).getTime();
    if(a<t0) t0=a; if(b>t1) t1=b;

async function fetchMemberSummaries(caseIds){
  if(!caseIds.length) return {};
  try{
    var r = await SB.from("layer2_reports")
      .select("case_id,summary,keywords,version")
      .in("case_id", caseIds).eq("is_published",true)
      .order("version",{ascending:false}).limit(400);

    (r.data||[]).forEach(function(x){ if(!map[x.case_id]) map[x.case_id]=x; });
    return map;
  }catch(e){ return {}; }
}

    lede:"A technical reference for researchers, data-protection reviewers and engineers: the data model, the deidentification pipeline and its honest limits, provenance, the search engine, access control, and the terms under which records may be reused.",

    ctaTitle:"Questions about the data?", ctaSub:"We're glad to walk an ethics board or DPO through any of this.",
    toc:toc},
    dH2("d-lex","00","The PaJR Lexicon"),
    P("One vocabulary, used the same way everywhere — in this documentation, the user guide, the interface and our papers. Wherever PaJR Health uses a term below, it means exactly this:"),
    UL([
      [B("PaJR (Patient Journey Record) — "),"the record of ONE person's illness as it unfolds over time: the day-by-day conversation between the patient or their advocate, the care team and the AI. Also the name of the method itself."],
      [B("Case — "),"one patient's journey in this database. One case = one person = one PaJR ID. “Case” never means a disease, a ward, or a collection of patients."],
      [B("PaJR ID — "),"the case's permanent identifier: two words from a fixed 100-word vocabulary plus five digits, e.g. ",h("span",{className:"mono"},"mango-tabla-04217"),". Random, meaningless, never reused."],
      [B("Layer 1 · The Diary (care stream) — "),"that case's own deidentified day-by-day log — messages, clinical images, lab values, in the family's and care team's words. A diary contains only that one patient's stream; community and hospital records are separate corpora and are never part of a case's diary."],
      [B("Layer 2 · The Case Report — "),"the versioned, IMRAD-structured, citable distillation of one case. Once a version is published it belongs to the scholarly record (see the Terms, section 9)."],
      [B("Layer 3 · ProJR (Project Journey Record) — "),"a collective record, not a patient's: a curated group of many cases whose journeys share a condition, theme or trajectory, woven together to show patterns no single journey can. A single patient's story is always a case — never a ProJR."],
      [B("Community Records — "),"conversational care logs from the public community case blogs, grouped per source blog. Same privacy pipeline as everything else; separate provenance from cases."],
      [B("Hospital Records (Portfolios) — "),"case records harvested from hospital and student portfolio blogs. A separate corpus, browsed alongside cases."],
      [B("Daily Stream — "),"the published, deidentified nightly feed from which each case's diary is synced."],
      [B("Media — "),"clinical images, audio and video: EXIF-stripped and redacted before storage, AI-captioned, and linked back to their case and/or source portfolio so they can be cited in context."],
      [B("Deidentified — "),"identifiers removed by the pipeline before publication. Everything readable here, at every access tier, is deidentified — access tiers never decide privacy."],
      [B("Row-by-row gating — "),"access control, not privacy: every record you request is checked inside the datastore against your tier and that record's consent scope. Gating decides how deep you may read (full diaries need researcher access); it never decides whether data is identified — nothing identified exists here to gate."],
      [B("Living record vs published record — "),"the living record (diary, media, drafts) is fully withdrawable on consent withdrawal; published report versions remain part of the scholarly record, with corrections and redactions handled per the Terms."]
    ]),
    P(h("em",null,"This lexicon is normative: if any page of ours contradicts it, the lexicon wins and the page is a bug — please report it.")),
    dH2("d-over","01","Overview"),
    P("The database is a single reading surface over a secured clinical datastore. Every read is checked row by row against your access tier inside the datastore itself — the interface holds no data of its own, so what you read is always the live, access-controlled record."),
    P("Content is organised into the three layers described in the ",h("a",{href:"#",onClick:function(e){e.preventDefault();nav("guide");}},"user guide"),". This document describes what sits underneath them."),
    dH2("d-model","02","Data model"),
    P("The three layers are narrated in the ",h("a",{href:"#",onClick:function(e){e.preventDefault();nav("guide");}},"user guide")," and defined in the Lexicon above — this section records only the technical shape around them. Beside the layered case records sit: the clinical media library (EXIF-stripped, AI-captioned, text-indexed), extracted laboratory time-series for longitudinal analysis, and the ",B("community and hospital corpora")," — two separate collections of conversational logs already published on public case blogs, distinct from any case's diary."),
    P("Nothing in the datastore ever holds a name, a date of birth or a contact detail — records are deidentified before they enter it (see below)."),
    dH2("d-types","03","Record types"),
    P("The three collections you browse in the sidebar:"),
    UL([
      [B("PaJR Health Database")," — curated journeys, each with its diary and case report."],
      [B("Community Records")," — conversational care logs from the community, grouped per case."],
      [B("Hospital Records")," — portfolio case records from hospital settings, grouped per case."]
    ]),
    dH2("d-id","04","The PaJR ID scheme"),
    P("Each case is identified by ",B("word-word-NNNNN"),": two words from a fixed 100-word vocabulary followed by a five-digit number, e.g. ",h("span",{className:"mono"},"saffron-idli-30188"),". The vocabulary is a curated set of everyday, non-clinical Indian words (foods, plants, objects) chosen to be memorable and to carry no information about the person."),
    P("The arithmetic: the 100-word vocabulary yields 100 × 100 = 10,000 two-word prefixes; each prefix carries 100,000 five-digit numbers (00000–99999); together, 10,000 × 100,000 = one billion possible IDs. And because the identifier is random and meaningless, it is safe to print in a citation or say aloud in a meeting."),
    dH2("d-cats","05","Clinical categories"),
    P("Categories are lightweight clinical tags (for example ",h("em",null,"diabetes, snakebite, nephrology, dermatology"),") attached to each case and derived from its content. They power the browse tree in the rail and the category filters. A case can carry several categories; the counts you see are computed live from whatever is currently loaded and visible to your tier."),
    dH2("d-deid","06","The deidentification pipeline"),
    P("Before anything reaches this database it passes through a multi-stage deidentification pipeline aimed at the eighteen HIPAA Safe Harbor identifier types and the identifiers called out under India's DPDP Act:"),
    OL([
      [B("Text scrubbing — "),"names, phone numbers, e-mail addresses, exact addresses, record numbers, and explicit dates are detected and removed or generalised (ages become age bands; precise dates become clinical day-offsets)."],
      [B("Image sanitisation — "),"every clinical image is EXIF-stripped (removing GPS, device and timestamp metadata) and reviewed; burned-in identifiers on documents and radiology are redacted where detected."],
      [B("Structured minimisation — "),"the case record itself stores only an age band, sex, coarse region and clinical status — never a name, date of birth or contact detail."],
      [B("Human curation — "),"cases are reviewed by the care team before a Layer 2 report is published; publication is an explicit, revocable act."]

    NOTE("ok","Consent first",P("Records originate from care relationships with informed, revocable consent, and are published on public case blogs before they are indexed here. This database re-presents already-public, deidentified material — it does not open a new window onto private data.")),
    dH2("d-residual","07","Residual PII — please read"),

/* ═══════════════════ error boundary — a crash on one page must never
   blank the whole app; show what broke instead ═══════════════════ */
function ErrBound(props){ React.Component.call(this, props); this.state = {err:null}; }
ErrBound.prototype = Object.create(React.Component.prototype);
ErrBound.prototype.constructor = ErrBound;
ErrBound.getDerivedStateFromError = function(e){ return {err:e}; };
ErrBound.prototype.componentDidCatch = function(e){ try{ console.error("PaJR page error:", e); }catch(_){} };
ErrBound.prototype.render = function(){
  if(this.state.err) return h("div",{className:"page"},
    h("div",{className:"empty-box"},
      h("div",{className:"big"},"Something went wrong on this page"),
      h("div",{style:{fontSize:12.5,marginTop:6,color:"var(--muted)"}},
        String((this.state.err && this.state.err.message) || this.state.err)),
      h("button",{className:"btn btn-primary",style:{marginTop:14},
        onClick:function(){ location.reload(); }},"Reload the page")));
  return this.props.children;
};

/* ═══════════════════════ root app ═══════════════════════ */
function App(){
  var st  = useState(parseHash()); var route = st[0], setRoute = st[1];
  var st2 = useState(undefined);   var sess = st2[0], setSess = st2[1];   /* undefined=booting, null=anon */
  var st3 = useState(null);        var profile = st3[0], setProfile = st3[1];
  var st4 = useState(null);        var stats = st4[0], setStats = st4[1];
  var st5 = useState(false);       var browsing = st5[0], setBrowsing = st5[1];
  var st6 = useState("checking");  var conn = st6[0], setConn = st6[1];
  var st7 = useState(getTheme());  var theme = st7[0], setTheme = st7[1];
  var st8 = useState(false);       var railClosed = st8[0], setRailClosed = st8[1];
  var st9 = useState(false);       var railOpenMob = st9[0], setRailOpenMob = st9[1];
  function toggleTheme(){ var t = theme==="dark" ? "light" : "dark"; setTheme(t); applyTheme(t); }
  function toggleRail(){ if(window.innerWidth<=1000) setRailOpenMob(function(v){return !v;}); else setRailClosed(function(v){return !v;}); }

  /* routing — path pushes, back/forward, and legacy hash links */
  useEffect(function(){
    function onNav(){ setRoute(parseHash()); }
    window.addEventListener("hashchange", onNav);
    window.addEventListener("popstate", onNav);
    window.addEventListener("pajr:nav", onNav);
    return function(){
      window.removeEventListener("hashchange", onNav);
      window.removeEventListener("popstate", onNav);
      window.removeEventListener("pajr:nav", onNav);
    };
  },[]);

  /* auth boot + listener */
  useEffect(function(){
    if(!SB) return;
    /* window.__pajrSess mirrors this for useSession() — see the login pass */
    SB.auth.getSession().then(function(r){ var v=(r.data && r.data.session) || null; window.__pajrSess=v; setSess(v); });
    var sub = SB.auth.onAuthStateChange(function(_e, s){ window.__pajrSess = s || null; setSess(s || null); });
    return function(){ try{ sub.data.subscription.unsubscribe(); }catch(e){} };
  },[]);

  /* profile (role/tier) after sign-in. `pBump` lets a fresh Stripe payment
     force a re-read once the webhook has had a moment to land. */
  var stP = useState(0); var pBump = stP[0], setPBump = stP[1];
  useEffect(function(){
    if(!SB || !sess){ setProfile(null); return; }
    var uid = sess.user && sess.user.id;
    if(!uid) return;
    SB.from("profiles").select("role,tier,tier_expires").eq("id",uid).maybeSingle()
      .then(function(r){ setProfile(r.data || {role:"reader",tier:"free"}); });
  },[sess, pBump]);

  /* Coming back from Stripe (…/?billing=success|cancelled — set by
     RESEARCH_FRONTEND in server.js). Say what happened, tidy the URL, and
     re-read the tier a couple of times while the webhook catches up. */
  useEffect(function(){
    var q;
    try{ q = new URLSearchParams(window.location.search).get("billing"); }catch(e){ return; }
    if(!q) return;
    try{ window.history.replaceState({}, "", window.location.pathname); }catch(e){}
    if(q==="success"){
      txToast("Payment received — switching your researcher access on. This can take a few seconds.", 9000);
      var t1 = setTimeout(function(){ setPBump(function(v){return v+1;}); }, 4000);
      var t2 = setTimeout(function(){ setPBump(function(v){return v+1;}); }, 15000);
      return function(){ clearTimeout(t1); clearTimeout(t2); };
    }
    if(q==="cancelled") txToast("Checkout cancelled — nothing was charged.", 5000);
  },[]);

  /* stats + connection health */
  var loadStats = useCallback(function(){
    if(!SB) return;
    setConn("checking");
    fetchStats().then(function(s){
      setStats(s);
      setConn(s && s.cases!=null ? "ok" : "bad");
    }).catch(function(){ setConn("bad"); });
  },[]);
  useEffect(function(){ loadStats(); },[loadStats, sess]);

  if(!CONFIGURED) return SetupScreen();
  if(sess===undefined) return h("div",{className:"setup-wrap"},Spinner("Waking the database…"));

  /* effective tier for UI (RLS is the real enforcement) */
  var tier = "public";
  if(sess){
    tier = "free";
    if(profile){
      var live = !profile.tier_expires || new Date(profile.tier_expires) > new Date();
      if(profile.role==="admin") tier = "admin";
      else if(profile.role==="curator") tier = "curator";
      else if(profile.tier==="researcher" && live) tier = "researcher";
    }
  }
  var isStaff = tier==="admin" || tier==="curator";
  var isResearcher = isStaff || tier==="researcher";

  /* The "welcome" route shows the full-screen brand landing / sign-in.
     Everyone else lands straight in the database (public browsing by default),
     with sign-in living in the left rail — mirroring pajrhealth.com. */
  if(route.view==="welcome"){
    return h(React.Fragment,null,
      h(Gate,{stats:stats, theme:theme, onTheme:toggleTheme, onBrowse:function(){ nav("library"); }}),
      h(AccessModal,null),
      ConnDot(conn, loadStats));
  }

  var body;
  if(route.view==="case" && route.arg) body = h(CasePage,{pajrId:route.arg, key:route.arg, signedIn:!!sess, isResearcher:isResearcher, isStaff:isStaff});
  else if(route.view==="pajr" && route.arg)      body = h(CorpusViewer,{kind:"pajr", link:route.arg, key:"pajr:"+route.arg});
  else if(route.view==="portfolio" && route.arg) body = h(CorpusViewer,{kind:"portfolio", link:route.arg, key:"port:"+route.arg});
  else if(route.view==="projrs")       body = h(ProjrsPage,{});
  else if(route.view==="projr" && route.arg) body = h(ProjrPage,{slug:route.arg, key:route.arg});
  else if(route.view==="studio")       body = h(StudioPage,{arg:route.arg||"", key:"studio:"+(route.arg||"")});
  else if(route.view==="search")       body = h(SearchPage,{q:route.arg||""});
  else if(route.view==="guide")        body = h(GuidePage,{});
  else if(route.view==="docs")         body = h(DocsPage,{});
  else if(route.view==="terms")        body = h(TermsPage,{});
  else if(route.view==="about")        body = h(AboutPage,{});
  else if(route.view==="consent-form") body = h(ConsentFormPage,{});
  else if(route.view==="community-guidelines") body = h(GuidelinesPage,{});
  else if(route.view==="notfound")     body = h(NotFoundPage,{path:route.arg||""});
  else                                 body = h(Library,{arg:route.arg||""});

  /* the rail is persistent — one calm column beside every page */
  return h(React.Fragment,null,
    h(Topbar,{theme:theme, view:route.view, onTheme:toggleTheme, onToggleRail:toggleRail}),
    h("div",{className:"db-layout"+(railClosed?" railclosed":"")+(railOpenMob?" railopen":"")},
      h(Rail,{sess:sess, tier:tier, route:route, theme:theme, onTheme:toggleTheme,
        onNavDone:function(){ if(window.innerWidth<=1000) setRailOpenMob(false); }}),
      h("div",{className:"rail-scrim",onClick:function(){ setRailOpenMob(false); }}),
      h("div",{className:"dbmain-col"},
        h(SignInStrip,{sess:sess}),
        h(ErrBound,{key:route.view+"/"+(route.arg||"")}, body),
        h(Footer,null))),
    h(SearchTray,null),
    h(MediaLightbox,null),
    h(SignInModal,null),
    h(AccessModal,null),
    ConnDot(conn, loadStats));
}

function ConnDot(conn, retry){
  if(conn==="ok") return null;   /* quiet when healthy */
  return h("button",{className:"conn-dot "+(conn==="bad"?"conn-bad":"conn-ok"),
    onClick:retry, title:"Click to retry",style:{border:"1px solid var(--line)",cursor:"pointer"}},
    h("i",null),
    conn==="checking" ? "Connecting to the PaJR database…" : "Database unreachable — click to retry");
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
